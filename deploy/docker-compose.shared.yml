# Explicit opt-in overlay, never loaded by dedicated deployments.
# Render/review with: docker compose -f deploy/docker-compose.yml -f deploy/docker-compose.shared.yml config
# NOT deployment authorization. Requires Compose supporting !reset (2.24.4+).
services:
  proxy:
    ports: !override
      - "${WEBVUE_EDGE_BIND:-0.0.0.0}:${WEBVUE_EDGE_HTTPS_PORT:-443}:443"
      - "${WEBVUE_EDGE_BIND:-0.0.0.0}:${WEBVUE_EDGE_HTTP_PORT:-80}:80"
    volumes:
      - ./shared/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
    networks: [edge]
    depends_on:
      guard: { condition: service_healthy }

  guard:
    image: webvue-guard:${WEBVUE_IMAGE_TAG:?set WEBVUE_IMAGE_TAG}
    build:
      context: ..
      dockerfile: deploy/shared/Dockerfile
    restart: unless-stopped
    ports: !reset []
    environment:
      WEBVUE_TENANCY_MODE: shared
      WEBVUE_TENANT_REGISTRY_PATH: /etc/webvue/registry.json
      WEBVUE_SHARED_PROXY_TOKEN: ${WEBVUE_SHARED_PROXY_TOKEN:?set WEBVUE_SHARED_PROXY_TOKEN}
      WEBVUE_SESSION_KEYS: ${WEBVUE_SESSION_KEYS:?set WEBVUE_SESSION_KEYS}
      WEBVUE_SESSION_ACTIVE_KID: ${WEBVUE_SESSION_ACTIVE_KID:?set WEBVUE_SESSION_ACTIVE_KID}
      WEBVUE_GUARD_ODOO_URL: http://odoo:8069
      WEBVUE_GUARD_WEB_URL: http://web:3000
      WEBVUE_GUARD_WS_URL: http://odoo:8072
      WEBVUE_GUARD_PORT: "8080"
    volumes:
      - ${WEBVUE_TENANT_REGISTRY_DIR:?set WEBVUE_TENANT_REGISTRY_DIR}:/etc/webvue:ro
    expose: ["8080"]
    networks: [edge, guard_web, guard_odoo]
    healthcheck:
      test: ["CMD", "node", "deploy/shared/healthcheck.mjs"]
      interval: 5s
      timeout: 3s
      retries: 20
    depends_on:
      web: { condition: service_healthy }
      odoo: { condition: service_healthy }

  web:
    build:
      args:
        WEBVUE_TENANCY_MODE: shared
    ports: !reset []
    networks: [guard_web]
    environment:
      NUXT_ODOO_URL: http://guard:8080
      NUXT_ODOO_DB: ""
      NUXT_PUBLIC_WS_URL: ""
      WEBVUE_TENANCY_MODE: shared
      WEBVUE_TENANT_REGISTRY_PATH: /etc/webvue/registry.json
      WEBVUE_SHARED_PROXY_TOKEN: ${WEBVUE_SHARED_PROXY_TOKEN:?set WEBVUE_SHARED_PROXY_TOKEN}
    volumes:
      - ${WEBVUE_TENANT_REGISTRY_DIR:?set WEBVUE_TENANT_REGISTRY_DIR}:/etc/webvue:ro
    # Liveness only: no tokenless HTTP auth bypass and no guard dependency cycle.
    healthcheck:
      test: ["CMD", "node", "-e", "const s=require('node:net').connect(3000,'127.0.0.1',()=>{s.end();process.exit(0)});s.setTimeout(2000,()=>process.exit(1));s.on('error',()=>process.exit(1))"]

  odoo:
    # Validation runs before the existing secure launcher; no CLI overrides.
    entrypoint: ["/opt/venv/bin/python", "/opt/webvue/shared/launch_odoo.py"]
    command: []
    environment:
      WEBVUE_TENANCY_MODE: shared
    ports: !reset []
    networks: [guard_odoo, database]
    # TCP listener check: shared mode dbfilter=^%h$ / list_db=False means localhost selects no DB,
    # so /web/health cannot pass. The venv python exists in the image (deploy/odoo/Dockerfile).
    healthcheck:
      test: ["CMD", "/opt/venv/bin/python", "-c", "import socket; s = socket.socket(); s.settimeout(2); s.connect(('127.0.0.1', 8069)); s.close()"]
    volumes:
      - ${WEBVUE_SHARED_ODOO_CONFIG:?set WEBVUE_SHARED_ODOO_CONFIG to validated external secret config}:/etc/odoo/odoo.conf:ro
      - odoo_data:/var/lib/odoo

  ai:
    ports: !reset []
    networks: [guard_web, database]

  db:
    ports: !reset []
    networks: [database]

networks:
  edge: {}
  guard_web: { internal: true }
  guard_odoo: { internal: true }
  database: { internal: true }
