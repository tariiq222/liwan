# Explicit opt-in overlay, never loaded by dedicated deployments.
# Render/review with: docker compose -f deploy/docker-compose.yml -f deploy/docker-compose.shared.yml config
# NOT deployment authorization. Requires Compose supporting !reset (2.24.4+).
services:
  proxy:
    ports: !override
      - "${LIWAN_EDGE_BIND:-0.0.0.0}:${LIWAN_EDGE_HTTPS_PORT:-443}:443"
      - "${LIWAN_EDGE_BIND:-0.0.0.0}:${LIWAN_EDGE_HTTP_PORT:-80}:80"
    environment:
      # Give Caddy a reserved address when the TikTok host is unset or empty.
      LIWAN_TIKTOK_RELAY_HOST: ${LIWAN_TIKTOK_RELAY_HOST:-invalid.invalid}
      # The operator allowlist for restore hosts (`remote_ip` syntax). Deliberately no default: unset or empty
      # answers 404 for every `*.restore.<domain>` host, so a stack cannot expose a restored database by omission.
      LIWAN_RESTORE_ALLOW: ${LIWAN_RESTORE_ALLOW:-}
      # The restore wildcard's own suffix, which must be the control plane's `domainSuffix`. It is not derived from
      # `DOMAIN`, a site-address list that may hold several tenant hosts.
      LIWAN_RESTORE_DOMAIN: ${LIWAN_RESTORE_DOMAIN:-invalid.invalid}
    volumes:
      - ./shared/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
    networks: [edge]
    depends_on:
      guard: { condition: service_healthy }

  guard:
    image: liwan-guard:${LIWAN_IMAGE_TAG:?set LIWAN_IMAGE_TAG}
    build:
      context: ..
      dockerfile: deploy/shared/Dockerfile
    restart: unless-stopped
    ports: !reset []
    environment:
      LIWAN_TENANCY_MODE: shared
      LIWAN_TENANT_REGISTRY_PATH: /etc/liwan/registry.json
      # Restore targets, published by the control plane into `<state>/restore-registry`, are served by restore-odoo.
      LIWAN_RESTORE_REGISTRY_PATH: /etc/liwan-restore/registry.json
      LIWAN_SHARED_PROXY_TOKEN: ${LIWAN_SHARED_PROXY_TOKEN:?set LIWAN_SHARED_PROXY_TOKEN}
      LIWAN_SESSION_KEYS: ${LIWAN_SESSION_KEYS:?set LIWAN_SESSION_KEYS}
      LIWAN_SESSION_ACTIVE_KID: ${LIWAN_SESSION_ACTIVE_KID:?set LIWAN_SESSION_ACTIVE_KID}
      LIWAN_GUARD_ODOO_URL: http://odoo:8069
      LIWAN_GUARD_WEB_URL: http://web:3000
      LIWAN_GUARD_WS_URL: http://odoo:8072
      LIWAN_GUARD_RESTORE_ODOO_URL: http://restore-odoo:8069
      LIWAN_GUARD_RESTORE_WS_URL: http://restore-odoo:8072
      LIWAN_GUARD_PORT: "8080"
    volumes:
      - ${LIWAN_TENANT_REGISTRY_DIR:?set LIWAN_TENANT_REGISTRY_DIR}:/etc/liwan:ro
      # The control plane's restore-registry directory (its `<stateDir>/restore-registry`). Read-only, like the tenant registry.
      - ${LIWAN_RESTORE_REGISTRY_DIR:-./data/restore-registry}:/etc/liwan-restore:ro
    expose: ["8080"]
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    read_only: true
    tmpfs: ["/tmp"]
    networks: [edge, guard_web, guard_odoo, guard_restore]
    healthcheck:
      test: ["CMD", "node", "deploy/shared/healthcheck.mjs"]
      interval: 5s
      timeout: 3s
      retries: 20
    depends_on:
      web: { condition: service_healthy }
      odoo: { condition: service_healthy }

  web:
    build:
      args:
        LIWAN_TENANCY_MODE: shared
    ports: !reset []
    # `!override`, not a plain list: the base file now declares [default, ai_internal] and Compose unions the two
    # lists otherwise. In shared mode `ai` is already on guard_web, so web needs nothing else.
    networks: !override [guard_web]
    environment:
      NUXT_ODOO_URL: http://guard:8080
      NUXT_ODOO_DB: ""
      NUXT_PUBLIC_WS_URL: ""
      LIWAN_TENANCY_MODE: shared
      LIWAN_TENANT_REGISTRY_PATH: /etc/liwan/registry.json
      LIWAN_RESTORE_REGISTRY_PATH: /etc/liwan-restore/registry.json
      LIWAN_SHARED_PROXY_TOKEN: ${LIWAN_SHARED_PROXY_TOKEN:?set LIWAN_SHARED_PROXY_TOKEN}
    volumes:
      - ${LIWAN_TENANT_REGISTRY_DIR:?set LIWAN_TENANT_REGISTRY_DIR}:/etc/liwan:ro
      - ${LIWAN_RESTORE_REGISTRY_DIR:-./data/restore-registry}:/etc/liwan-restore:ro
    # Liveness only: no tokenless HTTP auth bypass and no guard dependency cycle.
    healthcheck:
      test: ["CMD", "node", "-e", "const s=require('node:net').connect(3000,'127.0.0.1',()=>{s.end();process.exit(0)});s.setTimeout(2000,()=>process.exit(1));s.on('error',()=>process.exit(1))"]

  odoo:
    # Validation runs before the existing secure launcher; no CLI overrides.
    entrypoint: ["/opt/venv/bin/python", "/opt/liwan/shared/launch_odoo.py"]
    command: []
    environment:
      LIWAN_TENANCY_MODE: shared
      # A shared tenant registers its connected TikTok account with the relay (D13) and exchanges
      # codes with the platform app; a deployment without these keeps its own direct webhook, so an
      # empty value must render instead of stopping the stack.
      LIWAN_TIKTOK_RELAY_URL: ${LIWAN_TIKTOK_RELAY_URL:-http://tiktok-relay:8090}
      LIWAN_SHARED_PROXY_TOKEN: ${LIWAN_SHARED_PROXY_TOKEN:?set LIWAN_SHARED_PROXY_TOKEN}
      LIWAN_TIKTOK_CLIENT_KEY: ${LIWAN_TIKTOK_CLIENT_KEY:-}
      LIWAN_TIKTOK_CLIENT_SECRET: ${LIWAN_TIKTOK_CLIENT_SECRET:-}
      LIWAN_TIKTOK_REDIRECT_URI: ${LIWAN_TIKTOK_RELAY_HOST:+https://${LIWAN_TIKTOK_RELAY_HOST}/tiktok/oauth/callback}
    ports: !reset []
    # `relay_odoo` carries the TikTok relay's binding calls (D13). It is internal and reaches only the
    # relay, so Odoo keeps it whether or not this deployment runs the app.
    networks: !override
      - guard_odoo
      - database
      - relay_odoo
    # TCP listener check: shared mode dbfilter=^%h$ / list_db=False means localhost selects no DB,
    # so /web/health cannot pass. The venv python exists in the image (deploy/odoo/Dockerfile).
    healthcheck:
      test: ["CMD", "/opt/venv/bin/python", "-c", "import socket; s = socket.socket(); s.settimeout(2); s.connect(('127.0.0.1', 8069)); s.close()"]
    volumes:
      - ${LIWAN_SHARED_ODOO_CONFIG:?set LIWAN_SHARED_ODOO_CONFIG to validated external secret config}:/etc/odoo/odoo.conf:ro
      - odoo_data:/var/lib/odoo

  ai:
    ports: !reset []
    # Shared mode: the tenant registry maps a tenant id to its database; no single tenant database here.
    # The platform provider file comes from the control plane: set LIWAN_AI_PLATFORM_DIR (read by the base file's /etc/liwan-ai mount) to the
    # directory the control plane writes platform-provider.json into (its LIWAN_AI_PLATFORM_PROVIDER_PATH), one-way and read-only here, like the registry.
    environment:
      LIWAN_TENANCY_MODE: shared
      LIWAN_TENANT_REGISTRY_PATH: /etc/liwan/registry.json
      AI_TENANT_DATABASE: ""
    volumes:
      - ${LIWAN_TENANT_REGISTRY_DIR:?set LIWAN_TENANT_REGISTRY_DIR}:/etc/liwan:ro
    # ai_internal is added to guard_web and database (both internal); the proxy is its only way out.
    # `!override` states the complete list, so inheritance cannot silently add a routed network later.
    networks: !override [guard_web, database, ai_internal]

  ai-egress:
    # Egress needs one network with a route off the host: the edge, never a customer-facing service network.
    # `!override` drops the base file's `default` network, which has a route out but is not declared here.
    networks: !override [ai_internal, edge]

  db:
    ports: !reset []
    # `!override`: the base file declares [default, ai_internal], and adding `database` must not keep `default`.
    networks: !override [database]

  # The platform TikTok app has one webhook and one OAuth redirect for every tenant (D13/D14).
  # The relay verifies them and reaches the tenant through its public origin; only the edge
  # reaches the relay's public routes, and only Odoo reaches its internal binding routes.
  # It needs the app secret, so it belongs to a deployment that runs the app: start it with
  # `--profile tiktok` (the app is off otherwise and every TikTok route answers
  # `inbox_tiktok_not_configured`). The relay refuses to start without a secret by design.
  tiktok-relay:
    profiles: [tiktok]
    image: liwan-guard:${LIWAN_IMAGE_TAG:?set LIWAN_IMAGE_TAG}
    build:
      context: ..
      dockerfile: deploy/shared/Dockerfile
    restart: unless-stopped
    command: ["node", "deploy/shared/tiktok-relay.mjs"]
    environment:
      LIWAN_TENANCY_MODE: shared
      LIWAN_TENANT_REGISTRY_PATH: /etc/liwan/registry.json
      LIWAN_TIKTOK_BINDINGS_PATH: /var/lib/liwan/tiktok-bindings.json
      # The relay belongs to the `tiktok` profile. An app that is not configured leaves the secret
      # empty and the relay exits cleanly at start: `createTiktokRelay` refuses an empty secret by
      # design, so `start()` treats that one refusal as "this deployment runs no TikTok app".
      LIWAN_TIKTOK_CLIENT_SECRET: ${LIWAN_TIKTOK_CLIENT_SECRET:-}
      LIWAN_SHARED_PROXY_TOKEN: ${LIWAN_SHARED_PROXY_TOKEN:?set LIWAN_SHARED_PROXY_TOKEN}
      LIWAN_TIKTOK_RELAY_PORT: "8090"
    volumes:
      - ${LIWAN_TENANT_REGISTRY_DIR:?set LIWAN_TENANT_REGISTRY_DIR}:/etc/liwan:ro
      - tiktok_bindings:/var/lib/liwan
    expose: ["8090"]
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    read_only: true
    tmpfs: ["/tmp"]
    networks: [edge, relay_odoo]
    healthcheck:
      test: ["CMD", "node", "-e", "const s=require('node:net').connect(8090,'127.0.0.1',()=>{s.end();process.exit(0)});s.setTimeout(2000,()=>process.exit(1));s.on('error',()=>process.exit(1))"]
      interval: 5s
      timeout: 3s
      retries: 20

  # The restore profile (`--profile restore`, the only profile tools/shared_saas_lifecycle/odoo_backup.py selects) is
  # the isolated copy of Postgres and Odoo that a verified backup is restored into. Neither service starts with the
  # stack. They share no network with `db` or `odoo`, so a restored tenant can reach the live database and the live
  # database cannot reach it; only the guard reaches restore-odoo, and only for hosts in the restore registry.
  restore-db:
    profiles: [restore]
    # The same pinned image as `db`: the restore runner refuses a Postgres image that differs from the backup's.
    image: pgvector/pgvector:pg16@sha256:0dd3149a06e4579a0d70d8fef9945636cd514005e7237deb27f9b67886f8dc4f
    restart: unless-stopped
    networks: [restore_database]
    user: postgres
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    read_only: true
    tmpfs: ["/tmp", "/var/run/postgresql:uid=999,gid=999"]
    environment:
      POSTGRES_DB: postgres
      POSTGRES_USER: odoo
      POSTGRES_PASSWORD: "${DB_PASSWORD}"
      AI_DB_PASSWORD: "${AI_DB_PASSWORD:-}"
    volumes:
      - restore_db_data:/var/lib/postgresql/data
      - ./ai/init-db.sh:/docker-entrypoint-initdb.d/20-liwan-ai.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U odoo"]
      interval: 5s
      timeout: 5s
      retries: 20

  restore-odoo:
    profiles: [restore]
    # The same image as `odoo`: the restore runner refuses an Odoo image that differs from the backup's.
    image: liwan-odoo:${LIWAN_IMAGE_TAG:?set LIWAN_IMAGE_TAG}
    restart: unless-stopped
    entrypoint: ["/opt/venv/bin/python", "/opt/liwan/shared/launch_odoo.py"]
    # No scheduled job runs against a recovered database: the validator refuses any other argument set.
    command: ["--max-cron-threads=0"]
    environment:
      # No LIWAN_SHARED_PROXY_TOKEN: Odoo reads it only for the TikTok relay, which restore-odoo cannot reach, and the
      # live token must never sit in a service that opens restored customer data.
      LIWAN_TENANCY_MODE: shared
      # Marks this as the restore role: the validator then enforces `--max-cron-threads=0` and refuses anything else.
      LIWAN_RESTORE_ROLE: "1"
    networks: [guard_restore, restore_database]
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    expose: ["8069", "8072"]
    healthcheck:
      test: ["CMD", "/opt/venv/bin/python", "-c", "import socket; s = socket.socket(); s.settimeout(2); s.connect(('127.0.0.1', 8069)); s.close()"]
      interval: 5s
      timeout: 10s
      retries: 20
    volumes:
      # A validated external config whose db_host is restore-db, never a copy of the live one. The default is the
      # incomplete reference file, which the shared startup validator rejects, so the service cannot start unconfigured.
      - ${LIWAN_RESTORE_ODOO_CONFIG:-./shared/odoo.restore.conf}:/etc/odoo/odoo.conf:ro
      - restore_odoo_data:/var/lib/odoo
    depends_on:
      restore-db: { condition: service_healthy }

networks:
  edge: {}
  guard_web: { internal: true }
  guard_odoo: { internal: true }
  database: { internal: true }
  ai_internal: { internal: true }
  # Odoo registers each connected TikTok account with the relay over this internal network.
  relay_odoo: { internal: true }
  # The restore profile: the guard reaches restore-odoo, and restore-odoo reaches restore-db, over networks the live
  # `guard_odoo` and `database` networks never share.
  guard_restore: { internal: true }
  restore_database: { internal: true }

volumes:
  tiktok_bindings: {}
  restore_db_data: {}
  restore_odoo_data: {}
