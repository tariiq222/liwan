services:
  proxy:
    image: liwan-caddy:${LIWAN_IMAGE_TAG:?set LIWAN_IMAGE_TAG to the built image tag}
    build:
      context: ..
      dockerfile: deploy/proxy/Dockerfile
    restart: unless-stopped
    ports: ["80:80", "443:443"]
    environment: { DOMAIN: "${DOMAIN}" }
    # Non-root image user; the binary's file capability is the only way it binds 80/443.
    cap_drop: [ALL]
    cap_add: [NET_BIND_SERVICE]
    read_only: true
    tmpfs: ["/tmp", "/config:uid=10002,gid=10002"]
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
    depends_on:
      web: { condition: service_healthy }
      odoo: { condition: service_healthy }

  web:
    build: { context: .., dockerfile: apps/web/Dockerfile }
    restart: unless-stopped
    # The AI service is reachable only on the internal ai_internal network (see `ai` and `ai-egress`).
    networks: [default, ai_internal]
    environment:
      NUXT_ODOO_URL: http://odoo:8069
      NUXT_ODOO_DB: "${DB_NAME}"
      NUXT_AUTH_PROXY_CLIENT_IP_HEADER: x-liwan-client-ip
      NUXT_AI_SERVICE_URL: "${NUXT_AI_SERVICE_URL:-}"
      NUXT_AI_SERVICE_TOKEN: "${AI_SERVICE_TOKEN:-}"
      # web only: the ai service must never hold the key that opens the tokens it is given.
      NUXT_AI_TOKEN_KEY: "${AI_TOKEN_KEY:-}"
    expose: ["3000"]
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    read_only: true
    tmpfs: ["/tmp"]
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:3000/login').then(r => process.exit(r.ok ? 0 : 1), () => process.exit(1))"]
      interval: 5s
      timeout: 10s
      retries: 20
    depends_on:
      odoo: { condition: service_healthy }

  odoo:
    image: liwan-odoo:${LIWAN_IMAGE_TAG:?set LIWAN_IMAGE_TAG to the built image tag}
    build:
      context: ..
      dockerfile: deploy/odoo/Dockerfile
      args:
        ODOO_COMMIT: ${ODOO_COMMIT:?set ODOO_COMMIT from deploy/odoo/ODOO_COMMIT}
    restart: unless-stopped
    command: ["--workers", "2", "--proxy-mode"]
    environment:
      HOST: db
      USER: odoo
      PASSWORD: "${DB_PASSWORD}"
      LIWAN_INBOX_SECRET_KEY: "${LIWAN_INBOX_SECRET_KEY:-}"
    volumes:
      - ./data/odoo.conf:/etc/odoo/odoo.conf:ro
      - odoo_data:/var/lib/odoo
    expose: ["8069", "8072"]
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    healthcheck:
      test: ["CMD", "/opt/venv/bin/python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8069/web/health', timeout=2)"]
      interval: 5s
      timeout: 10s
      retries: 20
    depends_on:
      db: { condition: service_healthy }

  ai:
    profiles: [ai]
    build: { context: ../apps/ai-service }
    restart: unless-stopped
    # No route off the host: the only way out is the ai-egress allowlist proxy below.
    networks: [ai_internal]
    environment:
      AI_PROVIDER: "${AI_PROVIDER:-ollama}"
      AI_MODEL: "${AI_MODEL:-}"
      AI_API_KEY: "${AI_API_KEY:-}"
      AI_BASE_URL: "${AI_BASE_URL:-}"
      AI_OPENROUTER_REFERER: "${AI_OPENROUTER_REFERER:-}"
      AI_OPENROUTER_TITLE: "${AI_OPENROUTER_TITLE:-}"
      AI_DATABASE_URL: "${AI_DATABASE_URL:-}"
      # Empty here so a stack without the ai profile still renders; the service refuses to start without it
      # (Settings), and provision.sh generates it whenever the profile is enabled (deploy/ai/ensure_secrets.sh).
      AI_SERVICE_TOKEN: "${AI_SERVICE_TOKEN:-}"
      # Encrypt each tenant's own provider key (generated by ensure_secrets.sh; empty leaves tenant keys unavailable).
      AI_KEY_ENCRYPTION_KEYS: "${AI_KEY_ENCRYPTION_KEYS:-}"
      AI_KEY_ENCRYPTION_KEY_ID: "${AI_KEY_ENCRYPTION_KEY_ID:-}"
      # The window a newly bootstrapped tenant starts with; its administrator changes it in the AI settings.
      AI_RUN_RETENTION_DAYS: "${AI_RUN_RETENTION_DAYS:-30}"
      # Knowledge retrieval embeddings; unset AI_EMBEDDING_PROVIDER leaves knowledge off.
      AI_EMBEDDING_PROVIDER: "${AI_EMBEDDING_PROVIDER:-}"
      AI_EMBEDDING_MODEL: "${AI_EMBEDDING_MODEL:-}"
      AI_EMBEDDING_BASE_URL: "${AI_EMBEDDING_BASE_URL:-}"
      AI_EMBEDDING_API_KEY: "${AI_EMBEDDING_API_KEY:-}"
      # One tenant per deployment: this stack's tenant database also holds that tenant's AI state.
      LIWAN_TENANCY_MODE: dedicated
      AI_TENANT_DATABASE: "${DB_NAME}"
      # Every provider, Ollama included, leaves through ai-egress: an external Ollama is not on ai_internal.
      HTTPS_PROXY: http://ai-egress:3128
      HTTP_PROXY: http://ai-egress:3128
      NO_PROXY: db,web,localhost,127.0.0.1
      # The provider host of each tenant's own key is written here for ai-egress (read-only there).
      AI_TENANT_EGRESS_DIR: /egress
    volumes:
      - ai_tenant_hosts:/egress
    expose: ["8600"]
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    read_only: true
    tmpfs: ["/tmp"]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8600/healthz', timeout=2)"]
      interval: 5s
      timeout: 10s
      retries: 20
    depends_on:
      db: { condition: service_healthy }
      ai-egress: { condition: service_started }

  # The forward proxy that owns AI's outbound traffic: CONNECT to port 443 for the listed hosts, nothing else.
  ai-egress:
    profiles: [ai]
    build: { context: ./ai-egress }
    restart: unless-stopped
    environment:
      AI_EGRESS_HOSTS: "${AI_EGRESS_HOSTS:-}"
      # Tenants' own provider hosts (written by `ai`) join the allowlist: CONNECT to port 443, never to a private address.
      AI_TENANT_EGRESS_DIR: /egress
    volumes:
      - ai_tenant_hosts:/egress:ro
    # Squid runs as Debian's unprivileged `proxy` user on port 3128, so it needs no capability.
    user: proxy
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    read_only: true
    # render.sh writes the configuration under /run; squid's pid, swap and log directories live there too.
    tmpfs: ["/run:uid=13,gid=13,mode=0750", "/var/spool/squid:uid=13,gid=13,mode=0750", "/var/log/squid:uid=13,gid=13,mode=0750"]
    expose: ["3128"]
    networks: [default, ai_internal]

  db:
    # pgvector/pgvector is the official postgres:16 image plus the `vector` extension (AI knowledge index).
    image: pgvector/pgvector:pg16@sha256:0dd3149a06e4579a0d70d8fef9945636cd514005e7237deb27f9b67886f8dc4f
    restart: unless-stopped
    # AI state lives in the tenant database, so db joins ai_internal as well as the default network.
    networks: [default, ai_internal]
    # The postgres user owns the data directory in the image, so the entrypoint never needs root.
    user: postgres
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    read_only: true
    tmpfs: ["/tmp", "/var/run/postgresql:uid=999,gid=999"]
    environment:
      POSTGRES_DB: postgres
      POSTGRES_USER: odoo
      POSTGRES_PASSWORD: "${DB_PASSWORD}"
      AI_DB_PASSWORD: "${AI_DB_PASSWORD:-}"
    volumes:
      - db_data:/var/lib/postgresql/data
      - ./ai/init-db.sh:/docker-entrypoint-initdb.d/20-liwan-ai.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U odoo"]
      interval: 5s
      timeout: 5s
      retries: 20

networks:
  # The AI plane: `ai` sits only here, and `web`/`db` join it to reach it. No route off the host.
  ai_internal: { internal: true }

volumes: { caddy_data: {}, odoo_data: {}, db_data: {}, ai_tenant_hosts: {} }
