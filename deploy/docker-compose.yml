services:
  proxy:
    image: nasq-caddy:${NASQ_IMAGE_TAG:?set NASQ_IMAGE_TAG to the built image tag}
    build:
      context: ..
      dockerfile: deploy/proxy/Dockerfile
    restart: unless-stopped
    ports: ["80:80", "443:443"]
    environment: { DOMAIN: "${DOMAIN}" }
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
    depends_on:
      web: { condition: service_healthy }
      odoo: { condition: service_healthy }

  web:
    build: { context: .., dockerfile: apps/web/Dockerfile }
    restart: unless-stopped
    environment:
      NUXT_ODOO_URL: http://odoo:8069
      NUXT_ODOO_DB: "${DB_NAME}"
    expose: ["3000"]
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:3000/login').then(r => process.exit(r.ok ? 0 : 1), () => process.exit(1))"]
      interval: 5s
      timeout: 10s
      retries: 20
    depends_on:
      odoo: { condition: service_healthy }

  odoo:
    image: nasq-odoo:${NASQ_IMAGE_TAG:?set NASQ_IMAGE_TAG to the built image tag}
    build:
      context: ..
      dockerfile: deploy/odoo/Dockerfile
      args:
        ODOO_COMMIT: ${ODOO_COMMIT:?set ODOO_COMMIT from deploy/odoo/ODOO_COMMIT}
    restart: unless-stopped
    command: ["--workers", "2", "--proxy-mode"]
    environment:
      HOST: db
      USER: odoo
      PASSWORD: "${DB_PASSWORD}"
    volumes:
      - ./data/odoo.conf:/etc/odoo/odoo.conf:ro
      - odoo_data:/var/lib/odoo
    expose: ["8069", "8072"]
    healthcheck:
      test: ["CMD", "/opt/venv/bin/python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8069/web/health', timeout=2)"]
      interval: 5s
      timeout: 10s
      retries: 20
    depends_on:
      db: { condition: service_healthy }

  db:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_DB: postgres
      POSTGRES_USER: odoo
      POSTGRES_PASSWORD: "${DB_PASSWORD}"
    volumes: [db_data:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U odoo"]
      interval: 5s
      timeout: 5s
      retries: 20

volumes: { caddy_data: {}, odoo_data: {}, db_data: {} }
