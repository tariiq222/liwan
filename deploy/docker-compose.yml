services:
  proxy:
    image: caddy:2
    ports: ["80:80", "443:443"]
    environment: { DOMAIN: "${DOMAIN}" }
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
    depends_on: [web, odoo]

  web:
    build: { context: .., dockerfile: apps/web/Dockerfile }
    environment:
      NUXT_ODOO_URL: http://odoo:8069
      NUXT_ODOO_DB: "${DB_NAME}"
    expose: ["3000"]
    depends_on: [odoo]

  odoo:
    image: odoo:19.0
    command: ["odoo", "-c", "/etc/odoo/odoo.conf", "--workers", "2", "--proxy-mode"]
    environment:
      HOST: db
      USER: odoo
      PASSWORD: "${DB_PASSWORD}"
    volumes:
      - ./data/odoo.conf:/etc/odoo/odoo.conf:ro
      - ../odoo-addons:/mnt/extra-addons:ro
      - odoo_data:/var/lib/odoo
    expose: ["8069", "8072"]
    depends_on: [db]

  db:
    image: postgres:16
    environment:
      POSTGRES_DB: postgres
      POSTGRES_USER: odoo
      POSTGRES_PASSWORD: "${DB_PASSWORD}"
    volumes: [db_data:/var/lib/postgresql/data]

volumes: { caddy_data: {}, odoo_data: {}, db_data: {} }
