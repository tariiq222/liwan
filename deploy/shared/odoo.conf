[options]
; INCOMPLETE REFERENCE ONLY: this file must fail the shared startup validator.
; Operator prepares a COMPLETE external read-only file including db_password and
; admin_passwd. Never commit that file. Existing entrypoint does not consume
; HOST/USER/PASSWORD env variables or interpolate placeholders.
; Never copy dedicated db_name or a user-provided dbfilter into this file.
data_dir = /var/lib/odoo
db_host = db
db_user = odoo
dbfilter = ^%h$
list_db = False
proxy_mode = False
workers = 2
