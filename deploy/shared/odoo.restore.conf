[options]
; INCOMPLETE REFERENCE ONLY: this file must fail the shared startup validator, so restore-odoo cannot start
; unconfigured. The operator prepares a COMPLETE external read-only file (LIWAN_RESTORE_ODOO_CONFIG) with
; db_password and admin_passwd that matches restore-db, the isolated Postgres of the restore profile.
; Never point db_host at the live `db`, and never commit that file.
data_dir = /var/lib/odoo
db_host = restore-db
db_user = odoo
dbfilter = ^%h$
list_db = False
proxy_mode = False
workers = 2
; A recovered database must not run scheduled jobs: an overdue cron from the backup would mutate or prune the
; copy, and its retention cleanup can make the restore verification fail on a changed attachment inventory.
; The launcher also passes --max-cron-threads=0 and the validator refuses any other value for this role.
max_cron_threads = 0
