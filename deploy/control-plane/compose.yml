name: webvue-saas-control-local
services:
  control-db:
    image: postgres:16@sha256:e17e86066e5ef83e0952a9347f5c792b7ece00972e2aa787a6986f471b3dd3d5
    pull_policy: never
    restart: unless-stopped
    environment:
      POSTGRES_DB: webvue_control
      POSTGRES_USER: webvue_control
      POSTGRES_PASSWORD_FILE: /run/secrets/control_db_password
    secrets:
      - control_db_password
    ports:
      - "127.0.0.1:55432:5432"
    volumes:
      - control_db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U webvue_control -d webvue_control"]
      interval: 5s
      timeout: 3s
      retries: 20
    networks: [control-private]
    security_opt: [no-new-privileges:true]

secrets:
  control_db_password:
    file: ${WEBVUE_CONTROL_HOME:?run init-local.sh first}/control-db-password
volumes:
  control_db_data:
    name: webvue-saas-control-local-db
networks:
  control-private:
    name: webvue-saas-control-local-private
