# Overlay for the host-run shared worker (liwan-shared-worker.service). Load it after compose.production.yml.
# That worker runs on the host, so it must reach the control database; nothing else in the stack needs this. The database gets a
# loopback-only port on a second network and stays on the internal network too. Drop this file only if the shared worker
# moves off this host (then give it a database route of its own).
services:
  control-db:
    ports:
      - "127.0.0.1:${LIWAN_CONTROL_DB_HOST_PORT:-15432}:5432"
    networks: [control_data, control_db_host]

networks:
  control_db_host: {}
