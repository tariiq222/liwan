[options]
data_dir = /var/lib/odoo
admin_passwd = ${ODOO_ADMIN_PASSWORD}
db_host = db
db_user = odoo
db_password = ${DB_PASSWORD}
dbfilter = ^${DB_NAME}$
list_db = False
# Shared multi-tenant MUST run Odoo with proxy_mode = False (deploy/shared/README.md):
# with proxy_mode True, Odoo's ProxyFix trusts HTTP_X_FORWARDED_HOST and the external Host
# would influence database selection (odoo/http.py:2835-2840). The guard already sends an
# internal Host = registry database, so proxy_mode stays False on the shared lane.
#
# This remains the dedicated default. The explicit shared Compose overlay requires
# WEBVUE_SHARED_ODOO_CONFIG pointing to a validated external secret-bearing config;
# deploy/shared/odoo.conf is a credential-free template, not a runnable secret config.
# The custom image entrypoint does NOT consume HOST/USER/PASSWORD environment values.
proxy_mode = True
