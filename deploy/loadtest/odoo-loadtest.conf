; Odoo 19 — قالب إعداد لاختبار الحمل (وضع العمال المتعدد / multiprocess workers)
; مبني على إعداد مجرَّب ويعمل فعليًا؛ عدِّل القيم البديلة (placeholders) قبل التشغيل.
; ملاحظة: هذا الإعداد مخصص للاختبار على الجهاز المحلي فقط، وليس إعداد إنتاج.
;
; ⚠️ تحذير: لا تنسخ هذا الملف إلى بيئة إنتاج تحت أي ظرف.
; إعداد الاختبار يفتح مدير قواعد البيانات (admin_passwd) وبقية إعداداته تكسر
; عزل المستأجرين لو وصلت إلى إنتاج. للإنتاج قوالب منفصلة في deploy/.

[options]
; مسار الإضافات: نواة أودو + مجلد odoo-addons داخل شجرة العمل الحالية
; كل المسارات أدناه قيم بديلة (placeholders) يجب ملؤها بمسارات هذا الجهاز قبل التشغيل.
addons_path =
    <odoo_core_addons>,
    <odoo_community_addons>,
    <worktree_odoo_addons>

; مسارات OCA — أضفها فقط عند الحاجة، وعدِّل المسارات قبل تفعيلها:
; addons_path =
;     <odoo_core_addons>,
;     <odoo_community_addons>,
;     <worktree_odoo_addons>,
;     <path/to/oca/<repo1>>,
;     <path/to/oca/<repo2>>

; مجلد البيانات (filestore والجلسات) — مستقل لكل بيئة اختبار
data_dir = <loadtest_data_dir>

; قاعدة البيانات
db_host = localhost
db_port = 5432
db_user = <db_user>
db_name = <db_name>

; خدمة الويب: منفذ مخصص لبيئة اختبار الحمل، والاستماع على الواجهة المحلية فقط
http_port = 8170
http_interface = 127.0.0.1

; كلمة مرور المدير لإدارة قواعد البيانات (قيمة الاختبار المحلي)
; كلمة مرور مدير قواعد البيانات — قيمة بديلة تُملأ قبل التشغيل
admin_passwd = <admin_passwd>

; وضع العمال المتعدد
workers = 12
db_maxconn = 4
max_cron_threads = 1

; حدود زمن المعالج والزمن الحقيقي لكل طلب (ثانية)
limit_time_cpu = 60
limit_time_real = 120

; ملاحظة مهمة (سعة قاعدة البيانات):
; عدد اتصالات PostgreSQL التي سيفتحها أودو ≈ workers × db_maxconn
; (هنا: 12 × 4 = 48 اتصالًا)، يُضاف إليها اتصالات خيوط cron والاتصالات الإدارية.
; يجب أن يبقى هذا المجموع مع هامش أمان (headroom) أقل من max_connections
; في PostgreSQL، وإلا ستفشل الاتصالات الجديدة تحت الحمل (FATAL: too many connections).
; احسب دائمًا: workers × db_maxconn + max_cron_threads + هامش للعملاء الآخرين < max_connections.

; ملاحظة مهمة (macOS):
; على macOS يجب تشغيل العملية مع PGGSSENCMODE=disable، لأن مكتبة GSSAPI
; تتعطل (crash) بعد fork عند تعدد العمال في وضع multiprocess.
; مثال التشغيل:
;   PGGSSENCMODE=disable odoo -c <path/to>/odoo-loadtest.conf
