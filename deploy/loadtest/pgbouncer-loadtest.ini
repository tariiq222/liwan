; pgbouncer — قالب إعداد لاختبار الحمل (وضع transaction pooling)
; مُجرَّب فعليًا مع Odoo 19 على قاعدة scratch: القراءات والكتابات وcron تعمل بلا أخطاء.
; كل القيم البديلة (<...>) تُملأ قبل التشغيل. هذا إعداد اختبار محلي، ليس إعداد إنتاج.

[databases]
<db_name> = host=127.0.0.1 port=5432 dbname=<db_name>
; أودو يفتح قواعد الصيانة أيضًا (لعرض قواعد البيانات والإنشاء) — يجب تمريرها:
postgres = host=127.0.0.1 port=5432 dbname=postgres
template1 = host=127.0.0.1 port=5432 dbname=template1

[pgbouncer]
listen_addr = 127.0.0.1
listen_port = 6400
; ملف المستخدمين: سطر لكل مستخدم بالشكل "user" "" — مطلوب حتى مع trust
auth_type = trust
auth_file = <path/to/userlist.txt>
pool_mode = transaction
; ميزانية الاتصالات: max_client_conn للعملاء، default_pool_size هو سقف
; الاتصالات الحقيقية إلى PostgreSQL لكل قاعدة (يجب أن يبقى تحت max_connections)
max_client_conn = 300
default_pool_size = 40
admin_users = <db_user>
logfile = <path/to/pgbouncer.log>
pidfile = <path/to/pgbouncer.pid>

; ملاحظات مُختبَرة (2026-10-22):
; - يجب أن يشير أودو إلى pgbouncer بـ db_host = 127.0.0.1 صراحةً
;   (localhost يُحلّ إلى ::1 وpgbouncer هنا يستمع على IPv4 فقط).
; - لا تُنسَ قواعد postgres/template1 في قسم [databases] وإلا فشل إقلاع أودو
;   بـ "no such database: postgres".
; - تنبيه قبل الإنتاج: هذا اختبار دخان قصير؛ التوافق العميق (إشارات السجل
;   بين العمال عبر advisory locks، وNOTIFY للمحادثات الحية) يحتاج فترة
;   تشغيل ممتدة (soak) على بيئة تمثيلية قبل اعتماد transaction pooling إنتاجيًا.
