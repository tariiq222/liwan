name: publish

# Builds the production images and publishes the release document of a commit; it deploys nothing itself, it only tells
# development that a new main commit is ready. The source of truth of this file is deploy/ci/publish-zone/publish.yml in
# liwanos/liwan; the host operator installs it as .forgejo/workflows/publish.yml of the admin-only repository
# liwanos/liwan-publish (see deploy/ci/publish-zone/README.md). It runs only on the publish runner, which belongs to that
# repository alone, so the registry write token exists nowhere else.
#
# Dispatched by the trigger workflow of liwanos/liwan on every push to main; the dispatch carries no input. The job
# resolves Forgejo main itself, checks out liwanos/liwan at that commit, and runs deploy/ci/publish.sh from it: every
# image in deploy/production-images.json is built natively for linux/amd64 and smoke-checked and scanned by
# deploy/ci/image.sh before anything is pushed. Only then are the images pushed to git.liwanos.com/liwanos under the full
# commit SHA, followed by the release document of the commit (deploy/ci/lib/release_manifest.py: every image by digest
# and the digest per platform), pushed as git.liwanos.com/liwanos/liwan-release:<commit>, a scratch image whose only file
# is /release.json. A commit whose document already exists is not rebuilt, and a commit that is no longer the head of
# main publishes nothing. The last step calls the development hook, which takes no parameters: the development job
# resolves Forgejo main itself.
#
# The arm64 images are not built here. They are built for a release/* tag, in a separate workflow added
# once the place that builds them is decided; until then a document covers linux/amd64 only and the release command
# refuses it for staging and production. That tag leg will end by calling the staging hook (LIWAN_STAGING_HOOK_URL and
# LIWAN_STAGING_HOOK_TOKEN) after the arm64 images and the two-architecture release document are published; it does not
# exist yet.
#
# Secrets (repository secrets of liwanos/liwan-publish, values typed by the owner):
#   LIWAN_REGISTRY_USER, LIWAN_REGISTRY_TOKEN   registry write credential (token scope write:package)
#   LIWAN_SOURCE_READ_TOKEN                     read-only token for liwanos/liwan (checkout and the head check)
#   LIWAN_DEVELOPMENT_HOOK_URL, LIWAN_DEVELOPMENT_HOOK_TOKEN   the Openship development job hook
on:
  workflow_dispatch:

# One publish at a time (plan D22). Runs are queued, never cancelled: cancelling in favour of the newest run would let a
# rerun of an old run cancel the newer main publish midway. A newer main commit supersedes an older run by the head check
# of `publish.sh check` and `publish.sh push`, which end the old run successfully before it pushes anything.
concurrency:
  group: publish
  cancel-in-progress: false

# The Postgres container image.sh needs lives on the publish zone's own Docker daemon on the host network, so these are
# throwaway values.
env:
  PGHOST: 127.0.0.1
  PGPORT: '55432'
  PGUSER: odoo
  PGPASSWORD: odoo
  ODOO_PORT: '8169'
  SOURCE_REPOSITORY: liwanos/liwan

jobs:
  publish:
    # DOCKER ACCESS: this label and the container block below are the only place the job learns how it reaches Docker.
    # Scripts only use DOCKER_HOST. It is the publish zone's own rootless daemon, never root Docker.
    runs-on: publish-amd64
    container:
      image: node:22-bookworm@sha256:e13726ca604184d7a91fcacab1fc09eefd642dc28e79ac34e85540dd93b78cfb # node:22-bookworm index digest
      volumes:
        - /run/user/1001/docker.sock:/run/user/1001/docker.sock
      env:
        DOCKER_HOST: unix:///run/user/1001/docker.sock
    timeout-minutes: 120
    steps:
      - name: Install the Docker client and buildx
        run: |
          set -euo pipefail
          curl -fsSL -o /tmp/docker.tgz https://download.docker.com/linux/static/stable/x86_64/docker-27.5.1.tgz
          echo "4f798b3ee1e0140eab5bf30b0edc4e84f4cdb53255a429dc3bbae9524845d640  /tmp/docker.tgz" | sha256sum -c -
          tar -xzf /tmp/docker.tgz -C /usr/local/bin --strip-components=1 docker/docker
          mkdir -p /usr/local/lib/docker/cli-plugins
          curl -fsSL -o /usr/local/lib/docker/cli-plugins/docker-buildx https://github.com/docker/buildx/releases/download/v0.20.1/buildx-v0.20.1.linux-amd64
          echo "8c38f60308a895fa570f1410e453c5de11aafd65a99fa99965d96d24b6225a78  /usr/local/lib/docker/cli-plugins/docker-buildx" | sha256sum -c -
          chmod +x /usr/local/lib/docker/cli-plugins/docker-buildx
          docker version --format '{{.Client.Version}}'
          docker buildx version
      - name: Check out liwanos/liwan at Forgejo main
        id: source
        run: |
          set -euo pipefail
          askpass="$(mktemp)"
          # shellcheck disable=SC2016 # the askpass script must expand the variable when git runs it
          printf '#!/bin/sh\ncase "$1" in Username*) echo x-access-token ;; *) echo "$LIWAN_SOURCE_READ_TOKEN" ;; esac\n' > "$askpass"
          chmod 700 "$askpass"
          export GIT_ASKPASS="$askpass" GIT_TERMINAL_PROMPT=0
          url="$GITHUB_SERVER_URL/$SOURCE_REPOSITORY.git"
          sha="$(git ls-remote "$url" refs/heads/main | cut -f1)"
          printf '%s' "$sha" | grep -Eqx '[0-9a-f]{40}' || { echo "cannot resolve main of $SOURCE_REPOSITORY" >&2; exit 1; }
          git init --quiet source
          git -C source fetch --quiet --depth 1 "$url" "$sha"
          git -C source checkout --quiet --detach FETCH_HEAD
          rm -f "$askpass"
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
        env:
          LIWAN_SOURCE_READ_TOKEN: ${{ secrets.LIWAN_SOURCE_READ_TOKEN }}
      - name: Sign in to the registry
        run: printf '%s' "$LIWAN_REGISTRY_TOKEN" | docker login git.liwanos.com --username "$LIWAN_REGISTRY_USER" --password-stdin
        env:
          LIWAN_REGISTRY_USER: ${{ secrets.LIWAN_REGISTRY_USER }}
          LIWAN_REGISTRY_TOKEN: ${{ secrets.LIWAN_REGISTRY_TOKEN }}
      - name: Decide what this run does
        id: check
        run: deploy/ci/publish.sh check
        working-directory: source
        env:
          GITHUB_SHA: ${{ steps.source.outputs.sha }}
          GITHUB_REF: refs/heads/main
          GITHUB_REPOSITORY: ${{ env.SOURCE_REPOSITORY }}
          GITHUB_TOKEN: ${{ secrets.LIWAN_SOURCE_READ_TOKEN }}
      - name: Start the scratch database
        if: steps.check.outputs.state == 'build'
        run: |
          set -euo pipefail
          docker rm -fv liwan-publish-pg >/dev/null 2>&1 || true
          docker run -d --name liwan-publish-pg --network host -e POSTGRES_USER="$PGUSER" -e POSTGRES_PASSWORD="$PGPASSWORD" \
            postgres:16@sha256:f9a7b9ebf6f56201f949db745e47bc423c0f0f8294bafe991cc10bf74b029657 -c "port=$PGPORT"
          for _ in $(seq 24); do
            docker exec liwan-publish-pg pg_isready -p "$PGPORT" -U "$PGUSER" && exit 0
            sleep 5
          done
          echo "the scratch database did not become ready" >&2
          exit 1
      - name: Build and scan the images
        if: steps.check.outputs.state == 'build'
        run: deploy/ci/publish.sh build
        working-directory: source
        env:
          GITHUB_SHA: ${{ steps.source.outputs.sha }}
          GITHUB_REF: refs/heads/main
          GITHUB_REPOSITORY: ${{ env.SOURCE_REPOSITORY }}
      - name: Push the images and the release document
        id: push
        if: steps.check.outputs.state == 'build'
        run: deploy/ci/publish.sh push
        working-directory: source
        env:
          GITHUB_SHA: ${{ steps.source.outputs.sha }}
          GITHUB_REF: refs/heads/main
          GITHUB_REPOSITORY: ${{ env.SOURCE_REPOSITORY }}
          GITHUB_TOKEN: ${{ secrets.LIWAN_SOURCE_READ_TOKEN }}
      - name: Tell development a new commit is ready
        if: steps.check.outputs.state != 'superseded' && steps.push.outputs.superseded != 'true'
        run: |
          set -euo pipefail
          if [ -z "$DEVELOPMENT_HOOK_URL" ] || [ -z "$DEVELOPMENT_HOOK_TOKEN" ]; then
            echo "LIWAN_DEVELOPMENT_HOOK_URL and LIWAN_DEVELOPMENT_HOOK_TOKEN must both be set as repository secrets, because the images are published but development was not told" >&2
            exit 1
          fi
          curl -fsS -X POST -H "Authorization: Bearer $DEVELOPMENT_HOOK_TOKEN" "$DEVELOPMENT_HOOK_URL" > /dev/null
        env:
          DEVELOPMENT_HOOK_URL: ${{ secrets.LIWAN_DEVELOPMENT_HOOK_URL }}
          DEVELOPMENT_HOOK_TOKEN: ${{ secrets.LIWAN_DEVELOPMENT_HOOK_TOKEN }}
      - name: Clean up
        if: always()
        run: |
          docker rm -fv liwan-publish-pg >/dev/null 2>&1 || true
          docker buildx rm --force liwan-publish >/dev/null 2>&1 || true
          docker logout git.liwanos.com >/dev/null 2>&1 || true
