name: Setup
description: Toolchain for a CI stage - Node with dependencies, Python, and the pinned Odoo checkout with its virtualenv and the pinned OCA addons.
inputs:
  node:
    description: Install Node.js from .nvmrc with the npm cache.
    default: 'true'
  npm-ci:
    description: Run npm ci --ignore-scripts (needs node). Stage scripts that install on their own set this to false.
    default: 'true'
  playwright:
    description: Install Chromium and its system libraries (needs npm-ci).
    default: 'false'
  python:
    description: Install Python 3.12 (implied by odoo).
    default: 'false'
  odoo:
    description: Fetch the pinned Odoo commit and build its virtualenv; exports ODOO_ROOT and ODOO_PYTHON (and LIWAN_OCA_DIR for the OCA addons from deploy/oca-addons.json).
    default: 'false'
runs:
  using: composite
  steps:
    - name: Node.js
      if: inputs.node == 'true'
      uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
      with:
        node-version-file: .nvmrc
        cache: npm
    - name: Silence the npm update notice
      if: inputs.node == 'true'
      shell: bash
      # Some tests spawn npx with a minimal environment and assert an empty stderr; only the user npmrc reaches them.
      run: npm config set update-notifier false
    - name: Install npm dependencies
      if: inputs.node == 'true' && inputs.npm-ci == 'true'
      shell: bash
      run: npm ci --ignore-scripts
    - name: Install Chromium
      if: inputs.node == 'true' && inputs.npm-ci == 'true' && inputs.playwright == 'true'
      shell: bash
      run: npx playwright install --with-deps chromium
    - name: Python 3.12
      id: python
      if: inputs.python == 'true' || inputs.odoo == 'true'
      uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
      with:
        python-version: '3.12'
    - name: System package cache
      if: inputs.odoo == 'true'
      uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
      with:
        path: ${{ runner.temp }}/apt-cache
        # A new runner image restores the previous image's packages and saves its own set.
        key: apt-cache-${{ env.ImageOS }}-${{ env.ImageVersion }}-${{ hashFiles('.github/actions/setup/action.yml') }}
        restore-keys: apt-cache-${{ env.ImageOS }}-
    - name: System packages for Odoo
      if: inputs.odoo == 'true'
      shell: bash
      run: |
        set -euo pipefail
        cache="$RUNNER_TEMP/apt-cache"
        archives="$cache/archives"
        lists="$cache/lists"
        mkdir -p "$archives/partial"
        packages=(build-essential libpq-dev libldap2-dev libsasl2-dev postgresql-client-16)
        apt_get() {
          sudo apt-get -o Acquire::Retries=3 -o Acquire::http::Timeout=20 -o Acquire::https::Timeout=20 \
            -o Dir::Cache::Archives="$archives" -o APT::Keep-Downloaded-Packages=true "$@"
        }
        # Install offline first, resolving with the package lists the cached archives were downloaded from (the
        # image's own lists may name other versions), so an Ubuntu mirror outage does not stop CI.
        offline=()
        if [ -d "$lists" ]; then offline=(-o Dir::State::Lists="$lists"); fi
        if ! apt_get "${offline[@]}" install -y -q --no-install-recommends --no-download "${packages[@]}"; then
          apt_get update -q
          apt_get install -y -q --no-install-recommends "${packages[@]}"
          sudo rm -rf "$lists"
          sudo cp -a /var/lib/apt/lists "$lists"
        fi
        # apt writes as root; the cache step saves as the runner user.
        sudo chown -R "$(id -u):$(id -g)" "$cache"
    - name: Odoo source cache
      id: odoo-source
      if: inputs.odoo == 'true'
      uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
      with:
        path: ${{ runner.temp }}/odoo
        key: odoo-source-${{ hashFiles('deploy/odoo/ODOO_COMMIT') }}
    - name: Fetch the pinned Odoo commit
      if: inputs.odoo == 'true' && steps.odoo-source.outputs.cache-hit != 'true'
      shell: bash
      run: |
        set -euo pipefail
        git init -q "$RUNNER_TEMP/odoo"
        git -C "$RUNNER_TEMP/odoo" fetch -q --depth 1 https://github.com/odoo/odoo.git "$(cat deploy/odoo/ODOO_COMMIT)"
        git -C "$RUNNER_TEMP/odoo" checkout -q FETCH_HEAD
    - name: Odoo virtualenv cache
      id: odoo-venv
      if: inputs.odoo == 'true'
      uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
      with:
        path: ${{ runner.temp }}/odoo-venv
        key: odoo-venv-${{ steps.python.outputs.python-version }}-${{ hashFiles('deploy/odoo/ODOO_COMMIT', 'deploy/odoo/requirements-python312-linux.txt') }}
    - name: Build the Odoo virtualenv
      if: inputs.odoo == 'true' && steps.odoo-venv.outputs.cache-hit != 'true'
      shell: bash
      run: |
        set -euo pipefail
        python -m venv "$RUNNER_TEMP/odoo-venv"
        "$RUNNER_TEMP/odoo-venv/bin/pip" install --quiet -r deploy/odoo/requirements-python312-linux.txt
    - name: Export the Odoo paths
      if: inputs.odoo == 'true'
      shell: bash
      run: |
        echo "ODOO_ROOT=$RUNNER_TEMP/odoo" >> "$GITHUB_ENV"
        echo "ODOO_PYTHON=$RUNNER_TEMP/odoo-venv/bin/python" >> "$GITHUB_ENV"
    - name: Pinned OCA addons cache
      if: inputs.odoo == 'true'
      uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
      with:
        path: ${{ runner.temp }}/oca-19.0
        key: oca-addons-${{ hashFiles('deploy/oca-addons.json') }}
    - name: Fetch the pinned OCA addons
      if: inputs.odoo == 'true'
      shell: bash
      run: |
        set -euo pipefail
        echo "LIWAN_OCA_DIR=$RUNNER_TEMP/oca-19.0" >> "$GITHUB_ENV"
        LIWAN_OCA_DIR="$RUNNER_TEMP/oca-19.0" python3 -B tools/oca_addons.py fetch
