name: image-scan

# Daily image build and Trivy scan of main. A new CRITICAL advisory against an unchanged base image
# fails this run (GitHub notifies the owner) before it fails every pull request that selects the ci `image` stage.
# Each run keeps the CycloneDX SBOM of every image it built as the `image-sbom` artifact.
on:
  schedule:
    - cron: '0 2 * * *'
  workflow_dispatch:

permissions:
  contents: read

# The Postgres service container is ephemeral and reachable only from its own job, so these are throwaway values.
env:
  PGHOST: 127.0.0.1
  PGPORT: '5432'
  PGUSER: odoo
  PGPASSWORD: odoo
  ODOO_PORT: '8169'
  LIWAN_SBOM_DIR: ${{ github.workspace }}/sbom

jobs:
  image:
    runs-on: ubuntu-24.04
    timeout-minutes: 75
    services:
      postgres:
        image: postgres:16@sha256:f9a7b9ebf6f56201f949db745e47bc423c0f0f8294bafe991cc10bf74b029657
        env:
          POSTGRES_USER: odoo
          POSTGRES_PASSWORD: odoo
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U odoo"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: deploy/ci/image.sh
      - name: Upload the image SBOMs
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: image-sbom
          path: sbom/
          if-no-files-found: warn
          retention-days: 30
