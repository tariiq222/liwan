name: pr-review
run-name: 'pr-review #${{ github.event.pull_request.number || inputs.pr }}'

# Trusted base code only: a PR is data to review, never code to run with credentials.
on:
  workflow_dispatch:
    inputs:
      pr:
        description: Same-repository PR number
        required: true
        type: string
      head:
        description: Exact expected head SHA
        required: true
        type: string
  pull_request_target:
    branches: [main]
    types: [opened, reopened, synchronize, ready_for_review]

permissions:
  contents: read

concurrency:
  group: pr-review-${{ github.event.pull_request.number || inputs.pr }}
  cancel-in-progress: true

env:
  REVIEW_REPO: ${{ github.repository }}

jobs:
  resolve:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      pull-requests: read
    outputs:
      pr: ${{ steps.pr.outputs.pr }}
      head: ${{ steps.pr.outputs.head }}
      eligible: ${{ steps.pr.outputs.eligible }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: main
          persist-credentials: false
      - id: pr
        env:
          GH_TOKEN: ${{ github.token }}
          REQUEST_PR: ${{ github.event.pull_request.number || inputs.pr }}
          REQUEST_HEAD: ${{ github.event.pull_request.head.sha || inputs.head }}
        run: >-
          python3 -B tools/pr_delivery.py resolve-review --repo "$REVIEW_REPO"
          --pr "$REQUEST_PR" --head "$REQUEST_HEAD"

  codex:
    env:
      REVIEW_PR: ${{ needs.resolve.outputs.pr }}
      REVIEW_HEAD: ${{ needs.resolve.outputs.head }}
    needs: resolve
    if: github.ref == 'refs/heads/main' && needs.resolve.outputs.eligible == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    permissions:
      contents: read
      pull-requests: write
      statuses: write
    outputs:
      completed: ${{ steps.review.outputs.completed }}
      request_id: ${{ steps.review.outputs.request_id }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: main
          persist-credentials: false
      - name: Request Codex and wait at most five minutes
        id: review
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          python3 -B tools/pr_review.py codex --repo "$REVIEW_REPO"
          --pr "$REVIEW_PR" --head "$REVIEW_HEAD" --wait-seconds 300

  claude:
    env:
      REVIEW_PR: ${{ needs.resolve.outputs.pr }}
      REVIEW_HEAD: ${{ needs.resolve.outputs.head }}
    needs: [resolve, codex]
    if: >-
      always() && !cancelled() && github.ref == 'refs/heads/main'
      && needs.resolve.outputs.eligible == 'true'
      && needs.codex.outputs.completed != 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 18
    environment: agent
    # The model receives only a read token. A separate, model-free job posts the result.
    permissions:
      contents: read
      pull-requests: read
      issues: read
    outputs:
      review: ${{ steps.review.outputs.review }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: main
          persist-credentials: false
      - uses: ./.github/actions/claude-subscription
      - name: Read-only Claude fallback
        id: review
        timeout-minutes: 15
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
        run: >-
          python3 -B tools/pr_review.py claude --repo "$REVIEW_REPO"
          --pr "$REVIEW_PR" --head "$REVIEW_HEAD"

  review-result:
    env:
      REVIEW_PR: ${{ needs.resolve.outputs.pr }}
      REVIEW_HEAD: ${{ needs.resolve.outputs.head }}
    needs: [resolve, codex, claude]
    if: >-
      always() && !cancelled() && github.ref == 'refs/heads/main'
      && needs.resolve.outputs.eligible == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: write
      statuses: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: main
          persist-credentials: false
      - name: Require a valid review of the current head
        env:
          GH_TOKEN: ${{ github.token }}
          CLAUDE_REVIEW: ${{ needs.claude.outputs.review }}
          CODEX_REQUEST_ID: ${{ needs.codex.outputs.request_id || '0' }}
        run: >-
          python3 -B tools/pr_review.py finalize --repo "$REVIEW_REPO"
          --pr "$REVIEW_PR" --head "$REVIEW_HEAD" --request-id "$CODEX_REQUEST_ID"
