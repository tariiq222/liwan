name: pr-review

# Trusted base code only: a PR is data to review, never code to run with credentials.
on:
  pull_request_target:
    branches: [main]
    types: [opened, reopened, synchronize, ready_for_review]

permissions:
  contents: read

concurrency:
  group: pr-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

env:
  REVIEW_REPO: ${{ github.repository }}
  REVIEW_PR: ${{ github.event.pull_request.number }}
  REVIEW_HEAD: ${{ github.event.pull_request.head.sha }}

jobs:
  codex:
    if: >-
      !github.event.pull_request.draft
      && github.event.pull_request.head.repo.full_name == github.repository
      && (github.event.pull_request.user.login == github.repository_owner
          || contains(fromJSON('["claude[bot]","chatgpt-codex-connector[bot]","github-actions[bot]"]'), github.event.pull_request.user.login))
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    permissions:
      contents: read
      pull-requests: write
      statuses: write
    outputs:
      completed: ${{ steps.review.outputs.completed }}
      request_id: ${{ steps.review.outputs.request_id }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          persist-credentials: false
      - name: Request Codex and wait at most five minutes
        id: review
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          python3 -B tools/pr_review.py codex --repo "$REVIEW_REPO"
          --pr "$REVIEW_PR" --head "$REVIEW_HEAD" --wait-seconds 300

  claude:
    needs: codex
    if: >-
      always() && !cancelled()
      && !github.event.pull_request.draft
      && github.event.pull_request.head.repo.full_name == github.repository
      && (github.event.pull_request.user.login == github.repository_owner
          || contains(fromJSON('["claude[bot]","chatgpt-codex-connector[bot]","github-actions[bot]"]'), github.event.pull_request.user.login))
      && needs.codex.outputs.completed != 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 18
    environment: agent
    # The model receives only a read token. A separate, model-free job posts the result.
    permissions:
      contents: read
      pull-requests: read
      issues: read
    outputs:
      review: ${{ steps.review.outputs.review }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          persist-credentials: false
      - uses: ./.github/actions/setup
        with:
          npm-ci: 'false'
      - name: Install pinned Claude CLI in runner scratch space
        run: |
          set -euo pipefail
          # Make the runner binary a required dependency: npm otherwise silently ignores download failures.
          npm install --ignore-scripts --no-package-lock --prefix "$RUNNER_TEMP/claude-review" \
            @anthropic-ai/claude-code@2.1.308 @anthropic-ai/claude-code-linux-x64@2.1.308
          node "$RUNNER_TEMP/claude-review/node_modules/@anthropic-ai/claude-code/install.cjs"
          "$RUNNER_TEMP/claude-review/node_modules/.bin/claude" --version
          echo "$RUNNER_TEMP/claude-review/node_modules/.bin" >> "$GITHUB_PATH"
      - name: Read-only Claude fallback
        id: review
        timeout-minutes: 15
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
        run: >-
          python3 -B tools/pr_review.py claude --repo "$REVIEW_REPO"
          --pr "$REVIEW_PR" --head "$REVIEW_HEAD"

  review-result:
    needs: [codex, claude]
    if: >-
      always() && !cancelled()
      && !github.event.pull_request.draft
      && github.event.pull_request.head.repo.full_name == github.repository
      && (github.event.pull_request.user.login == github.repository_owner
          || contains(fromJSON('["claude[bot]","chatgpt-codex-connector[bot]","github-actions[bot]"]'), github.event.pull_request.user.login))
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: write
      statuses: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          persist-credentials: false
      - name: Require a valid review of the current head
        env:
          GH_TOKEN: ${{ github.token }}
          CLAUDE_REVIEW: ${{ needs.claude.outputs.review }}
          CODEX_REQUEST_ID: ${{ needs.codex.outputs.request_id || '0' }}
        run: >-
          python3 -B tools/pr_review.py finalize --repo "$REVIEW_REPO"
          --pr "$REVIEW_PR" --head "$REVIEW_HEAD" --request-id "$CODEX_REQUEST_ID"
