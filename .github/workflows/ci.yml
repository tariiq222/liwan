name: ci

on:
  pull_request:
    branches: [main]
    # ready_for_review starts the tests for a PR that was opened as a draft.
    types: [opened, synchronize, reopened, ready_for_review]
  # A merge-queue entry runs the same pull-request selection on the queued merge result, so the required
  # ci-result check reports for it; GitHub sends no merge_group event while the queue is off.
  merge_group:
    types: [checks_requested]
  push:
    branches: [main]
  schedule:
    # Nightly full run of all thirteen stages on main (00:17 UTC = 03:17 Asia/Riyadh, off the top of the hour).
    - cron: '17 0 * * *'
  workflow_dispatch:
    inputs:
      full:
        description: Run all thirteen stages instead of the ones the change can affect
        type: boolean
        default: false

permissions:
  contents: read

# Draft events have their own group: a late draft event must not cancel a ready run.
# A newer push to a ready PR cancels its older ready run. On main a running run always finishes (cancelling it left
# main with no completed run while merges kept coming); GitHub keeps only the newest pending main run, and
# that commit contains every earlier merge. A manual (release) run has its own group. Each merge-queue entry
# has its own gh-readonly-queue ref, so its run is never cancelled by another entry.
concurrency:
  group: ci-${{ github.event_name }}-${{ github.ref }}${{ github.event_name == 'pull_request' && github.event.pull_request.draft && '-draft' || '' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# The Postgres service container is ephemeral and reachable only from its own job, so these are throwaway values.
env:
  PGHOST: 127.0.0.1
  PGPORT: '5432'
  PGUSER: odoo
  PGPASSWORD: odoo
  ODOO_PORT: '8169'
  ISOLATION_PORT: '8170'
  MOCK_PORT: '8172'
  AI_MOCK_PORT: '8173'
  WEB_PORT: '3101'

jobs:
  scope:
    # A draft is still being shaped: its pushes run no stage until it is marked ready.
    if: github.event_name != 'pull_request' || !github.event.pull_request.draft
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      actions: read
    outputs:
      stages: ${{ steps.cache.outputs.stages }}
      matrices: ${{ steps.cache.outputs.matrices }}
      base: ${{ steps.select.outputs.base }}
      odoo-modules: ${{ steps.select.outputs.odoo-modules }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Select the stages
        id: select
        env:
          FULL: ${{ inputs.full || github.event_name == 'schedule' || (github.event_name == 'push' && github.ref == 'refs/heads/main') }}
          EVENT_NAME: ${{ github.event_name }}
          PULL_REQUEST_BASE: ${{ github.event.pull_request.base.sha }}
          MERGE_GROUP_BASE: ${{ github.event.merge_group.base_sha }}
          PUSH_BEFORE: ${{ github.event.before }}
        run: |
          set -euo pipefail
          base="${PULL_REQUEST_BASE:-${MERGE_GROUP_BASE:-$PUSH_BEFORE}}"
          if [ -z "$base" ] || [ -z "${base//0/}" ] || ! git cat-file -e "$base^{commit}" 2>/dev/null; then
            base=origin/main
          fi
          # A pull request or merge-queue entry skips the slow stages and tests only the Odoo modules the
          # change affects; every other event (push to main, nightly, dispatch) keeps the whole matrix.
          # Empty modules = all.
          modules=""
          if [ "$FULL" = true ]; then
            stages="$(python3 -B tools/ci_scope.py --full --stages)"
          elif [ "$EVENT_NAME" = pull_request ] || [ "$EVENT_NAME" = merge_group ]; then
            stages="$(python3 -B tools/ci_scope.py --base "$base" --pull-request --stages)"
            modules="$(python3 -B tools/ci_scope.py --base "$base" --pull-request --modules)"
          else
            stages="$(python3 -B tools/ci_scope.py --base "$base" --stages)"
          fi
          echo "base=$base" >> "$GITHUB_OUTPUT"
          echo "stages=$stages" >> "$GITHUB_OUTPUT"
          echo "odoo-modules=$modules" >> "$GITHUB_OUTPUT"
          echo "odoo-shards=$(python3 -B tools/odoo_shards.py matrix ${modules:+--modules "$modules"})" >> "$GITHUB_OUTPUT"
          echo "e2e-mock-shards=$(python3 -B tools/ci_stage_cache.py e2e-mock-shards)" >> "$GITHUB_OUTPUT"
          echo "rtl-stories-shards=$(python3 -B tools/ci_stage_cache.py rtl-stories-shards)" >> "$GITHUB_OUTPUT"
          echo "apps=$(python3 -B tools/app_isolation.py matrix apps ${modules:+--modules "$modules"})" >> "$GITHUB_OUTPUT"
          echo "bridges=$(python3 -B tools/app_isolation.py matrix bridges ${modules:+--modules "$modules"})" >> "$GITHUB_OUTPUT"
          echo "Base $base, stages $stages"
      # Reuse successful jobs on identical inputs for PRs and merge groups. Keep each shard's
      # original total so removing successful jobs never changes which tests the others run.
      - name: Plan the jobs still required
        id: cache
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT_NAME: ${{ github.event_name }}
          SELECTED: ${{ steps.select.outputs.stages }}
          ODOO_MODULES: ${{ steps.select.outputs.odoo-modules }}
          ODOO_SHARDS: ${{ steps.select.outputs.odoo-shards }}
          E2E_MOCK_SHARDS: ${{ steps.select.outputs.e2e-mock-shards }}
          RTL_STORIES_SHARDS: ${{ steps.select.outputs.rtl-stories-shards }}
          APPS: ${{ steps.select.outputs.apps }}
          BRIDGES: ${{ steps.select.outputs.bridges }}
        run: |
          set -euo pipefail
          args=(--stages "$SELECTED" --odoo-shards "$ODOO_SHARDS"
            --e2e-mock-shards "$E2E_MOCK_SHARDS" --rtl-stories-shards "$RTL_STORIES_SHARDS"
            --apps "$APPS" --bridges "$BRIDGES" --odoo-modules "$ODOO_MODULES")
          if [ "$EVENT_NAME" = pull_request ] || [ "$EVENT_NAME" = merge_group ]; then
            args+=(--reuse-passes)
          fi
          plan="$(python3 -B tools/ci_stage_cache.py plan "${args[@]}")"
          echo "stages=$(jq -ce '.stages' <<< "$plan")" >> "$GITHUB_OUTPUT"
          echo "matrices=$(jq -ce '.matrices' <<< "$plan")" >> "$GITHUB_OUTPUT"
          echo "Reused jobs (passed with these inputs): $(jq -c '.reused' <<< "$plan")"

  # One job, one stage: the parts of deploy/ci/static.sh run in parallel as the matrix, and the job (so ci-result)
  # passes only when every part passes; fail-fast is off so a red run reports every failing part. A documentation-only
  # pull request runs its light checks in the policies part and nothing in the other two.
  static:
    name: static (${{ matrix.part }})
    needs: scope
    if: contains(fromJSON(needs.scope.outputs.stages), 'static')
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        part: [policies, tests, types]
    env:
      CI_BASE_REF: ${{ needs.scope.outputs.base }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Select the static checks
        id: profile
        if: github.event_name == 'pull_request'
        env:
          PR_BASE: ${{ github.event.pull_request.base.sha }}
        run: |
          mode="$(python3 -B tools/ci_static_profile.py --base "$PR_BASE")"
          echo "mode=$mode" >> "$GITHUB_OUTPUT"
          echo "Static checks: $mode"
      - name: Check documentation
        if: steps.profile.outputs.mode == 'docs' && matrix.part == 'policies'
        run: bash deploy/ci/lib/docs-static.sh
      # Only the tests part drives Chromium (two web tests in npm test); the type check needs no Python.
      - uses: ./.github/actions/setup
        if: steps.profile.outputs.mode != 'docs'
        with:
          playwright: ${{ matrix.part == 'tests' && 'true' || 'false' }}
          python: ${{ matrix.part != 'types' && 'true' || 'false' }}
      - name: Python tools
        if: steps.profile.outputs.mode != 'docs' && matrix.part == 'policies'
        run: python -m pip install --quiet ruff==0.16.3 semgrep==1.170.0
      - run: deploy/ci/static.sh ${{ matrix.part }}
        if: steps.profile.outputs.mode != 'docs'

  ai-service:
    needs: scope
    if: contains(fromJSON(needs.scope.outputs.stages), 'ai-service')
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      ODOO_PYTHON: python
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: odoo
          POSTGRES_PASSWORD: odoo
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U odoo"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup
        with:
          node: 'false'
          python: 'true'
      - run: deploy/ci/ai-service.sh
      - uses: ./.github/actions/stage-pass
        if: success()
        with:
          stage: ai-service

  control-plane:
    needs: scope
    if: contains(fromJSON(needs.scope.outputs.stages), 'control-plane')
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: odoo
          POSTGRES_PASSWORD: odoo
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U odoo"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup
      - run: deploy/ci/control-plane.sh
      - uses: ./.github/actions/stage-pass
        if: success()
        with:
          stage: control-plane

  vendor-admin:
    needs: scope
    if: contains(fromJSON(needs.scope.outputs.stages), 'vendor-admin')
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup
        with:
          npm-ci: 'false'
      - run: deploy/ci/vendor-admin.sh
      - uses: ./.github/actions/stage-pass
        if: success()
        with:
          stage: vendor-admin

  # One job per shard (tools/odoo_shards.py): each installs every release module on its own Postgres
  # service and runs the tests of its share of them. fail-fast is off so a red run reports every failing shard.
  odoo:
    name: odoo (shard ${{ matrix.shard }})
    needs: scope
    if: contains(fromJSON(needs.scope.outputs.stages), 'odoo')
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.scope.outputs.matrices)['odoo'] }}
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: odoo
          POSTGRES_PASSWORD: odoo
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U odoo"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup
        with:
          node: 'false'
          odoo: 'true'
      - run: deploy/ci/odoo.sh --shard ${{ matrix.shard }}/${{ matrix.total }}
        env:
          ODOO_TEST_MODULES: ${{ needs.scope.outputs.odoo-modules }}
      - uses: ./.github/actions/stage-pass
        if: success()
        with:
          stage: odoo
          extra: ${{ matrix.shard }}/${{ matrix.total }}|${{ needs.scope.outputs.odoo-modules }}

  # The rank-4 applications and rank-5 bridges of tools/arch_layers.json, packed into a few jobs by
  # tools/app_isolation.py matrix: each run installs only its part of the product on a fresh scratch database.
  # A job runs every module of its group and fails at the end, so a red run reports every module that does
  # not stand on its own; fail-fast is off for the same reason.
  odoo-app-standalone:
    name: odoo-app-standalone (${{ matrix.group }})
    needs: scope
    if: contains(fromJSON(needs.scope.outputs.stages), 'odoo-app-standalone')
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.scope.outputs.matrices)['odoo-app-standalone'] }}
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: odoo
          POSTGRES_PASSWORD: odoo
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U odoo"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup
        with:
          node: 'false'
          odoo: 'true'
      - run: deploy/ci/lib/isolation-group.sh deploy/ci/odoo-app-standalone.sh ${{ matrix.group }}
      - uses: ./.github/actions/stage-pass
        if: success()
        with:
          stage: odoo-app-standalone
          extra: ${{ matrix.group }}|${{ needs.scope.outputs.odoo-modules }}

  odoo-bridge:
    name: odoo-bridge (${{ matrix.group }})
    needs: scope
    if: contains(fromJSON(needs.scope.outputs.stages), 'odoo-bridge')
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.scope.outputs.matrices)['odoo-bridge'] }}
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: odoo
          POSTGRES_PASSWORD: odoo
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U odoo"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup
        with:
          node: 'false'
          odoo: 'true'
      - run: deploy/ci/lib/isolation-group.sh deploy/ci/odoo-bridge.sh ${{ matrix.group }}
      - uses: ./.github/actions/stage-pass
        if: success()
        with:
          stage: odoo-bridge
          extra: ${{ matrix.group }}|${{ needs.scope.outputs.odoo-modules }}

  upgrade:
    needs: scope
    if: contains(fromJSON(needs.scope.outputs.stages), 'upgrade')
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: odoo
          POSTGRES_PASSWORD: odoo
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U odoo"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: ./.github/actions/setup
        with:
          node: 'false'
          odoo: 'true'
      - run: deploy/ci/upgrade.sh
      - uses: ./.github/actions/stage-pass
        if: success()
        with:
          stage: upgrade

  restore-drill:
    needs: scope
    if: contains(fromJSON(needs.scope.outputs.stages), 'restore-drill')
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: odoo
          POSTGRES_PASSWORD: odoo
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U odoo"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup
        with:
          node: 'false'
          odoo: 'true'
      - run: deploy/ci/restore-drill.sh
        env:
          PG_BIN_DIR: /usr/lib/postgresql/16/bin
      - uses: ./.github/actions/stage-pass
        if: success()
        with:
          stage: restore-drill

  image:
    needs: scope
    if: contains(fromJSON(needs.scope.outputs.stages), 'image')
    runs-on: ubuntu-24.04
    # Six image builds and smoke checks, then six Trivy scans (one database download); 60 left no room for the scans.
    timeout-minutes: 75
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: odoo
          POSTGRES_PASSWORD: odoo
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U odoo"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: deploy/ci/image.sh
        env:
          LIWAN_SBOM_DIR: ${{ github.workspace }}/sbom
      - name: Upload the image SBOMs
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: image-sbom
          path: sbom/
          if-no-files-found: warn
          retention-days: 30
      - uses: ./.github/actions/stage-pass
        if: success()
        with:
          stage: image

  # One job per shard (tools/ci_stage_cache.py E2E_MOCK_SHARDS): each builds Nuxt and runs its share of the mock specs;
  # the last shard also runs the long-list specs (deploy/ci/e2e-mock.sh --shard k/N). fail-fast is off so a red run
  # reports every failing shard.
  e2e-mock:
    name: e2e-mock (shard ${{ matrix.shard }})
    needs: scope
    if: contains(fromJSON(needs.scope.outputs.stages), 'e2e-mock')
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.scope.outputs.matrices)['e2e-mock'] }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup
        with:
          playwright: 'true'
      - run: deploy/ci/e2e-mock.sh --shard ${{ matrix.shard }}/${{ matrix.total }}
      - name: Upload the e2e-mock diagnostics
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: e2e-mock-diagnostics-${{ matrix.shard }}
          path: |
            apps/web/test-results/
            apps/web/playwright-report/
            apps/web/mock.log
            apps/web/ai-mock.log
            apps/web/nuxt.log
          if-no-files-found: ignore
          retention-days: 7
      - uses: ./.github/actions/stage-pass
        if: success()
        with:
          stage: e2e-mock
          extra: ${{ matrix.shard }}/${{ matrix.total }}

  # Browser journeys against scratch Odoo. Web and addon changes select this stage before merge (tools/ci_scope.py).
  e2e-odoo:
    needs: scope
    if: contains(fromJSON(needs.scope.outputs.stages), 'e2e-odoo')
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: odoo
          POSTGRES_PASSWORD: odoo
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U odoo"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup
        with:
          playwright: 'true'
          odoo: 'true'
      - run: deploy/ci/e2e-odoo.sh
      - name: Upload the e2e-odoo diagnostics
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: e2e-odoo-diagnostics
          path: |
            apps/web/test-results/
            apps/web/playwright-report/
          if-no-files-found: ignore
          retention-days: 7
      - uses: ./.github/actions/stage-pass
        if: success()
        with:
          stage: e2e-odoo

  # One job per shard (tools/ci_stage_cache.py RTL_STORIES_SHARDS): each builds Storybook and runs its share of the
  # story tests (deploy/ci/rtl-stories.sh --shard k/N). fail-fast is off so a red run reports every failing shard.
  rtl-stories:
    name: rtl-stories (shard ${{ matrix.shard }})
    needs: scope
    if: contains(fromJSON(needs.scope.outputs.stages), 'rtl-stories')
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.scope.outputs.matrices)['rtl-stories'] }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup
        with:
          playwright: 'true'
      - run: deploy/ci/rtl-stories.sh --shard ${{ matrix.shard }}/${{ matrix.total }}
      - uses: ./.github/actions/stage-pass
        if: success()
        with:
          stage: rtl-stories
          extra: ${{ matrix.shard }}/${{ matrix.total }}

  ci-result:
    # A draft still fails closed. It must not publish the required check, even if it finishes after a ready run.
    name: ${{ github.event_name == 'pull_request' && github.event.pull_request.draft && 'ci-draft' || 'ci-result' }}
    if: always()
    needs: [scope, static, ai-service, control-plane, vendor-admin, odoo, odoo-app-standalone, odoo-bridge, upgrade, restore-drill, image, e2e-mock, e2e-odoo, rtl-stories]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Require every selected stage to pass
        env:
          NEEDS: ${{ toJSON(needs) }}
          IS_DRAFT: ${{ github.event_name == 'pull_request' && github.event.pull_request.draft }}
        run: |
          echo "$NEEDS" | jq -r 'to_entries[] | "\(.key): \(.value.result)"'
          scope_result=$(echo "$NEEDS" | jq -r '.scope.result // "missing"')
          if [ "$scope_result" != "success" ]; then
            if [ "$IS_DRAFT" = "true" ] && [ "$scope_result" = "skipped" ]; then
              echo "::error::scope did not run (a draft PR runs no stage); mark the PR ready to run CI."
            else
              echo "::error::scope did not succeed ($scope_result); inspect the scope job before rerunning CI."
            fi
            exit 1
          fi
          # Say which slow stages this run left out (tools/ci_scope.py DEFERRED_STAGES), so a green result is not read as
          # proof that they ran. They run on the push to main, the nightly run and a full dispatch.
          not_run=$(echo "$NEEDS" | jq -r '(.scope.outputs.stages | fromjson) as $selected
            | ["upgrade", "restore-drill", "image"] | map(select(. as $stage | $selected | index($stage) | not)) | join(", ")')
          if [ -n "$not_run" ]; then
            echo "::notice::Deferred stages not run on this ${GITHUB_EVENT_NAME}: ${not_run}. They run on the push to main."
            printf '### Deferred stages not run\n\n%s: left to the push to main, the nightly run and a full dispatch.\n' "$not_run" >> "$GITHUB_STEP_SUMMARY"
          fi
          # Only stages outside the selected scope may be skipped. Fail closed on
          # missing jobs or malformed scope; a green aggregate must prove the selection ran.
          echo "$NEEDS" | jq -e '
            . as $needs | (.scope.outputs.stages | fromjson) as $selected |
            .scope.result == "success" and .static.result == "success" and
            ($selected | type == "array" and index("static") != null) and
            all($selected[]; . as $stage | $needs[$stage].result == "success") and
            all(.[]; .result == "success" or .result == "skipped")
          ' > /dev/null

  # A red push to main or nightly run opens (or updates) the one `CI is red on main` issue; a green one closes it.
  # ci-result does not depend on this job. checkout is for the script; the issue and run reads need the other two.
  main-alert:
    if: always() && (github.event_name == 'schedule' || (github.event_name == 'push' && github.ref == 'refs/heads/main'))
    needs: ci-result
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      actions: read
      issues: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: deploy/ci/main-alert.sh
        env:
          GH_TOKEN: ${{ github.token }}
          CI_RESULT: ${{ needs.ci-result.result }}
