name: ci

on:
  pull_request:
    branches: [main]
    # ready_for_review starts the first run of a PR that was opened as a draft (drafts run nothing).
    types: [opened, synchronize, reopened, ready_for_review]
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      full:
        description: Run all twelve stages instead of the ones the change can affect
        type: boolean
        default: false

permissions:
  contents: read

# A newer push to the same PR or to main supersedes the older run: the newest main commit contains every
# earlier merge, so its run checks them all. A manual (release) run is never cancelled by a push.
concurrency:
  group: ci-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name != 'workflow_dispatch' }}

# The Postgres service container is ephemeral and reachable only from its own job, so these are throwaway values.
env:
  PGHOST: 127.0.0.1
  PGPORT: '5432'
  PGUSER: odoo
  PGPASSWORD: odoo
  ODOO_PORT: '8169'
  ISOLATION_PORT: '8170'
  MOCK_PORT: '8172'
  AI_MOCK_PORT: '8173'
  WEB_PORT: '3101'

jobs:
  scope:
    # A draft is still being shaped: its pushes run no stage until it is marked ready.
    if: github.event_name != 'pull_request' || !github.event.pull_request.draft
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      stages: ${{ steps.select.outputs.stages }}
      base: ${{ steps.select.outputs.base }}
      odoo-shards: ${{ steps.select.outputs.odoo-shards }}
      apps: ${{ steps.select.outputs.apps }}
      bridges: ${{ steps.select.outputs.bridges }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Select the stages
        id: select
        env:
          FULL: ${{ inputs.full || (github.event_name == 'push' && github.ref == 'refs/heads/main') }}
          PULL_REQUEST_BASE: ${{ github.event.pull_request.base.sha }}
          PUSH_BEFORE: ${{ github.event.before }}
        run: |
          set -euo pipefail
          base="${PULL_REQUEST_BASE:-$PUSH_BEFORE}"
          if [ -z "$base" ] || [ -z "${base//0/}" ] || ! git cat-file -e "$base^{commit}" 2>/dev/null; then
            base=origin/main
          fi
          if [ "$FULL" = true ]; then
            stages="$(python3 -B tools/ci_scope.py --full --stages)"
          else
            stages="$(python3 -B tools/ci_scope.py --base "$base" --stages)"
          fi
          echo "base=$base" >> "$GITHUB_OUTPUT"
          echo "stages=$stages" >> "$GITHUB_OUTPUT"
          echo "odoo-shards=$(python3 -B tools/odoo_shards.py matrix)" >> "$GITHUB_OUTPUT"
          echo "apps=$(python3 -B tools/app_isolation.py matrix apps)" >> "$GITHUB_OUTPUT"
          echo "bridges=$(python3 -B tools/app_isolation.py matrix bridges)" >> "$GITHUB_OUTPUT"
          echo "Base $base, stages $stages"

  static:
    needs: scope
    if: contains(fromJSON(needs.scope.outputs.stages), 'static')
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    env:
      CI_BASE_REF: ${{ needs.scope.outputs.base }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: ./.github/actions/setup
        with:
          playwright: 'true'
          python: 'true'
      - name: Python tools
        run: python -m pip install --quiet ruff==0.16.3 semgrep==1.170.0
      - run: deploy/ci/static.sh

  ai-service:
    needs: scope
    if: contains(fromJSON(needs.scope.outputs.stages), 'ai-service')
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      ODOO_PYTHON: python
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: odoo
          POSTGRES_PASSWORD: odoo
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U odoo"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
        with:
          node: 'false'
          python: 'true'
      - run: deploy/ci/ai-service.sh

  control-plane:
    needs: scope
    if: contains(fromJSON(needs.scope.outputs.stages), 'control-plane')
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: odoo
          POSTGRES_PASSWORD: odoo
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U odoo"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
      - run: deploy/ci/control-plane.sh

  vendor-admin:
    needs: scope
    if: contains(fromJSON(needs.scope.outputs.stages), 'vendor-admin')
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
        with:
          npm-ci: 'false'
      - run: deploy/ci/vendor-admin.sh

  # One job per shard (tools/odoo_shards.py): each installs every release module on its own Postgres
  # service and runs the tests of its share of them. fail-fast is off so a red run reports every failing shard.
  odoo:
    name: odoo (shard ${{ matrix.shard }})
    needs: scope
    if: contains(fromJSON(needs.scope.outputs.stages), 'odoo')
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        shard: ${{ fromJSON(needs.scope.outputs.odoo-shards) }}
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: odoo
          POSTGRES_PASSWORD: odoo
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U odoo"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
        with:
          node: 'false'
          odoo: 'true'
      - run: deploy/ci/odoo.sh --shard ${{ matrix.shard }}/${{ strategy.job-total }}

  # The rank-4 applications and rank-5 bridges of tools/arch_layers.json, packed into a few jobs by
  # tools/app_isolation.py matrix: each run installs only its part of the product on a fresh scratch database.
  # A job runs every module of its group and fails at the end, so a red run reports every module that does
  # not stand on its own; fail-fast is off for the same reason.
  odoo-app-standalone:
    name: odoo-app-standalone (${{ matrix.group }})
    needs: scope
    if: contains(fromJSON(needs.scope.outputs.stages), 'odoo-app-standalone')
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        group: ${{ fromJSON(needs.scope.outputs.apps) }}
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: odoo
          POSTGRES_PASSWORD: odoo
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U odoo"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
        with:
          node: 'false'
          odoo: 'true'
      - run: deploy/ci/lib/isolation-group.sh deploy/ci/odoo-app-standalone.sh ${{ matrix.group }}

  odoo-bridge:
    name: odoo-bridge (${{ matrix.group }})
    needs: scope
    if: contains(fromJSON(needs.scope.outputs.stages), 'odoo-bridge')
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        group: ${{ fromJSON(needs.scope.outputs.bridges) }}
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: odoo
          POSTGRES_PASSWORD: odoo
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U odoo"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
        with:
          node: 'false'
          odoo: 'true'
      - run: deploy/ci/lib/isolation-group.sh deploy/ci/odoo-bridge.sh ${{ matrix.group }}

  upgrade:
    needs: scope
    if: contains(fromJSON(needs.scope.outputs.stages), 'upgrade')
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: odoo
          POSTGRES_PASSWORD: odoo
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U odoo"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: ./.github/actions/setup
        with:
          node: 'false'
          odoo: 'true'
      - run: deploy/ci/upgrade.sh

  restore-drill:
    needs: scope
    if: contains(fromJSON(needs.scope.outputs.stages), 'restore-drill')
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: odoo
          POSTGRES_PASSWORD: odoo
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U odoo"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
        with:
          node: 'false'
          odoo: 'true'
      - run: deploy/ci/restore-drill.sh
        env:
          PG_BIN_DIR: /usr/lib/postgresql/16/bin

  image:
    needs: scope
    if: contains(fromJSON(needs.scope.outputs.stages), 'image')
    runs-on: ubuntu-24.04
    # Six image builds and smoke checks, then six Trivy scans (one database download); 60 left no room for the scans.
    timeout-minutes: 75
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: odoo
          POSTGRES_PASSWORD: odoo
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U odoo"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    steps:
      - uses: actions/checkout@v4
      - run: deploy/ci/image.sh

  e2e-mock:
    needs: scope
    if: contains(fromJSON(needs.scope.outputs.stages), 'e2e-mock')
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
        with:
          playwright: 'true'
      - run: deploy/ci/e2e-mock.sh

  rtl-stories:
    needs: scope
    if: contains(fromJSON(needs.scope.outputs.stages), 'rtl-stories')
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
        with:
          playwright: 'true'
      - run: deploy/ci/rtl-stories.sh

  ci-result:
    # Runs for a draft too and fails there (scope did not run), so a skipped check never reads as a pass.
    if: always()
    needs: [scope, static, ai-service, control-plane, vendor-admin, odoo, odoo-app-standalone, odoo-bridge, upgrade, restore-drill, image, e2e-mock, rtl-stories]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Require every selected stage to pass
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: |
          echo "$NEEDS" | jq -r 'to_entries[] | "\(.key): \(.value.result)"'
          # Only stages outside the selected scope may be skipped. Fail closed on
          # missing jobs or malformed scope; a green aggregate must prove the selection ran.
          echo "$NEEDS" | jq -e '
            . as $needs | (.scope.outputs.stages | fromjson) as $selected |
            .scope.result == "success" and .static.result == "success" and
            ($selected | type == "array" and index("static") != null) and
            all($selected[]; . as $stage | $needs[$stage].result == "success") and
            all(.[]; .result == "success" or .result == "skipped")
          ' > /dev/null
