name: audit

# Daily npm advisory check of main. A new advisory against an unchanged dependency set
# fails this run (GitHub notifies the owner) without blocking unrelated pull requests;
# pull requests that change dependencies are gated by the ci `static` stage.
on:
  schedule:
    - cron: '0 3 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: .nvmrc
      - run: npm run check:audit
