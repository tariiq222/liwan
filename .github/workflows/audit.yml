name: audit

# Daily checks of main. A new advisory against an unchanged dependency set (npm, and the pinned Python
# packages of apps/ai-service) fails this run (GitHub notifies the owner) without blocking unrelated
# pull requests; pull requests that change dependencies are gated by the ci `static` and `ai-service` stages.
# The secret scan reads every tracked file of the tree, so a secret that predates a rule change
# or sits where no pull request touched is found here.
on:
  schedule:
    - cron: '0 3 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
      - run: npm run check:audit

  ai-service-audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: deploy/ci/lib/ai-service-audit.sh

  secret-scan:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: python3 -B tools/secret_guard.py
