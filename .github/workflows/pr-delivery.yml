name: pr-delivery

on:
  workflow_run:
    workflows: [ci, pr-review]
    types: [completed]
  issue_comment:
    types: [created]
  workflow_dispatch:
    inputs:
      pr:
        description: Reevaluate a same-repository PR
        required: true
        type: string

permissions:
  contents: read

jobs:
  resolve:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    outputs:
      pr: ${{ steps.resolve.outputs.pr }}
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: main
          persist-credentials: false
      - id: resolve
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 -B - <<'PY'
          import os, sys
          sys.path.insert(0, 'tools')
          from pr_delivery import event_pr
          from pr_review import output
          number = event_pr(os.environ['GITHUB_REPOSITORY'])
          if number:
              output(pr=number)
          PY

  decide:
    needs: resolve
    if: github.ref == 'refs/heads/main' && needs.resolve.outputs.pr != ''
    runs-on: ubuntu-24.04
    concurrency:
      group: delivery-decision-${{ needs.resolve.outputs.pr }}
      cancel-in-progress: false
    permissions:
      contents: write
      pull-requests: write
      issues: write
      statuses: write
      actions: write
    outputs:
      decision: ${{ steps.plan.outputs.decision }}
      pr: ${{ steps.plan.outputs.pr }}
      head: ${{ steps.plan.outputs.head }}
      attempt: ${{ steps.plan.outputs.attempt }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: main
          persist-credentials: false
      - id: plan
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ needs.resolve.outputs.pr }}
        run: python3 -B tools/pr_delivery.py plan --repo "$GITHUB_REPOSITORY" --pr "$PR_NUMBER"

  repair:
    needs: decide
    if: github.ref == 'refs/heads/main' && needs.decide.outputs.decision == 'repair'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    environment: agent
    permissions:
      contents: read
      pull-requests: read
      issues: read
      actions: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: main
          persist-credentials: false
      - uses: ./.github/actions/claude-subscription
      - name: Generate data only, with no tools or write credentials
        env:
          GH_TOKEN: ${{ github.token }}
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          PR_NUMBER: ${{ needs.decide.outputs.pr }}
          PR_HEAD: ${{ needs.decide.outputs.head }}
        run: >-
          python3 -B tools/pr_repair.py --repo "$GITHUB_REPOSITORY" --pr "$PR_NUMBER"
          --head "$PR_HEAD" --output "$RUNNER_TEMP/repair.json"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: repair-${{ github.run_id }}
          path: ${{ runner.temp }}/repair.json
          retention-days: 1

  publish:
    needs: [decide, repair]
    if: github.ref == 'refs/heads/main' && needs.decide.outputs.decision == 'repair' && needs.repair.result == 'success'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      pull-requests: write
      issues: read
      statuses: write
      actions: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: main
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: repair-${{ github.run_id }}
          path: ${{ runner.temp }}/repair
      - env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ needs.decide.outputs.pr }}
          PR_HEAD: ${{ needs.decide.outputs.head }}
          ATTEMPT: ${{ needs.decide.outputs.attempt }}
        run: >-
          python3 -B tools/pr_delivery.py publish --repo "$GITHUB_REPOSITORY" --pr "$PR_NUMBER"
          --head "$PR_HEAD" --attempt "$ATTEMPT" --report "$RUNNER_TEMP/repair/repair.json"
