name: claude-subscription-check

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  connection:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    environment: review
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: main
          persist-credentials: false
      - uses: ./.github/actions/claude-subscription
      - name: Verify subscription request without tools or API key
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
        run: |
          answer=$(printf 'Connection check only. Reply with the single word OK.' | claude --print --model sonnet \
            --max-turns 1 --tools '' --strict-mcp-config --mcp-config '{"mcpServers":{}}' --setting-sources '')
          [ "$answer" = OK ] || { echo 'Subscription connection did not return valid proof'; exit 1; }
          echo CLAUDE_SUBSCRIPTION_CONNECTION_OK
