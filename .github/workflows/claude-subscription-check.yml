name: claude-subscription-check

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  connection:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    environment: agent
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: main
          persist-credentials: false
      - uses: ./.github/actions/claude-subscription
      - name: Verify subscription request without tools or API key
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
        run: |
          python3 -B - <<'PY'
          import sys
          sys.path.insert(0, 'tools')
          from pr_repair import model_report
          schema = {'type': 'object', 'properties': {'ok': {'type': 'boolean'}}, 'required': ['ok']}
          report = model_report('Connection check only. Return JSON with ok true. Do not use tools.', schema)
          if report != {'ok': True}:
              raise SystemExit('Subscription connection did not return valid proof')
          print('CLAUDE_SUBSCRIPTION_CONNECTION_OK')
          PY
