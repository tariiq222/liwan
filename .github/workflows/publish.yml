name: publish

# Builds and releases the production images; it never deploys anything.
#
# Push to main (or a manual run): every image in deploy/production-images.json is built for linux/arm64 (both servers
# are arm64) on the native ubuntu-24.04-arm runner (no emulation), pushed to ghcr.io/tariiq222 tagged with the commit,
# and smoke-checked and scanned by deploy/ci/image.sh.
# The release document of that commit (deploy/releases/manifest.py format plus every image identity, all @sha256:) is
# stored as ghcr.io/tariiq222/liwan-release:<commit> and signed keylessly (cosign, sigstore, this workflow's OIDC
# identity) as an in-toto attestation of type https://liwanos.com/attestations/release-manifest/staging/v1.
#
# Push of a release/* tag: nothing is rebuilt. The staging attestation of the tagged commit is verified against the
# main-branch identity of this workflow and re-attested with the production type (.../production/v1) under the tag
# identity. A commit with no published document fails the run.
# The workflow and script of a tag run come from the tagged commit, so the in-workflow checks only protect the reviewed
# path. A verifier of the production attestation must also pass `--certificate-github-workflow-sha <commit>` (the commit
# in the release document) and require the staging attestation of the same release document signed by the main
# identity, so only code merged to main can produce a trusted production signature. The `production` environment
# (required reviewers, deployment rule limited to `release/*` tags) and a tag ruleset restricting who creates
# `release/*` tags are repository settings the owner configures.
#
# A server agent fetches without credentials: resolve ghcr.io/tariiq222/liwan-release:<commit>, then
# `cosign verify-attestation --type <channel type> --certificate-oidc-issuer https://token.actions.githubusercontent.com
# --certificate-identity <this workflow at refs/heads/main for staging, refs/tags/release/<version> for production>`.
# Only runs on main write liwan-release:<commit> and every write is signed by the main identity, so promote can resolve
# that tag safely. A manual run on another branch builds the image and runs the image.sh smoke checks and scans,
# but signs in nowhere, pushes nothing, and creates no release document or attestation.
# The GHCR packages must be public once (a new package starts private) for that to work without a token.
on:
  push:
    branches: [main]
    tags: ['release/*']
  workflow_dispatch:

permissions:
  contents: read
  packages: write
  id-token: write

concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: false

# The Postgres service container is ephemeral and reachable only from its own job, so these are throwaway values.
env:
  PGHOST: 127.0.0.1
  PGPORT: '5432'
  PGUSER: odoo
  PGPASSWORD: odoo
  ODOO_PORT: '8169'
  LIWAN_SBOM_DIR: ${{ github.workspace }}/sbom

jobs:
  build:
    if: github.ref_type == 'branch'
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 120
    services:
      postgres:
        image: postgres:16@sha256:f9a7b9ebf6f56201f949db745e47bc423c0f0f8294bafe991cc10bf74b029657
        env:
          POSTGRES_USER: odoo
          POSTGRES_PASSWORD: odoo
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U odoo"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Sign in to GHCR
        if: github.ref == 'refs/heads/main'
        run: echo "$GITHUB_TOKEN" | docker login ghcr.io --username "$GITHUB_ACTOR" --password-stdin
        env:
          GITHUB_TOKEN: ${{ github.token }}
      - run: deploy/ci/publish.sh build digests
      - name: Upload the digests
        if: github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: digests
          path: digests/
          if-no-files-found: error
          retention-days: 1
      - name: Upload the image SBOMs
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: image-sbom
          path: sbom/
          if-no-files-found: warn
          retention-days: 30

  release:
    if: github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Sign in to GHCR
        run: echo "$GITHUB_TOKEN" | docker login ghcr.io --username "$GITHUB_ACTOR" --password-stdin
        env:
          GITHUB_TOKEN: ${{ github.token }}
      - uses: sigstore/cosign-installer@756fe2d284c7292c4e9b62c8a28f1e5629c59532 # v4.1.3
      - name: Download the digests
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: digests
          path: digests/
      - run: deploy/ci/publish.sh merge digests/

  promote:
    if: github.ref_type == 'tag'
    environment: production
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Sign in to GHCR
        run: echo "$GITHUB_TOKEN" | docker login ghcr.io --username "$GITHUB_ACTOR" --password-stdin
        env:
          GITHUB_TOKEN: ${{ github.token }}
      - uses: sigstore/cosign-installer@756fe2d284c7292c4e9b62c8a28f1e5629c59532 # v4.1.3
      - run: deploy/ci/publish.sh promote
