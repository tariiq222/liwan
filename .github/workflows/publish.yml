name: publish

# Builds the production images for linux/arm64 and publishes the release document of a release tag to the private GitHub
# container registry (ghcr.io/tariiq222); it deploys nothing itself, it only tells an environment that a commit is ready.
#
# It runs for a release/19.0.X.Y.Z tag only; a push to main starts no publish run. For a tag whose commit is in main it builds
# the nine images for linux/arm64 on an arm64 runner (staging and production are arm64; nothing is emulated), scans them
# with deploy/ci/image.sh, pushes them, writes liwan-release:<commit> covering linux/arm64 and tells staging. A tag whose
# document already covers linux/arm64 rebuilds nothing and only tells staging again. Nothing here targets a live customer
# environment.
#
# Runners are GitHub-hosted only (the repository is public). The registry is written with the
# workflow token (packages: write on the jobs that push); no registry secret is stored.
#
# Secrets (repository secrets, values typed by the owner):
#   LIWAN_STAGING_HOOK_URL, LIWAN_STAGING_HOOK_TOKEN   the staging hook
on:
  push:
    tags: ['release/**']

permissions:
  contents: read

# One publish run per commit at a time, so the check-then-write of `publish.sh merge` is never run by two runs at once.
# Runs are queued, never cancelled: cancelling would leave a half-pushed commit. GitHub keeps only one pending run per
# group, so a second release tag pushed on a commit while two runs are already queued cancels the older pending one: use
# one release tag per commit.
concurrency:
  group: publish-${{ github.sha }}
  cancel-in-progress: false

# The Postgres service container image.sh needs is ephemeral and reachable only from its own job, so these are throwaway
# values.
env:
  PGHOST: 127.0.0.1
  PGPORT: '5432'
  PGUSER: odoo
  PGPASSWORD: odoo
  ODOO_PORT: '8169'

jobs:
  plan:
    if: github.repository == 'tariiq222/liwan'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      packages: read
    outputs:
      state: ${{ steps.check.outputs.state }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Sign in to the registry
        run: deploy/ci/publish.sh login
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Decide what this run does
        id: check
        run: deploy/ci/publish.sh check
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Sign out of the registry
        if: always()
        run: docker logout ghcr.io > /dev/null 2>&1 || true

  build-arm64:
    needs: plan
    if: needs.plan.outputs.state == 'build'
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 120
    permissions:
      contents: read
      packages: write
    services:
      postgres:
        image: postgres:16@sha256:f9a7b9ebf6f56201f949db745e47bc423c0f0f8294bafe991cc10bf74b029657
        env:
          POSTGRES_USER: odoo
          POSTGRES_PASSWORD: odoo
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U odoo"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Sign in to the registry
        run: deploy/ci/publish.sh login
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and scan the images
        run: deploy/ci/publish.sh build
      - name: Push the images
        run: deploy/ci/publish.sh push
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Clean up
        if: always()
        run: |
          docker buildx rm --force liwan-publish >/dev/null 2>&1 || true
          docker logout ghcr.io >/dev/null 2>&1 || true

  release:
    # Joins what the arm64 job pushed and writes the release document.
    needs: [plan, build-arm64]
    if: ${{ !cancelled() && needs.plan.outputs.state == 'build' && needs.build-arm64.result == 'success' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Sign in to the registry
        run: deploy/ci/publish.sh login
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Join the images and publish the release document
        run: deploy/ci/publish.sh merge
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Clean up
        if: always()
        run: |
          docker buildx rm --force liwan-publish >/dev/null 2>&1 || true
          docker logout ghcr.io >/dev/null 2>&1 || true

  notify-staging:
    needs: [plan, release]
    if: >-
      ${{ !cancelled() && needs.plan.result == 'success'
      && (needs.plan.outputs.state == 'published' || needs.release.result == 'success') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Tell staging a release is ready
        run: |
          set -euo pipefail
          if [ -z "$HOOK_URL" ] || [ -z "$HOOK_TOKEN" ]; then
            echo "LIWAN_STAGING_HOOK_URL and LIWAN_STAGING_HOOK_TOKEN must both be set as repository secrets, because the release is published but staging was not told" >&2
            exit 1
          fi
          curl -fsS -X POST -H "Authorization: Bearer $HOOK_TOKEN" "$HOOK_URL" > /dev/null
        env:
          HOOK_URL: ${{ secrets.LIWAN_STAGING_HOOK_URL }}
          HOOK_TOKEN: ${{ secrets.LIWAN_STAGING_HOOK_TOKEN }}
