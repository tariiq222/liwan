version: 2

# The workflows pin every action to a commit SHA (`# vX.Y.Z` carries the readable version). A pin never
# moves on its own: this file opens one grouped pull request a week so the pin, its comment and the
# reviewed diff arrive together, and the `ci` workflow proves the result before it can merge.
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: '05:10'
      timezone: Asia/Riyadh
    open-pull-requests-limit: 1
    commit-message:
      prefix: 'ci(ci)'
    groups:
      actions:
        patterns: ['*']

  # Docker image digests are updated by hand. audit.yml reports npm advisories daily.
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: '05:20'
      timezone: Asia/Riyadh
    open-pull-requests-limit: 3
    commit-message:
      prefix: 'build(ci)'
    groups:
      # The first matching group wins. Keep compiler and Nuxt UI changes
      # independent of routine updates so their CI failures are attributable.
      typescript:
        patterns: ['typescript', 'vue-tsc']
      nuxt-ui:
        patterns: ['@nuxt/ui']
      npm:
        patterns: ['*']
        update-types: ['minor', 'patch']
