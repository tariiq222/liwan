services:
  proxy:
    image: caddy:2
    restart: unless-stopped
    ports: ["80:80", "443:443"]
    environment: { DOMAIN: "${DOMAIN}" }
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
    depends_on:
      web: { condition: service_healthy }
      odoo: { condition: service_healthy }

  web:
    build: { context: .., dockerfile: apps/web/Dockerfile }
    restart: unless-stopped
    environment:
      NUXT_ODOO_URL: http://odoo:8069
      NUXT_ODOO_DB: "${DB_NAME}"
    expose: ["3000"]
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:3000/login').then(r => process.exit(r.ok ? 0 : 1), () => process.exit(1))"]
      interval: 5s
      timeout: 10s
      retries: 20
    depends_on:
      odoo: { condition: service_healthy }

  odoo:
    image: odoo:19.0
    restart: unless-stopped
    command: ["odoo", "-c", "/etc/odoo/odoo.conf", "--workers", "2", "--proxy-mode"]
    environment:
      HOST: db
      USER: odoo
      PASSWORD: "${DB_PASSWORD}"
    volumes:
      - ./data/odoo.conf:/etc/odoo/odoo.conf:ro
      - ../odoo-addons:/mnt/extra-addons:ro
      - odoo_data:/var/lib/odoo
    expose: ["8069", "8072"]
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8069/web/version || exit 1"]
      interval: 5s
      timeout: 10s
      retries: 20
    depends_on:
      db: { condition: service_healthy }

  db:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_DB: postgres
      POSTGRES_USER: odoo
      POSTGRES_PASSWORD: "${DB_PASSWORD}"
    volumes: [db_data:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U odoo"]
      interval: 5s
      timeout: 5s
      retries: 20

volumes: { caddy_data: {}, odoo_data: {}, db_data: {} }
