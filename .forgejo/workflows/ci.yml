name: ci

# Forgejo port of .github/workflows/ci.yml. The stage scripts (deploy/ci/*.sh) are the same files GitHub runs; only the
# job plumbing differs. Differences from the GitHub workflow, each on purpose:
#  - No merge_group and no pull_request trigger (see `on:`), so every run is a push or dispatch run.
#  - No stage-pass cache: GitHub reuses passed jobs on identical inputs through actions/cache; the runner here has no
#    shared cache for it, so every run executes every selected job (tools/ci_stage_cache.py plan runs without --reuse-passes).
#  - Postgres runs inside the job on loopback (.forgejo/actions/setup) instead of as `services:`, because the
#    stage scripts connect to 127.0.0.1; this keeps one set of scripts.
#  - Timeouts are twice GitHub's: two shared job slots on one host run each stage several times slower.
#  - The runner label ci-amd64 runs jobs as root in node:22-bookworm: no sudo, no apt cache, Node and Python 3.12
#    are installed by the setup action.
#  - No main-alert job: it opens a GitHub issue through `gh`; while GitHub is the source of truth it keeps doing that.
#  - The workflow references no secret and no host mount: CI jobs run untrusted-branch code and hold nothing worth stealing.
#    The image stage (the only one needing Docker) is still to port.
# No pull_request trigger until P8, which adds it on a separate untrusted runner.
#
# Ported so far (green on the ci-amd64 runner): ai-service, vendor-admin. Still to port, in this order, each green on
# Forgejo before the next: static (parts policies and tests; types already passes), control-plane, odoo, odoo-app-standalone,
# odoo-bridge, upgrade, restore-drill, contract-fixtures, image, e2e-mock, e2e-odoo, rtl-stories. The full draft of all
# thirteen stages is kept by the coordinator from the P5 report; the `scope` job already plans every stage, and ci-result below only requires the ported ones.
on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      full:
        description: Run all thirteen stages instead of the ones the change can affect
        type: boolean
        default: false

# A run on main always finishes; a newer push queues behind it.
concurrency:
  group: ci-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: false

# Postgres runs inside each job and is reachable only from it, so these are throwaway values.
env:
  PGHOST: 127.0.0.1
  PGPORT: '5432'
  PGUSER: odoo
  PGPASSWORD: odoo

jobs:
  scope:
    runs-on: ci-amd64
    timeout-minutes: 20
    outputs:
      stages: ${{ steps.cache.outputs.stages }}
      matrices: ${{ steps.cache.outputs.matrices }}
      base: ${{ steps.select.outputs.base }}
      odoo-modules: ${{ steps.select.outputs.odoo-modules }}
    steps:
      - uses: https://github.com/actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Select the stages
        id: select
        env:
          FULL: ${{ inputs.full || (github.event_name == 'push' && github.ref == 'refs/heads/main') }}
          PUSH_BEFORE: ${{ github.event.before }}
        run: |
          set -euo pipefail
          base="$PUSH_BEFORE"
          if [ -z "$base" ] || [ -z "${base//0/}" ] || ! git cat-file -e "$base^{commit}" 2>/dev/null; then
            base=origin/main
          fi
          modules=""
          if [ "$FULL" = true ]; then
            stages="$(python3 -B tools/ci_scope.py --full --stages)"
          else
            stages="$(python3 -B tools/ci_scope.py --base "$base" --stages)"
          fi
          echo "base=$base" >> "$GITHUB_OUTPUT"
          echo "stages=$stages" >> "$GITHUB_OUTPUT"
          echo "odoo-modules=$modules" >> "$GITHUB_OUTPUT"
          echo "odoo-shards=$(python3 -B tools/odoo_shards.py matrix ${modules:+--modules "$modules"})" >> "$GITHUB_OUTPUT"
          echo "e2e-mock-shards=$(python3 -B tools/ci_stage_cache.py e2e-mock-shards)" >> "$GITHUB_OUTPUT"
          echo "rtl-stories-shards=$(python3 -B tools/ci_stage_cache.py rtl-stories-shards)" >> "$GITHUB_OUTPUT"
          echo "apps=$(python3 -B tools/app_isolation.py matrix apps ${modules:+--modules "$modules"})" >> "$GITHUB_OUTPUT"
          echo "bridges=$(python3 -B tools/app_isolation.py matrix bridges ${modules:+--modules "$modules"})" >> "$GITHUB_OUTPUT"
          echo "Base $base, stages $stages"
      - name: Plan the jobs
        id: cache
        env:
          SELECTED: ${{ steps.select.outputs.stages }}
          ODOO_MODULES: ${{ steps.select.outputs.odoo-modules }}
          ODOO_SHARDS: ${{ steps.select.outputs.odoo-shards }}
          E2E_MOCK_SHARDS: ${{ steps.select.outputs.e2e-mock-shards }}
          RTL_STORIES_SHARDS: ${{ steps.select.outputs.rtl-stories-shards }}
          APPS: ${{ steps.select.outputs.apps }}
          BRIDGES: ${{ steps.select.outputs.bridges }}
        run: |
          set -euo pipefail
          command -v jq >/dev/null || { apt-get update -q && apt-get install -y -q --no-install-recommends jq; }
          plan="$(python3 -B tools/ci_stage_cache.py plan --stages "$SELECTED" --odoo-shards "$ODOO_SHARDS" \
            --e2e-mock-shards "$E2E_MOCK_SHARDS" --rtl-stories-shards "$RTL_STORIES_SHARDS" \
            --apps "$APPS" --bridges "$BRIDGES" --odoo-modules "$ODOO_MODULES")"
          echo "stages=$(jq -ce '.stages' <<< "$plan")" >> "$GITHUB_OUTPUT"
          echo "matrices=$(jq -ce '.matrices' <<< "$plan")" >> "$GITHUB_OUTPUT"

  # The parts of deploy/ci/static.sh run in parallel as the matrix; the stage passes only when every part passes.

  ai-service:
    needs: scope
    if: contains(fromJSON(needs.scope.outputs.stages), 'ai-service')
    runs-on: ci-amd64
    timeout-minutes: 40
    env:
      ODOO_PYTHON: python
    steps:
      - uses: https://github.com/actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.forgejo/actions/setup
        with:
          node: 'false'
          python: 'true'
          postgres: 'pgvector'
      - run: deploy/ci/ai-service.sh

  vendor-admin:
    needs: scope
    if: contains(fromJSON(needs.scope.outputs.stages), 'vendor-admin')
    runs-on: ci-amd64
    timeout-minutes: 60
    steps:
      - uses: https://github.com/actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.forgejo/actions/setup
        with:
          npm-ci: 'false'
      - run: deploy/ci/vendor-admin.sh

  # One job per shard (tools/odoo_shards.py): each installs every release module on its own Postgres and runs its share.

  ci-result:
    name: ci-result
    if: always()
    needs: [scope, ai-service, vendor-admin]
    runs-on: ci-amd64
    timeout-minutes: 5
    steps:
      - name: Require every selected and ported stage to pass
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: |
          command -v jq >/dev/null || { apt-get update -q && apt-get install -y -q --no-install-recommends jq; }
          echo "$NEEDS" | jq -r 'to_entries[] | "\(.key): \(.value.result)"'
          # Stages not ported yet (see the header) are not judged here; GitHub's ci-result still gates merges.
          echo "$NEEDS" | jq -e '
            . as $needs | (.scope.outputs.stages | fromjson | map(select(. == "ai-service" or . == "vendor-admin"))) as $selected |
            .scope.result == "success" and all($selected[]; . as $stage | $needs[$stage].result == "success") and
            all(.[]; .result == "success" or .result == "skipped")
          ' > /dev/null
