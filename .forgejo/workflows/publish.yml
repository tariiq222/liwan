name: publish-trigger

# Asks the publish repository to publish Forgejo main; it builds nothing and holds no registry credential.
#
# The registry write token lives only as a secret of the admin-only repository liwanos/liwan-publish, whose workflow
# (deploy/ci/publish-zone/publish.yml, see its README) runs on the publish runner alone. This workflow only calls its
# dispatch API on every push to main, with no input: the publish job resolves main itself, so a leaked trigger token can
# only ask for a publish of main.
#
# Secret (repository secret of liwanos/liwan, value typed by the owner):
#   LIWAN_PUBLISH_TRIGGER_TOKEN   token of a bot with Actions write and code read on liwanos/liwan-publish only
on:
  push:
    branches: [main]

jobs:
  trigger:
    runs-on: ci-amd64
    timeout-minutes: 5
    steps:
      - name: Ask liwanos/liwan-publish to publish main
        run: |
          set -euo pipefail
          if [ -z "$TRIGGER_TOKEN" ]; then
            echo "LIWAN_PUBLISH_TRIGGER_TOKEN is not set as a repository secret: nothing asked the publish repository to publish" >&2
            exit 1
          fi
          curl -fsS -X POST --config <(printf 'header = "Authorization: token %s"\n' "$TRIGGER_TOKEN") \
            -H 'Content-Type: application/json' -d '{"ref":"main"}' \
            "$GITHUB_SERVER_URL/api/v1/repos/liwanos/liwan-publish/actions/workflows/publish.yml/dispatches" > /dev/null
        env:
          TRIGGER_TOKEN: ${{ secrets.LIWAN_PUBLISH_TRIGGER_TOKEN }}
