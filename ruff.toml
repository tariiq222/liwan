# ruff config for odoo-addons/*: mirrors the conventions used by the Odoo
# checkout's own generated ruff.toml (/Users/tariq/code/odoo/ruff.toml) so
# that standard Odoo module boilerplate — bare `from . import x` re-exports
# in __init__.py, bare dict-literal __manifest__.py files — is not flagged.

target-version = "py312"

[lint]
select = [
    "E",          # pycodestyle Error
    "F",          # Pyflakes
    "I",          # isort
    "W",          # pycodestyle Warning
]
ignore = [
    "E501",       # line-too-long
]

[lint.per-file-ignores]
"**/__init__.py" = [
    "F401",       # unused-import: the whole-module re-export pattern
]

[lint.isort]
# https://www.odoo.com/documentation/latest/contributing/development/coding_guidelines.html#imports
section-order = ["future", "standard-library", "third-party", "first-party", "local-folder"]
known-first-party = ["odoo"]
known-local-folder = ["odoo.addons"]
