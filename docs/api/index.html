<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>webvue /api/v1 — generated OpenAPI surface</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/swagger-ui-dist@5/swagger-ui.css" />
  </head>
  <body>
    <div id="swagger"></div>
    <script src="https://cdn.jsdelivr.net/npm/swagger-ui-dist@5/swagger-ui-bundle.js"></script>
    <script>
      // openapi.json is generated by tools/api_surface.py — never edit it by hand.
      SwaggerUIBundle({
        url: './openapi.json',
        dom_id: '#swagger',
        docExpansion: 'none',
        tryItOutEnabled: false,
        supportedSubmitMethods: [],
      });
    </script>
  </body>
</html>
