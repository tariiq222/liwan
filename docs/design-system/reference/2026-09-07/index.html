<script>
const paths={projects:'M3 7h6l2 2h10v11H3z M3 7V4h6l2 3',tasks:'M9 5h11v15H4V5h2 M9 3h6v4H9z M8 12l2 2 5-5',reports:'M4 20V10m6 10V4m6 16v-7m5 7H2',chat:'M20 16a2 2 0 0 1-2 2H8l-5 3V5a2 2 0 0 1 2-2h13a2 2 0 0 1 2 2z',settings:'M12 8a4 4 0 1 0 0 8 4 4 0 0 0 0-8 M12 3v2m0 14v2M3 12h2m14 0h2M5.6 5.6 7 7m10 10 1.4 1.4M5.6 18.4 7 17M17 7l1.4-1.4',panel:'M3 4h18v16H3z M15 4v16',arrow:'M5 12h14m-5-5 5 5-5 5',chevron:'m9 5 7 7-7 7',down:'m6 9 6 6 6-6',summary:'M3 3h7v7H3z M14 3h7v7h-7z M3 14h7v7H3z M14 14h7v7h-7z',users:'M9 11a4 4 0 1 0 0-8 4 4 0 0 0 0 8 M2 21v-3a5 5 0 0 1 5-5h4a5 5 0 0 1 5 5v3 M17 4a4 4 0 0 1 0 7m2 3a5 5 0 0 1 3 4v3',risk:'m12 3 10 18H2z M12 9v5m0 3h.01',finance:'M3 6h18v14H3z M3 6V4h15v2m-2 5h5v5h-5z',file:'M5 3h9l5 5v13H5z M14 3v6h5 M8 13h8m-8 4h6',calendar:'M4 5h16v16H4z M8 3v4m8-4v4M4 10h16',clock:'M12 3a9 9 0 1 0 0 18 9 9 0 0 0 0-18 M12 7v5l3 2',plus:'M12 5v14M5 12h14',list:'M9 5h12M9 12h12M9 19h12M3 5h.01M3 12h.01M3 19h.01',board:'M3 4h5v16H3z M10 4h5v11h-5z M17 4h5v14h-5z',gantt:'M3 5h9v3H3z M8 11h12v3H8z M13 17h8v3h-8z',milestone:'m12 3 9 9-9 9-9-9z',search:'M10 3a7 7 0 1 0 0 14 7 7 0 0 0 0-14 M15 15l6 6',check:'m5 12 4 4 10-10',circle:'M12 3a9 9 0 1 0 0 18 9 9 0 0 0 0-18',info:'M12 3a9 9 0 1 0 0 18 9 9 0 0 0 0-18 M12 11v6m0-10h.01',help:'M12 3a9 9 0 1 0 0 18 9 9 0 0 0 0-18 M9 9a3 3 0 1 1 4 3c-1 0-1 1-1 2m0 3h.01'};
const icon=n=>`<svg aria-hidden="true" viewBox="0 0 24 24"><path d="${paths[n]||paths.file}"/></svg>`;
const badge=(text,tone='')=>`<span class="badge ${tone}"><i class="dot"></i>${text}</span>`;
const people=[['سارة العتيبي','س ع','purple'],['محمد القحطاني','م ق','green'],['نورة الحربي','ن ح','orange'],['أحمد الدوسري','أ د','']];
let tasks=[{id:1,name:'اعتماد تجربة المستخدم للبوابة',person:0,status:'review',date:'05 سبتمبر',late:true,priority:'عالية',milestone:'اعتماد التصميم',start:6,width:23},{id:2,name:'ربط خدمة التحقق من الهوية',person:1,status:'doing',date:'06 سبتمبر',late:true,priority:'عالية',milestone:'الإطلاق التجريبي',start:14,width:39},{id:3,name:'تطوير لوحة متابعة الطلبات',person:1,status:'doing',date:'14 سبتمبر',priority:'عادية',milestone:'الإطلاق التجريبي',start:20,width:38},{id:4,name:'اختبار سهولة الوصول',person:2,status:'todo',date:'18 سبتمبر',priority:'عادية',milestone:'الإطلاق التجريبي',start:55,width:20},{id:5,name:'إعداد دليل المستخدم',person:3,status:'todo',date:'22 سبتمبر',priority:'عادية',milestone:'التسليم النهائي',start:68,width:23},{id:6,name:'توثيق متطلبات الخدمات',person:0,status:'done',date:'24 أغسطس',priority:'عادية',milestone:'تحديد النطاق',start:0,width:16},{id:7,name:'مراجعة رحلة المستفيد',person:2,status:'done',date:'27 أغسطس',priority:'عادية',milestone:'تحديد النطاق',start:3,width:18},{id:8,name:'تصميم الهوية البصرية للبوابة',person:0,status:'done',date:'30 أغسطس',priority:'عادية',milestone:'اعتماد التصميم',start:7,width:20}];
const status={todo:['لم تبدأ',''],doing:['قيد التنفيذ','blue'],review:['للمراجعة','amber'],done:['منجزة','green']};
const milestones=[['تحديد النطاق','تم التسليم · 27 أغسطس','done','27 أغسطس'],['اعتماد التصميم','بانتظار اعتماد تجربة المستخدم','next','09 سبتمبر'],['الإطلاق التجريبي','ربط الخدمات واختبار البوابة','','20 سبتمبر'],['التسليم النهائي','الدليل والتدريب والتسليم','','30 سبتمبر']];
let collapsed=innerWidth<760,railExpanded=false,search='',filter='all',taskView='table';
const safe=x=>String(x).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const person=i=>`<span class="assignee"><span class="avatar ${people[i][2]}">${people[i][1]}</span>${people[i][0]}</span>`;
const navItem=(url,label,i,active,count='')=>`<a href="#${url}" class="nav-item ${active?'active':''}" ${active?'aria-current="page"':''}>${icon(i)}<span>${label}</span>${count?`<span class="count">${count}</span>`:''}</a>`;
function route(){return decodeURIComponent(location.hash.slice(1))||'summary'}
function moduleName(){const r=route();return r.startsWith('hr')?'hr':r.startsWith('chat')?'chat':r.startsWith('reports')?'reports':r.startsWith('my-tasks')?'my-tasks':'projects'}
function rail(){const m=moduleName();return `<aside class="rail" aria-label="التنقل العام"><a class="mark" href="#projects" aria-label="نسق"><b>ن</b><span>نَسَق</span></a><button id="rail-toggle" class="rail-toggle" aria-label="${railExpanded?'طي':'توسيع'} القائمة الأساسية" aria-expanded="${railExpanded}" onclick="railExpanded=!railExpanded;render()">${icon('panel')}<span>طي القائمة</span></button>${[['projects','projects','المشاريع'],['my-tasks','tasks','مهامي'],['reports','reports','التقارير'],['hr','users','الموارد البشرية'],['chat','chat','المحادثة']].map(([r,i,t])=>`<a href="#${r}" class="rail-link ${m===r?'active':''}" aria-label="${t}" ${m===r?'aria-current="page"':''}>${icon(i)}<span>${t}</span></a>`).join('')}<div class="rail-spacer"></div><button class="rail-link" onclick="showHelp()" aria-label="عن النموذج">${icon('help')}<span>عن النموذج</span></button><div class="rail-user"><span class="avatar user-avatar" title="طارق — معاينة توضيحية">ط</span><span class="rail-user-name">طارق<span>جهة العمل</span></span></div></aside>`}
function moduleSidebar(r){const m=moduleName(),settings={projects:['إدارة المشاريع','projects',[['projects','جميع المشاريع','projects'],['templates','قوالب المشاريع','file']]],'my-tasks':['مساحة مهامي','tasks',[['my-tasks','كل مهامي','tasks'],['my-tasks/overdue','المهام المتأخرة','clock'],['my-tasks/done','المهام المنجزة','check']]],reports:['تقارير المشاريع','reports',[['reports','نظرة شاملة','summary'],['reports/finance','التقرير المالي','finance'],['reports/tasks','تقرير المهام','tasks']]],hr:['الموارد البشرية','users',[['hr','الموظفون','users'],['hr/departments','الأقسام','projects'],['hr/documents','المستندات','file']]],chat:['المحادثة','chat',[['chat','المحادثات','chat'],['chat/project','فريق البوابة الرقمية','users']]]}[m];return `<aside class="project-nav" id="project-nav" aria-label="القائمة السياقية"><div class="module-heading"><div class="project-emblem">${icon(settings[1])}</div><h2>${settings[0]}</h2><p>جهة العمل</p></div><p class="nav-label">${settings[0]}</p><nav class="nav-links">${settings[2].map(([url,l,i])=>navItem(url,l,i,r===url)).join('')}</nav>${m==='projects'?'<div class="recent-project"><p class="nav-label">آخر مشروع</p>'+navItem('summary','بوابة الخدمات الرقمية','projects',false)+'</div>':''}<div class="nav-bottom"><div class="prototype-note"><i></i>نموذج أولي · بيانات توضيحية</div></div></aside>`}
function inProject(){return moduleName()==='projects'&&!['projects','templates'].includes(route())}

function sidebar(r){const parties=r==='stakeholders'||r==='raci';return `<aside class="project-nav" id="project-nav" aria-label="قائمة المشروع"><a class="back-all" href="#projects">${icon('arrow')}جميع المشاريع</a><div class="project-identity"><div class="project-emblem">${icon('projects')}</div><h2>تطوير بوابة<br>الخدمات الرقمية</h2><div class="identity-foot"><span class="mono" dir="ltr">PRJ-024</span>${badge('قيد التنفيذ','blue')}</div></div><p class="nav-label">مساحة المشروع</p><nav class="nav-links">${navItem('summary','الملخص','summary',r==='summary'||r==='updates')}${navItem('tasks/'+taskView,'المهام والخطة','tasks',r.startsWith('tasks')||r.startsWith('task/'),tasks.length)}<button class="nav-item ${parties?'parent-open':''}" onclick="location.hash='stakeholders'" aria-expanded="${parties}">${icon('users')}<span>الأطراف والمسؤوليات</span>${icon(parties?'down':'chevron').replace('<svg','<svg class="chevron"')}</button>${parties?`<div class="sub-nav"><a class="sub-item ${r==='stakeholders'?'active':''}" href="#stakeholders">أصحاب المصلحة</a><a class="sub-item ${r==='raci'?'active':''}" href="#raci">مصفوفة المسؤوليات</a></div>`:''}${navItem('risks','المخاطر والمشكلات','risk',r==='risks','2')}${navItem('finance','المالية','finance',r==='finance')}${navItem('charter','ملف المشروع','file',r==='charter')}</nav><div class="nav-bottom">${navItem('settings','إعدادات المشروع','settings',r==='settings')}<div class="prototype-note"><i></i>نموذج أولي · بيانات توضيحية</div></div></aside>`}
function head(title,desc,actions=''){return `<header class="page-head"><div><p class="eyebrow">${inProject()?'تطوير بوابة الخدمات الرقمية':{projects:'إدارة المشاريع','my-tasks':'مساحة العمل الشخصية',reports:'متابعة الأداء',hr:'الموارد البشرية',chat:'التواصل الداخلي'}[moduleName()]}</p><h1>${title}</h1><p>${desc}</p></div><div class="page-actions">${actions}</div></header>`}
function btn(link,text,i='plus',primary=false){return `<a class="btn ${primary?'primary':''}" href="#${link}">${icon(i)}${text}</a>`}
function strip(){return `<div class="project-strip">${badge('يحتاج انتباه','amber')}<span>${icon('users')}مديرة المشروع: سارة العتيبي</span><span>${icon('calendar')}01 أغسطس — 30 سبتمبر 2026</span><span class="team">${people.map(p=>`<span class="avatar ${p[2]}">${p[1]}</span>`).join('')}<span class="team-label">فريق المشروع</span></span></div>`}
function metrics(finance=false){const done=tasks.filter(t=>t.status==='done').length,pct=Math.round(done/tasks.length*100);return `<div class="metrics">${(finance?[['تقدير الميثاق','120,000','ر.س','التقدير الأولي للمشروع','file'],['الميزانية التفصيلية','100,000','ر.س','إجمالي بنود الميزانية','finance'],['المصروف الفعلي','42,000','ر.س','42% من الميزانية','reports'],['المتبقي','58,000','ر.س','ضمن الميزانية المحددة','finance']]:[['إنجاز المهام',pct+'%','',`${done} من ${tasks.length} مهام منجزة`,'tasks'],['المهام المتأخرة','2','مهمة','تحتاج متابعة اليوم','clock'],['المعلم القادم','09','سبتمبر','اعتماد التصميم','milestone'],['المصروف من الميزانية','42%','','42,000 من 100,000 ر.س','finance']]).map(([label,val,unit,foot,i])=>`<div class="metric"><div class="metric-title">${icon(i)}${label}</div><div class="metric-value"><bdi>${val}</bdi> <small>${unit}</small></div><div class="metric-foot">${foot}</div></div>`).join('')}</div>`}
function summary(){return head('ملخص المشروع','الصورة الكاملة للمشروع، وما يحتاج إلى متابعة اليوم.',btn('updates','تحديثات المشروع','clock')+btn('new-update','إضافة تحديث','plus',true))+strip()+metrics()+`<div class="dashboard-grid"><div class="stack"><section class="panel"><div class="panel-head"><h2>${icon('risk')}يحتاج انتباهك <span class="badge amber">3</span></h2><a href="#tasks/table">عرض المهام ${'←'}</a></div>${tasks.filter(t=>t.late).map(t=>`<a class="row" href="#task/${t.id}"><div class="warning-icon ${t.id===2?'red':''}">${icon(t.id===2?'clock':'tasks')}</div><div class="row-main"><span class="row-title">${t.name}</span><div class="row-meta"><span>${people[t.person][0]}</span><span>الموعد: ${t.date}</span></div></div>${badge(t.status==='review'?'بانتظار المراجعة':'متأخرة','amber')}</a>`).join('')}<a class="row" href="#risks"><div class="warning-icon">${icon('risk')}</div><div class="row-main"><span class="row-title">احتمال تأخر موافقة مزوّد التكامل</span><div class="row-meta"><span>خطر مرتبط بخدمة التحقق من الهوية</span></div></div>${badge('مرتفع','red')}</a></section><section class="panel"><div class="panel-head"><h2>آخر تحديث للمشروع</h2><a href="#updates">جميع التحديثات ←</a></div><div class="update-body"><div class="update-author"><span class="avatar purple">س ع</span><span>سارة العتيبي <span class="muted">· مديرة المشروع</span></span><time>اليوم، 09:30</time></div><h3>التصميم جاهز للاعتماد، والتكامل يحتاج متابعة</h3><p>اكتملت الهوية البصرية ومراجعة رحلة المستفيد. ننتظر اعتماد تجربة المستخدم، ونتابع مع مزوّد الخدمة لتأكيد موعد الربط قبل الإطلاق التجريبي.</p></div></section></div><div class="stack"><section class="panel"><div class="panel-head"><h2>محطات التسليم</h2><a href="#tasks/milestones">عرض المعالم ←</a></div><div class="milestone-list">${milestones.map(m=>`<div class="milestone-row ${m[2]}"><span class="row-title">${m[0]}</span><span class="small muted" style="font-size:10px">${m[1]}</span><time class="due">${m[3]}</time></div>`).join('')}</div></section><div class="scope-note">${icon('file')}<div>بوابة موحّدة لتقديم الخدمات ومتابعة الطلبات إلكترونيًا.<br><a href="#charter" class="text-link">عرض النطاق وأهداف المشروع ←</a></div></div></div></div>`}
function toolbar(view){return `<div class="work-toolbar"><nav class="view-switch" aria-label="طريقة عرض خطة العمل">${[['table','قائمة','list'],['board','لوحة','board'],['gantt','جدول زمني','gantt'],['milestones','معالم','milestone']].map(([v,l,i])=>`<a href="#tasks/${v}" class="${v===view?'active':''}" ${v===view?'aria-current="page"':''}>${icon(i)}${l}</a>`).join('')}</nav>${view==='milestones'?'':`<div class="tools"><div class="search">${icon('search')}<input id="task-search" aria-label="ابحث في المهام" placeholder="ابحث في المهام…" value="${safe(search)}"></div><select id="task-filter" aria-label="تصفية المهام"><option value="all">كل الحالات</option>${Object.entries(status).map(([k,v])=>`<option value="${k}" ${filter===k?'selected':''}>${v[0]}</option>`).join('')}</select></div>`}</div>`}
function filtered(){return tasks.filter(t=>t.name.includes(search)&&(filter==='all'||filter===t.status))}
function taskTable(rows=filtered()){return `<section class="panel"><div class="table-scroll"><table><thead><tr><th style="width:38%">المهمة</th><th>المكلّف</th><th>الحالة</th><th>الموعد</th><th>المعلم</th></tr></thead><tbody>${rows.map(t=>`<tr><td><a href="#task/${t.id}" class="task-name">${icon(t.status==='done'?'check':'circle').replace('<svg',`<svg class="${t.status==='done'?'done-check':''}"`)}${safe(t.name)}</a></td><td>${person(t.person)}</td><td>${badge(...status[t.status])}</td><td class="date ${t.late?'overdue':''}">${t.date}${t.late?' · متأخرة':''}</td><td class="small muted" style="font-size:10px">${t.milestone}</td></tr>`).join('')}</tbody></table></div>${!rows.length?'<div class="empty">لا توجد مهام تطابق البحث. جرّب عبارة أخرى أو غيّر الحالة.</div>':''}<div class="table-footer"><span>${rows.length} مهام معروضة</span><span>القائمة واللوحة والجدول الزمني تعرض نفس المهام</span></div></section>`}
function board(){const rows=filtered();return `<div class="board">${Object.entries(status).map(([k,v])=>`<section class="board-col"><div class="board-head">${badge(...v)}<span>${rows.filter(t=>t.status===k).length}</span></div>${rows.filter(t=>t.status===k).map(t=>`<a class="task-card" href="#task/${t.id}"><span class="small muted" style="font-size:10px">${t.milestone}</span><p>${safe(t.name)}</p><footer><span class="date ${t.late?'overdue':''}">${t.date}</span><span class="avatar ${people[t.person][2]}" style="width:24px;height:24px;font-size:9px">${people[t.person][1]}</span></footer></a>`).join('')||'<div class="empty" style="padding:20px 5px">لا مهام في هذه الحالة</div>'}</section>`).join('')}</div>`}
function gantt(){return `<div class="panel table-scroll"><div class="gantt"><div class="gantt-row gantt-heading"><div class="gantt-label">المهمة</div><div class="gantt-dates">${['24 أغسطس','31 أغسطس','07 سبتمبر','14 سبتمبر','21 سبتمبر','28 سبتمبر'].map(d=>`<span>${d}</span>`).join('')}</div></div>${filtered().map(t=>`<div class="gantt-row"><a class="gantt-label" href="#task/${t.id}">${safe(t.name)}</a><div class="gantt-track"><a class="gantt-bar ${t.status==='done'?'green':t.late?'amber':''}" href="#task/${t.id}" aria-label="تفاصيل ${safe(t.name)}" style="left:${t.start}%;width:${t.width}%"></a></div></div>`).join('')}</div><div class="gantt-note"><span><i class="circle-key"></i>مخطط</span><span><i class="circle-key" style="background:#90c3ae"></i>منجز</span><span><i class="circle-key" style="background:#e5bd7e"></i>يحتاج متابعة</span><span>اضغط اسم المهمة لفتح تفاصيلها</span></div></div>`}
function milestoneView(){return `<section class="panel"><div class="panel-head"><h2>المعالم الرئيسية</h2><span class="small muted">معلم واحد من 4 تم تسليمه</span></div>${milestones.map((m,i)=>`<div class="row"><div class="project-emblem" style="margin:0;color:${i===0?'#569777':'#7c91b4'}">${icon(i===0?'check':'milestone')}</div><div class="row-main"><span class="row-title">${m[0]}</span><span class="row-meta">${m[1]}</span></div><span class="date">${m[3]}</span>${badge(i===0?'تم التسليم':i===1?'التسليم القادم':'مخطط',i===0?'green':i===1?'blue':'')}</div>`).join('')}<div class="legend">إنجاز المهام يختلف عن اعتماد تسليم المعلم. يبقى قرار التسليم واضحًا ومستقلًا.</div></section>`}
function work(view){taskView=view;return head('المهام والخطة','تنفيذ واحد، وطرق عرض تناسب طريقة عملك.',btn('new-task','مهمة جديدة','plus',true))+toolbar(view)+`<div id="task-results">${view==='board'?board():view==='gantt'?gantt():view==='milestones'?milestoneView():taskTable()}</div>`}
function stakeholders(){return head('أصحاب المصلحة','الأطراف المشاركة في المشروع وأدوارها.',btn('raci','مصفوفة المسؤوليات','users'))+`<section class="panel"><table><thead><tr><th>الاسم</th><th>الدور في المشروع</th><th>الجهة</th><th>نوع المشاركة</th></tr></thead><tbody>${people.map((p,i)=>`<tr><td>${person(i)}</td><td>${['مديرة المشروع','مسؤول التطوير','مسؤولة الجودة','مسؤول تجربة المستفيد'][i]}</td><td>إدارة التحول الرقمي</td><td>${badge('داخلي')}</td></tr>`).join('')}<tr><td>خالد الشمري</td><td>ممثل مزوّد التكامل</td><td>شريك تقني</td><td>${badge('خارجي','blue')}</td></tr></tbody></table><div class="legend">تسجيل صاحب المصلحة لا يمنحه صلاحيات أو يكلّفه بمهام. توزيع الأدوار يظهر في مصفوفة المسؤوليات.</div></section>`}
function raci(){return head('مصفوفة المسؤوليات','من ينفّذ، ومن يُساءل، ومن يُستشار أو يُطّلع؟',btn('stakeholders','أصحاب المصلحة','users'))+`<section class="panel table-scroll"><table><thead><tr><th>المهمة</th>${people.map(p=>`<th>${p[0]}</th>`).join('')}</tr></thead><tbody>${tasks.slice(0,5).map((t,i)=>`<tr><td><a href="#task/${t.id}" class="task-name">${t.name}</a></td>${people.map((p,j)=>`<td class="raci"><span class="badge ${j===0?'blue':j===t.person?'green':''}">${j===0?(t.person===0?'A/R':'A'):j===t.person?'R':(i+j)%2?'C':'I'}</span></td>`).join('')}</tr>`).join('')}</tbody></table><div class="legend"><bdi>R</bdi> مسؤول التنفيذ &nbsp; · &nbsp; <bdi>A</bdi> صاحب المساءلة &nbsp; · &nbsp; <bdi>C</bdi> مستشار &nbsp; · &nbsp; <bdi>I</bdi> مطّلع<br>هذه أدوار حوكمة؛ التكليف الفعلي واعتماد الإنجاز يظهران داخل المهمة.</div></section>`}
function risks(){return head('المخاطر والمشكلات','متابعة ما قد يعطّل المشروع وربطه بخطة المعالجة.')+`<section class="panel"><div class="panel-head"><h2>سجل المشروع</h2><span class="small muted">خطر واحد · مشكلة واحدة</span></div><div class="row"><div class="warning-icon">${icon('risk')}</div><div class="row-main"><span class="row-title">احتمال تأخر موافقة مزوّد التكامل</span><div class="row-meta">المسؤول: محمد القحطاني · المتابعة: 08 سبتمبر</div><p class="small muted">المعالجة: تأكيد موعد الربط وتجهيز بيئة بديلة للاختبار.</p><a class="text-link" href="#task/2">المهمة المرتبطة: ربط خدمة التحقق من الهوية ←</a></div>${badge('خطر مرتفع','red')}</div><div class="row"><div class="warning-icon red">${icon('clock')}</div><div class="row-main"><span class="row-title">تأخر اعتماد تجربة المستخدم</span><div class="row-meta">المسؤولة: سارة العتيبي · المتابعة: اليوم</div><p class="small muted">المعالجة: جلسة مراجعة مركّزة لإغلاق الملاحظات المتبقية.</p><a class="text-link" href="#task/1">المهمة المرتبطة: اعتماد تجربة المستخدم ←</a></div>${badge('قيد المعالجة','amber')}</div></section>`}
function finance(){return head('مالية المشروع','التقدير الأولي والميزانية التفصيلية والمصروف الفعلي.')+metrics(true)+`<section class="panel"><div class="panel-head"><h2>الميزانية والمصروفات</h2><span class="small muted">الريال السعودي</span></div><table><thead><tr><th>البند</th><th>نوع القيد</th><th>المبلغ</th><th>التاريخ</th></tr></thead><tbody>${[['التصميم والتطوير','ميزانية','80,000','01 أغسطس'],['اختبارات الجودة والتدريب','ميزانية','20,000','01 أغسطس'],['أعمال التصميم والمرحلة الأولى','مصروف','32,000','25 أغسطس'],['تجهيز بيئة الاختبار','مصروف','10,000','01 سبتمبر']].map(r=>`<tr><td>${r[0]}</td><td>${badge(r[1],r[1]==='مصروف'?'blue':'')}</td><td><bdi>${r[2]}</bdi> <span class="muted small">ر.س</span></td><td class="date">${r[3]}</td></tr>`).join('')}</tbody></table><div class="legend">تقدير الميثاق 120,000 ر.س. الميزانية التفصيلية 100,000 ر.س؛ المتبقي يُحسب من الميزانية التفصيلية.</div></section>`}
function charter(){return head('ملف المشروع','المرجع الأساسي للهدف والنطاق والمخرجات.')+`<section class="panel article"><h2>ميثاق مشروع تطوير بوابة الخدمات الرقمية</h2><p>توحيد تجربة المستفيد في تقديم الطلبات ومتابعتها، وتقليل الاعتماد على الإجراءات اليدوية بين الإدارات.</p><div class="definition-grid"><div><label>الجهة المالكة</label><p>إدارة التحول الرقمي</p></div><div><label>مديرة المشروع</label><p>سارة العتيبي</p></div><div><label>الفترة المخططة</label><p>01 أغسطس — 30 سبتمبر 2026</p></div><div><label>التقدير الأولي</label><p>120,000 ريال سعودي</p></div></div><h3>الأهداف</h3><ul><li>إتاحة تقديم الخدمات ومتابعة حالتها من مكان واحد.</li><li>تقليل زمن معالجة الطلبات بنسبة مستهدفة 30% بعد التشغيل.</li></ul><h3>المخرجات المتفق عليها</h3><ul><li>بوابة خدمات رقمية متكاملة مع التحقق من الهوية.</li><li>لوحة لمتابعة الطلبات ودليل استخدام للفريق.</li></ul><h3>خارج نطاق المشروع</h3><p>تطوير تطبيق جوال مستقل أو إعادة بناء الأنظمة الخلفية القائمة.</p><a class="text-link" href="#tasks/milestones">استعراض معالم التسليم ←</a></section>`}
function updates(){return head('تحديثات المشروع','سجل المتابعة الذي تشاركه مديرة المشروع مع الفريق.',btn('new-update','إضافة تحديث','plus',true))+`<section class="panel"><div class="update-body"><div class="update-author">${person(0)}<time>07 سبتمبر 2026</time>${badge('يحتاج انتباه','amber')}</div><h3>التصميم جاهز للاعتماد، والتكامل يحتاج متابعة</h3><p>اكتملت الهوية البصرية ومراجعة رحلة المستفيد. ننتظر اعتماد تجربة المستخدم، ونتابع مع مزوّد الخدمة لتأكيد موعد الربط.</p></div><div class="update-body" style="border-top:1px solid var(--line)"><div class="update-author">${person(0)}<time>27 أغسطس 2026</time>${badge('على المسار','green')}</div><h3>اعتماد النطاق والمتطلبات</h3><p>اتفق الفريق على نطاق الخدمات ومخرجات المرحلة الأولى، وأُغلق معلم تحديد النطاق.</p></div></section>`}
function taskDetail(id){const t=tasks.find(t=>t.id===Number(id));if(!t)return head('المهمة غير موجودة','')+btn('tasks/table','العودة إلى المهام','arrow');return head(t.name,'تطوير بوابة الخدمات الرقمية',btn('tasks/'+taskView,'العودة إلى المهام','arrow'))+`<div class="dashboard-grid"><section class="panel article"><div style="display:flex;gap:8px;margin-bottom:25px">${badge(...status[t.status])}${t.late?badge('متأخرة','red'):''}</div><div class="definition-grid"><div><label>المكلّف</label>${person(t.person)}</div><div><label>الموعد</label><p>${t.date} 2026</p></div><div><label>الأولوية</label><p>${t.priority}</p></div><div><label>المعلم المرتبط</label><a href="#tasks/milestones" class="text-link">${t.milestone} ←</a></div></div><h3>الوصف</h3><p>${safe(t.description||'تنفيذ العمل المتفق عليه، ومراجعة المخرجات مع الفريق قبل التسليم. توثيق الملاحظات وإغلاقها ضمن الموعد المحدد.')}</p><h3>المعلومات المرتبطة</h3><p><a href="#raci" class="text-link">عرض المسؤوليات ←</a></p>${t.late?'<a href="#risks" class="text-link">عرض المخاطر والمشكلات المرتبطة ←</a>':''}</section><section class="panel"><div class="panel-head"><h2>نشاط المهمة</h2></div><div class="update-body"><div class="update-author">${person(t.person)}</div><p>تمت مراجعة المتطلبات وتحديث خطة التنفيذ.</p><p class="muted small">آخر تحديث: 06 سبتمبر</p></div></section></div>`}
function settings(){return head('إعدادات المشروع','خيارات التشغيل والرؤية والاعتماد.')+`<section class="panel article"><div class="notice">هذه معاينة للإعدادات. تغيير بيانات التطبيق الفعلية غير متاح في النموذج.</div><div class="definition-grid"><div><label>رؤية المشروع</label><p>فريق المشروع</p></div><div><label>اعتماد إكمال المهام</label><p>مديرة المشروع</p></div><div><label>اعتماديات المهام</label><p>مفعّلة</p></div><div><label>المتابعون</label><p>4 أعضاء</p></div></div><h3>مراحل سير العمل</h3><p>لم تبدأ ← قيد التنفيذ ← للمراجعة ← منجزة</p><a href="#charter" class="text-link">الاسم والوصف والمدير والتواريخ في ملف المشروع ←</a></section>`}
function newForm(kind){return head(kind==='task'?'مهمة جديدة':'تحديث جديد','جرّب النموذج ببيانات توضيحية فقط.',btn(kind==='task'?'tasks/'+taskView:'updates','رجوع','arrow'))+`<section class="panel article form"><div class="notice">الإضافة هنا للتجربة داخل هذه المعاينة فقط، وتختفي عند إعادة تحميل الصفحة.</div><form id="demo-form" data-kind="${kind}"><label for="title">العنوان</label><input id="title" name="title" required placeholder="${kind==='task'?'اسم واضح للمهمة':'عنوان التحديث'}"><label for="description">الوصف</label><textarea id="description" name="description" placeholder="التفاصيل…"></textarea>${kind==='task'?`<label for="assignee">المكلّف</label><select id="assignee" name="assignee">${people.map((p,i)=>`<option value="${i}">${p[0]}</option>`).join('')}</select>`:''}<div class="form-footer"><button class="btn primary" type="submit">${kind==='task'?'إضافة المهمة التجريبية':'معاينة التحديث'}</button></div></form></section>`}
function projects(){return head('المشاريع','اختر مشروعًا للدخول إلى مساحة العمل الخاصة به.')+`<div class="projects-grid"><a class="panel project-card" href="#summary"><span class="mono">PRJ-024</span><h2>تطوير بوابة الخدمات الرقمية</h2><p>مديرة المشروع: سارة العتيبي</p>${badge('يحتاج انتباه','amber')}<div class="budget-bar"><span style="width:38%"></span></div><div class="budget-labels"><span>3 من 8 مهام منجزة</span><span>دخول المشروع ←</span></div></a></div><div class="notice" style="margin-top:20px">هذا المشروع التوضيحي يتيح تجربة التنقل بين جميع الأقسام، وطي القائمة، وتغيير طرق عرض المهام.</div>`}
function reports(){return head('تقارير المشاريع','مؤشرات المشاريع في مكان واحد.')+`<section class="panel"><table><thead><tr><th>المشروع</th><th>الحالة</th><th>الإنجاز</th><th>المتأخر</th><th>المصروف</th></tr></thead><tbody><tr><td><a class="text-link" href="#summary">تطوير بوابة الخدمات الرقمية ←</a></td><td>${badge('يحتاج انتباه','amber')}</td><td>38%</td><td><a href="#tasks/table" class="text-link">مهمتان</a></td><td><a href="#finance" class="text-link">42,000 ر.س</a></td></tr></tbody></table></section>`}
function extraTitle(r){return {'hr':'الموظفون','hr/departments':'الأقسام','hr/documents':'المستندات','templates':'قوالب المشاريع','my-tasks/overdue':'مهامي المتأخرة','my-tasks/done':'مهامي المنجزة','reports/finance':'التقرير المالي','reports/tasks':'تقرير المهام','chat/project':'فريق البوابة الرقمية'}[r]||''}
function extraBody(r){if(r==='hr')return head('الموظفون','دليل الموظفين وبيانات العمل — معاينة توضيحية.')+`<section class="panel"><table><thead><tr><th>الموظف</th><th>القسم</th><th>المسمّى الوظيفي</th><th>الحالة</th></tr></thead><tbody>${people.map((p,i)=>`<tr><td>${person(i)}</td><td>${['مكتب إدارة المشاريع','التطوير التقني','ضمان الجودة','تجربة المستفيد'][i]}</td><td>${['مديرة مشاريع','مطور أنظمة','أخصائية جودة','أخصائي تجربة مستخدم'][i]}</td><td>${badge('نشط','green')}</td></tr>`).join('')}</tbody></table></section>`;if(r==='hr/departments')return head('الأقسام','الهيكل التنظيمي — معاينة توضيحية.')+`<section class="panel">${['مكتب إدارة المشاريع','التطوير التقني','ضمان الجودة','تجربة المستفيد'].map((x,i)=>`<div class="row">${icon('projects')}<span class="row-main">${x}</span><span class="muted small">${people[i][0]}</span></div>`).join('')}</section>`;if(r==='hr/documents')return head('المستندات','مستندات الموظفين وسياسات العمل.')+'<section class="panel"><div class="empty">معاينة لقسم المستندات. لم تُستخدم أي ملفات موظفين حقيقية في النموذج.</div></section>';if(r==='templates')return head('قوالب المشاريع','قوالب البداية المتكررة — معاينة توضيحية.')+'<section class="panel article"><h2>مشروع تطوير خدمة رقمية</h2><p>تحديد النطاق، التصميم، التطوير، الاختبار، ثم التسليم.</p><a class="text-link" href="#summary">استعرض مشروعًا بهذا التنظيم ←</a></section>';if(r==='my-tasks/overdue'||r==='my-tasks/done')return head(extraTitle(r),'نفس المهام مع تصفية حسب الحالة.')+taskTable(tasks.filter(t=>t.person===0&&(r.endsWith('done')?t.status==='done':t.late)));if(r==='reports/finance')return head('التقرير المالي','ملخص الميزانية والمصروفات عبر المشاريع.')+metrics(true);if(r==='reports/tasks')return head('تقرير المهام','متابعة مهام المشروع وحالتها.')+taskTable();if(r==='chat/project')return head('فريق البوابة الرقمية','محادثة توضيحية للفريق.')+'<section class="panel article"><div class="update-author">'+person(0)+'</div><p>أضفت آخر مستجدات التصميم والتكامل في تحديث المشروع، لتبقى المتابعة مرتبطة بخطة التنفيذ.</p><a href="#updates" class="text-link">فتح تحديثات المشروع ←</a></section>';return ''}

function render(){const r=route(),workRoute=r.startsWith('tasks/'),view=workRoute?r.split('/')[1]:'table';let title=extraTitle(r)|| (r==='summary'?'الملخص':workRoute?'المهام والخطة':r==='stakeholders'?'أصحاب المصلحة':r==='raci'?'مصفوفة المسؤوليات':r==='risks'?'المخاطر والمشكلات':r==='finance'?'المالية':r==='charter'?'ملف المشروع':r==='settings'?'إعدادات المشروع':r==='updates'?'تحديثات المشروع':r==='projects'?'جميع المشاريع':r==='reports'?'التقارير':r==='my-tasks'?'مهامي':r==='chat'?'المحادثة':'تفاصيل المشروع');let body=extraBody(r)|| (r==='summary'?summary():workRoute?work(view):r==='stakeholders'?stakeholders():r==='raci'?raci():r==='risks'?risks():r==='finance'?finance():r==='charter'?charter():r==='updates'?updates():r.startsWith('task/')?taskDetail(r.split('/')[1]):r==='settings'?settings():r==='new-task'?newForm('task'):r==='new-update'?newForm('update'):r==='projects'?projects():r==='reports'?reports():r==='my-tasks'?head('مهامي','المهام المسندة إليك عبر المشاريع — عرض توضيحي.')+taskTable(tasks.filter(t=>t.person===0)):r==='chat'?head('المحادثة','التنقل العام يبقى متاحًا من شريط الأيقونات.')+'<section class="panel article"><h2>محادثات الفريق</h2><p>مساحة مخصصة للمحادثات العامة. تحديثات المشروع ونشاط المهام تبقى في سياقها داخل المشروع.</p><a href="#summary" class="text-link">العودة إلى المشروع ←</a></section>':summary());document.getElementById('app').className=[collapsed?'collapsed':'',railExpanded?'rail-expanded':''].join(' ');document.getElementById('app').innerHTML=rail()+(inProject()?sidebar(r):moduleSidebar(r))+`<div class="workspace"><header class="topbar"><div class="crumbs"><button id="collapse" class="icon-button" aria-label="${collapsed?'إظهار':'طي'} القائمة السياقية" aria-expanded="${!collapsed}" aria-controls="project-nav">${icon('panel')}</button><a href="#${moduleName()}">${{projects:'المشاريع','my-tasks':'مهامي',reports:'التقارير',hr:'الموارد البشرية',chat:'المحادثة'}[moduleName()]}</a><span class="sep">/</span>${inProject()?'<a class="project-crumb" href="#summary">بوابة الخدمات الرقمية</a><span class="sep project-crumb">/</span>':''}<b>${title}</b></div><div class="top-left"><span class="demo-badge">معاينة قبل التنفيذ</span><span class="small muted" style="font-size:11px">07 سبتمبر 2026</span></div></header><main class="content">${body}<div class="footer-note">نموذج تنقّل مقترح لنسق · بيانات توضيحية</div></main></div>`;document.getElementById('collapse').onclick=()=>{collapsed=!collapsed;render()};const input=document.getElementById('task-search');if(input)input.oninput=e=>{search=e.target.value;updateResults(view)};const sel=document.getElementById('task-filter');if(sel)sel.onchange=e=>{filter=e.target.value;updateResults(view)};const form=document.getElementById('demo-form');if(form)form.onsubmit=e=>{e.preventDefault();const data=new FormData(form);if(form.dataset.kind==='task'){tasks.unshift({id:tasks.length+1,name:data.get('title'),description:data.get('description'),person:Number(data.get('assignee')),status:'todo',date:'بلا موعد',priority:'عادية',milestone:'غير محدد',start:25,width:12});search='';filter='all';location.hash='tasks/table';toast('أُضيفت المهمة داخل النموذج التجريبي فقط')}else{document.querySelector('main').innerHTML=head('معاينة التحديث','لم يتم نشره إلى التطبيق الفعلي.',btn('updates','العودة للتحديثات','arrow'))+`<section class="panel article"><h2>${safe(data.get('title'))}</h2><p>${safe(data.get('description'))}</p></section>`}};document.title='نسق — '+title+' (نموذج أولي)'}
function updateResults(view){document.getElementById('task-results').innerHTML=view==='board'?board():view==='gantt'?gantt():taskTable()}
function toast(text){document.querySelector('.toast')?.remove();const n=document.createElement('div');n.className='toast';n.setAttribute('role','status');n.textContent=text;document.body.append(n);setTimeout(()=>n.remove(),4000)}
function showHelp(){toast('جرّب الأقسام، طرق عرض المهام، البحث وطي قائمة المشروع. البيانات توضيحية فقط.')}
addEventListener('hashchange',()=>{render();window.scrollTo(0,0)});render();
</script></body></html>
