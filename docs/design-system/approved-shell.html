<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="نموذج تصميم تفاعلي لقشرة نَسَق الداخلية">
  <title>نَسَق — القشرة الداخلية</title>
  <style>
    @font-face{font-family:"IBM Plex Sans Arabic";font-weight:400;font-display:swap;src:url("assets/fonts/IBMPlexSansArabic-Regular.woff2") format("woff2")}
    @font-face{font-family:"IBM Plex Sans Arabic";font-weight:500;font-display:swap;src:url("assets/fonts/IBMPlexSansArabic-Medium.woff2") format("woff2")}
    @font-face{font-family:"IBM Plex Sans Arabic";font-weight:600;font-display:swap;src:url("assets/fonts/IBMPlexSansArabic-SemiBold.woff2") format("woff2")}
    @font-face{font-family:"IBM Plex Sans Arabic";font-weight:700;font-display:swap;src:url("assets/fonts/IBMPlexSansArabic-Bold.woff2") format("woff2")}

    :root{
      --primary:#18181b;
      --primary-strong:#09090b;
      --primary-contrast:#ffffff;
      --page:#fafafa;
      --surface:#ffffff;
      --surface-subtle:#f4f4f5;
      --sidebar:#f1f1f3;
      --line:#e4e4e7;
      --line-strong:#d4d4d8;
      --text:#18181b;
      --muted:#71717a;
      --muted-light:#a1a1aa;
      --success:#15803d;
      --success-bg:#f0fdf4;
      --warning:#a16207;
      --warning-bg:#fefce8;
      --danger:#b91c1c;
      --danger-bg:#fef2f2;
      --info:#1d4ed8;
      --info-bg:#eff6ff;
      --radius:8px;
      --shadow:0 8px 24px rgba(24,24,27,.06);
      --font:"IBM Plex Sans Arabic",system-ui,-apple-system,"Segoe UI",sans-serif;
    }
    *{box-sizing:border-box}
    html,body{margin:0;min-height:100%;background:var(--page);color:var(--text);font-family:var(--font);font-size:15px;line-height:1.6}
    body{overflow-x:hidden}
    button,input,select,textarea{font:inherit}
    button,a{ -webkit-tap-highlight-color:transparent }
    button{cursor:pointer}
    a{color:inherit;text-decoration:none}
    :focus-visible{outline:3px solid rgba(24,24,27,.24);outline-offset:2px}
    [hidden]{display:none!important}
    .app-shell{min-height:100vh;display:flex;direction:rtl}

    .sidebar{width:232px;flex:none;background:var(--sidebar);border-left:1px solid var(--line);display:flex;flex-direction:column;min-height:100vh;transition:width .2s ease,transform .2s ease;z-index:20}
    .sidebar.collapsed{width:72px}
    .sidebar.collapsed .brand-copy,.sidebar.collapsed .nav-label,.sidebar.collapsed .group-label,.sidebar.collapsed .nav-chevron,.sidebar.collapsed .demo-note{display:none}
    .sidebar.collapsed .sidebar-brand,.sidebar.collapsed .nav-link{justify-content:center}
    .sidebar-head{height:72px;padding:16px;display:flex;align-items:center;justify-content:space-between;gap:10px;border-bottom:1px solid var(--line)}
    .sidebar-brand{display:flex;align-items:center;gap:10px;min-width:0}
    .brand-mark{width:34px;height:34px;border-radius:8px;background:var(--primary);color:var(--primary-contrast);display:grid;place-items:center;font-weight:700;font-size:17px;letter-spacing:-.04em;flex:none}
    .brand-copy{min-width:0;display:grid;line-height:1.25}
    .brand-name{font-size:17px;font-weight:700;white-space:nowrap}
    .brand-sub{font-size:11px;color:var(--muted);white-space:nowrap}
    .icon-button{width:36px;height:36px;display:grid;place-items:center;border:1px solid transparent;background:transparent;color:var(--muted);border-radius:var(--radius);flex:none}
    .icon-button:hover{background:var(--surface);border-color:var(--line);color:var(--text)}
    .icon{width:var(--icon-size);height:var(--icon-size);display:block;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
    .sidebar-nav{padding:20px 12px;flex:1;overflow:auto}
    .nav-group{margin-bottom:22px}
    .group-label{display:flex;align-items:center;justify-content:space-between;padding:0 10px 8px;color:var(--muted-light);font-size:11px;font-weight:600;letter-spacing:.02em}
    .group-label .nav-chevron{transform:rotate(0deg);transition:transform .2s ease}
    .nav-group.collapsed .group-links{display:none}
    .nav-group.collapsed .group-label .nav-chevron{transform:rotate(90deg)}
    .group-label[role="button"]{cursor:pointer}
    .group-label[role="button"]:hover{color:var(--text)}
    .group-links{display:grid;gap:3px}
    .nav-link{display:flex;align-items:center;gap:10px;width:100%;min-height:42px;padding:8px 10px;border:1px solid transparent;border-radius:var(--radius);color:#52525b;text-align:right;background:transparent;font-size:14px}
    .nav-link:hover{background:rgba(255,255,255,.68);color:var(--text)}
    .nav-link.active{background:var(--surface);border-color:var(--line);color:var(--text);font-weight:600;box-shadow:0 1px 2px rgba(24,24,27,.03)}
    .nav-link .icon{flex:none}
    .sidebar-foot{padding:12px;border-top:1px solid var(--line)}
    .demo-note{margin:0 4px 12px;color:var(--muted);font-size:11px}
    .account-card{display:flex;align-items:center;gap:10px;padding:9px 10px;border:1px solid var(--line);border-radius:var(--radius);background:rgba(255,255,255,.5)}
    .avatar{width:32px;height:32px;border-radius:50%;display:grid;place-items:center;background:#e4e4e7;color:var(--text);font-size:12px;font-weight:600;flex:none}
    .account-copy{display:grid;min-width:0;line-height:1.35}
    .account-name{font-size:13px;font-weight:600;white-space:nowrap}
    .account-role{font-size:11px;color:var(--muted);white-space:nowrap}

    .main-shell{min-width:0;flex:1;display:flex;flex-direction:column;min-height:100vh}
    .topbar{height:72px;flex:none;background:rgba(255,255,255,.93);border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;gap:20px;padding:0 clamp(18px,3vw,40px);position:sticky;top:0;z-index:15;backdrop-filter:blur(8px)}
    .topbar-title{min-width:0;display:flex;align-items:center;gap:12px}
    .mobile-menu{display:none}
    .breadcrumb{display:flex;align-items:center;gap:7px;color:var(--muted);font-size:12px;white-space:nowrap}
    .breadcrumb .current{color:var(--text);font-weight:600}
    .breadcrumb-separator{color:var(--muted-light)}
    .topbar-heading{font-size:16px;line-height:1.3;font-weight:600;white-space:nowrap;letter-spacing:0}
    .topbar-utils{display:flex;align-items:center;gap:8px;direction:ltr}
    .search-trigger{height:38px;min-width:190px;display:flex;align-items:center;justify-content:space-between;gap:12px;padding:0 11px;border:1px solid var(--line);background:var(--surface);border-radius:var(--radius);color:var(--muted);font-size:13px;direction:rtl}
    .search-trigger:hover{border-color:var(--line-strong);color:var(--text)}
    .search-trigger-copy{display:flex;align-items:center;gap:8px}
    .search-trigger-copy .search-icon{display:grid;place-items:center;flex:none}
    .shortcut{font-size:10px;color:var(--muted-light);border:1px solid var(--line);border-radius:4px;padding:0 5px;line-height:20px;direction:ltr}
    .notification-button{position:relative}
    .notification-dot{position:absolute;top:7px;right:7px;width:6px;height:6px;border-radius:50%;background:var(--primary);border:1px solid var(--surface)}
    .topbar-avatar{width:34px;height:34px;border-radius:50%;background:var(--primary);color:var(--primary-contrast);display:grid;place-items:center;font-size:12px;font-weight:600;border:0}
    .content{width:100%;max-width:1440px;margin:0 auto;padding:30px clamp(18px,3vw,48px) 56px}
    .page-stack{display:grid;gap:24px}
    .page-head{display:flex;align-items:flex-start;justify-content:space-between;gap:20px}
    .eyebrow{color:var(--muted);font-size:12px;margin:0 0 4px}
    h1,h2,h3,p{margin:0}
    h1{font-size:28px;line-height:1.3;letter-spacing:-.02em;font-weight:700}
    h2{font-size:19px;line-height:1.35;font-weight:600;letter-spacing:-.01em}
    h3{font-size:15px;line-height:1.45;font-weight:600}
    .page-description{color:var(--muted);font-size:13px;margin-top:6px;max-width:65ch}
    .page-actions{display:flex;align-items:center;gap:8px;flex-wrap:wrap;justify-content:flex-start}
    .compact-page-row{display:flex;align-items:center;justify-content:space-between;gap:16px;min-height:40px}
    .compact-detail-row{display:flex;align-items:flex-start;justify-content:space-between;gap:20px;padding-bottom:2px}
    .compact-detail-copy{display:flex;align-items:center;gap:10px;min-width:0;flex-wrap:wrap}
    .compact-detail-copy .page-description{margin-top:0}
    .detail-tabs-row{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;border-bottom:1px solid var(--line)}
    .detail-tabs-row .tabs{border-bottom:0;min-width:0;flex:1}
    .progress-inline{display:flex;align-items:center;gap:9px;min-width:170px;padding:0 0 11px;color:var(--muted);font-size:11px}
    .progress-inline strong{color:var(--text);direction:ltr}
    .progress-inline .progress-track{width:70px;height:5px;background:var(--surface-subtle);border-radius:999px;overflow:hidden}
    .progress-inline .progress-fill{display:block;height:100%;background:var(--primary);border-radius:999px}
    .inline-summary{display:flex;align-items:center;gap:12px;flex-wrap:wrap;color:var(--muted);font-size:12px;padding:0 2px}
    .inline-summary strong{color:var(--text);font-weight:600}
    .inline-summary .summary-separator{color:var(--line-strong)}
    .button{min-height:40px;display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:0 14px;border:1px solid transparent;border-radius:var(--radius);font-size:13px;font-weight:600;transition:background .15s ease,border-color .15s ease,transform .15s ease;color:var(--text);background:var(--surface)}
    .button:hover{border-color:var(--line-strong);background:var(--surface-subtle)}
    .button:active{transform:translateY(1px)}
    .button.primary{background:var(--primary);color:var(--primary-contrast);border-color:var(--primary)}
    .button.primary:hover{background:var(--primary-strong);border-color:var(--primary-strong)}
    .button.secondary{border-color:var(--line);background:var(--surface)}
    .button.danger{color:var(--danger);border-color:#fecaca;background:var(--surface)}
    .button.ghost{background:transparent;color:var(--muted);padding-inline:9px}
    .button.ghost:hover{color:var(--text);background:var(--surface-subtle)}
    .button.small{min-height:34px;padding-inline:11px;font-size:12px}
    .button .icon{flex:none}
    .card{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius)}
    .card-header{min-height:60px;padding:16px 18px;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;gap:12px}
    .card-body{padding:18px}
    .toolbar{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
    .toolbar-card{padding:12px;background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);display:flex;align-items:center;gap:8px;flex-wrap:wrap}
    .input-wrap{position:relative;flex:1;min-width:220px}
    .field-icon{position:absolute;right:11px;top:50%;transform:translateY(-50%);color:var(--muted);pointer-events:none;width:17px;height:17px}
    .input,.select,.textarea{width:100%;min-height:40px;border:1px solid var(--line-strong);border-radius:var(--radius);background:var(--surface);color:var(--text);padding:8px 11px;font-size:13px}
    .input,.textarea{appearance:none;-webkit-appearance:none}
    .input::placeholder,.textarea::placeholder{color:var(--muted-light)}
    .input:hover,.select:hover,.textarea:hover{border-color:var(--muted-light)}
    .input:focus,.select:focus,.textarea:focus{border-color:var(--muted);outline:1px solid transparent;outline-offset:0;box-shadow:none}
    .input:focus-visible,.select:focus-visible,.textarea:focus-visible{outline:1px solid var(--muted);outline-offset:-1px}
    .input.with-icon{padding-right:37px}
    .select{appearance:none;background-image:url("data:image/svg+xml,%3Csvg%20xmlns%3D%22http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%22%20width%3D%2218%22%20height%3D%2218%22%20viewBox%3D%220%200%2024%2024%22%20fill%3D%22none%22%20stroke%3D%22%2371717a%22%20stroke-width%3D%222%22%20stroke-linecap%3D%22round%22%20stroke-linejoin%3D%22round%22%20class%3D%22lucide%20lucide-chevron-down-icon%20lucide-chevron-down%20icon%22%20aria-hidden%3D%22true%22%20focusable%3D%22false%22%20data-icon-library%3D%22lucide%22%3E%3Cpath%20d%3D%22m6%209%206%206%206-6%22%3E%3C%2Fpath%3E%3C%2Fsvg%3E");background-position:left 10px center;background-size:18px 18px;background-repeat:no-repeat;padding-inline-end:36px}
    .select-wrap{position:relative;min-width:150px}
    .select-wrap .select{padding-inline-end:34px}
    .view-switch{display:inline-flex;padding:3px;border:1px solid var(--line);border-radius:var(--radius);background:var(--surface-subtle);gap:2px}
    .view-switch button{width:34px;height:32px;display:grid;place-items:center;border:0;border-radius:5px;background:transparent;color:var(--muted)}
    .view-switch button.active{background:var(--surface);color:var(--text);box-shadow:0 1px 2px rgba(24,24,27,.06)}
    .filter-summary{display:flex;align-items:center;gap:7px;flex-wrap:wrap;color:var(--muted);font-size:12px;margin-top:-12px}
    .chip{display:inline-flex;align-items:center;gap:6px;min-height:26px;padding:3px 9px;border-radius:999px;background:var(--surface-subtle);color:var(--muted);font-size:11px}
    .chip.success{background:var(--success-bg);color:var(--success)}
    .chip.warning{background:var(--warning-bg);color:var(--warning)}
    .chip.info{background:var(--info-bg);color:var(--info)}
    .chip.neutral{background:var(--surface-subtle);color:var(--muted)}
    .table-scroll{overflow-x:auto;border-radius:var(--radius)}
    table{width:100%;border-collapse:collapse;min-width:680px}
    th,td{padding:14px 16px;text-align:right;border-bottom:1px solid var(--line);vertical-align:middle}
    th{background:var(--surface-subtle);color:var(--muted);font-size:11px;font-weight:600;white-space:nowrap}
    td{font-size:13px}
    tbody tr:last-child td{border-bottom:0}
    tbody tr:hover{background:#fcfcfc}
    .table-link{font-weight:600}
    .table-link:hover{text-decoration:underline;text-underline-offset:3px}
    .subline{display:block;color:var(--muted);font-size:11px;margin-top:2px}
    .person-cell{display:flex;align-items:center;gap:10px;min-width:160px}
    .person-cell .avatar{width:30px;height:30px;font-size:11px}
    .empty-state{padding:54px 20px;text-align:center;color:var(--muted)}
    .empty-icon{width:42px;height:42px;border:1px solid var(--line);border-radius:50%;display:grid;place-items:center;margin:0 auto 12px;color:var(--muted-light)}
    .empty-state p{font-size:13px}
    .empty-state .button{margin-top:16px}
    .stats-strip{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
    .stat{padding:14px 16px;border:1px solid var(--line);border-radius:var(--radius);background:var(--surface)}
    .stat-label{display:block;color:var(--muted);font-size:12px}
    .stat-value{display:block;font-size:22px;font-weight:700;line-height:1.25;margin-top:4px}
    .project-grid{display:grid;grid-template-columns:minmax(0,2fr) minmax(260px,1fr);gap:16px;align-items:start}
    .detail-main{display:grid;grid-template-columns:minmax(0,1fr);gap:16px;min-width:0}
    .detail-main>.card{min-width:0;max-width:100%}
    .detail-support{display:grid;gap:16px;min-width:0}
    .project-identity{display:flex;align-items:flex-start;justify-content:space-between;gap:20px}
    .project-title-row{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
    .project-code{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:11px;color:var(--muted);direction:ltr}
    .tabs{display:flex;align-items:center;gap:4px;border-bottom:1px solid var(--line);overflow-x:auto;overflow-y:hidden}
    .tab{position:relative;display:inline-flex;align-items:center;justify-content:center;min-height:45px;padding:0 12px;border:0;background:transparent;color:var(--muted);font-size:13px;white-space:nowrap}
    .tab:hover{color:var(--text)}
    .tab.active{color:var(--text);font-weight:600}
    .tab.active:after{content:"";position:absolute;right:12px;left:12px;bottom:-1px;height:2px;background:var(--primary);border-radius:2px}
    .metadata-list{display:grid;gap:0}
    .metadata-row{display:flex;align-items:flex-start;justify-content:space-between;gap:12px;padding:12px 0;border-bottom:1px solid var(--line);font-size:13px}
    .metadata-row:last-child{border-bottom:0;padding-bottom:0}
    .metadata-row:first-child{padding-top:0}
    .metadata-label{color:var(--muted)}
    .metadata-value{text-align:left;font-weight:500}
    .member-list{display:grid;gap:12px}
    .member{display:flex;align-items:center;gap:9px}
    .member-copy{display:grid;line-height:1.35}
    .member-name{font-size:12px;font-weight:600}
    .member-role{font-size:11px;color:var(--muted)}
    .task-list{display:grid}
    .task-row{display:grid;grid-template-columns:24px minmax(0,1fr) auto;align-items:center;gap:10px;padding:13px 0;border-bottom:1px solid var(--line)}
    .task-row:last-child{border-bottom:0;padding-bottom:0}
    .task-row:first-child{padding-top:0}
    .task-check{width:18px;height:18px;accent-color:var(--primary)}
    .task-title{font-size:13px;font-weight:500}
    .task-meta{display:flex;align-items:center;gap:8px;margin-top:2px;color:var(--muted);font-size:11px}
    .board{display:grid;grid-template-columns:repeat(3,minmax(210px,1fr));gap:12px;overflow-x:auto}
    .board-column{background:var(--surface-subtle);border:1px solid var(--line);border-radius:var(--radius);padding:12px;min-height:280px}
    .board-column-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px}
    .board-column-title{font-size:12px;font-weight:600}
    .board-count{font-size:11px;color:var(--muted);background:var(--surface);border:1px solid var(--line);padding:1px 7px;border-radius:999px}
    .board-card{padding:12px;background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);margin-top:8px;box-shadow:0 1px 2px rgba(24,24,27,.03)}
    .board-card-title{font-size:12px;font-weight:600;line-height:1.5}
    .board-card-foot{display:flex;align-items:center;justify-content:space-between;margin-top:10px;color:var(--muted);font-size:11px}
    .form-card{max-width:940px}
    .form-section{padding:20px 0;border-bottom:1px solid var(--line)}
    .form-section:first-child{padding-top:0}
    .form-section:last-of-type{border-bottom:0}
    .form-section-title{font-size:15px;font-weight:600}
    .form-section-description{font-size:12px;color:var(--muted);margin-top:4px}
    .form-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px;margin-top:18px}
    .field{display:grid;gap:6px}
    .field.full{grid-column:1/-1}
    .field-label{font-size:12px;font-weight:600}
    .required{color:var(--danger);margin-inline-start:2px}
    .field-help{font-size:11px;color:var(--muted)}
    .field-error{font-size:11px;color:var(--danger)}
    .form-footer{display:flex;align-items:center;justify-content:space-between;gap:12px;padding-top:20px}
    .form-footer-actions{display:flex;gap:8px;flex-wrap:wrap}
    .inline-alert{display:flex;align-items:flex-start;gap:10px;padding:12px 14px;border:1px solid #fecaca;border-radius:var(--radius);background:var(--danger-bg);color:var(--danger);font-size:12px}
    .inline-alert .icon{flex:none;margin-top:2px}
    .search-page{max-width:940px}
    .search-results{display:grid;gap:8px;margin-top:16px}
    .result{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:15px 16px;background:var(--surface);border:1px solid var(--line);border-radius:var(--radius)}
    .result:hover{border-color:var(--line-strong);box-shadow:var(--shadow)}
    .result-copy{display:flex;align-items:center;gap:12px;min-width:0}
    .result-icon{width:34px;height:34px;border-radius:var(--radius);display:grid;place-items:center;background:var(--surface-subtle);color:var(--muted);flex:none}
    .result-title{font-size:13px;font-weight:600}
    .result-meta{font-size:11px;color:var(--muted);margin-top:2px}
    .settings-grid{display:grid;grid-template-columns:220px minmax(0,1fr);gap:16px;align-items:start}
    .settings-nav{padding:8px;display:grid;gap:3px}
    .settings-link{padding:10px;border:0;background:transparent;border-radius:6px;text-align:right;color:var(--muted);font-size:13px}
    .settings-link:hover,.settings-link.active{background:var(--surface-subtle);color:var(--text);font-weight:600}
    .settings-content{max-width:760px}
    .setting-row{display:flex;align-items:center;justify-content:space-between;gap:20px;padding:16px 0;border-bottom:1px solid var(--line)}
    .setting-row:last-child{border-bottom:0}
    .setting-copy{min-width:0}
    .setting-title{font-size:13px;font-weight:600}
    .setting-description{font-size:12px;color:var(--muted);margin-top:3px}
    .toggle{width:40px;height:24px;padding:3px;border:0;border-radius:999px;background:#d4d4d8;display:flex;align-items:center;flex:none;transition:background .15s ease}

        return `<div class="page-stack" data-od-id="create-project-page"><div class="page-head"><div>${backButton('/projects')}<div style="margin-top:12px"><p class="eyebrow">المشاريع / إضافة</p><h1 data-od-id="create-project-title">إنشاء مشروع</h1><p class="page-description">أدخل المعلومات التي يحتاجها الفريق للبدء، ويمكن استكمال التفاصيل لاحقًا.</p></div></div></div><form id="project-form" class="card form-card" novalidate data-od-id="create-project-form"><div class="card-body"><div id="project-form-error" class="inline-alert" hidden>${icon('warning')}<span></span></div><section class="form-section"><h2 class="form-section-title">المعلومات الأساسية</h2><p class="form-section-description">اسم واضح ورمز يمكن الرجوع إليه في المحادثات والتحديثات.</p><div class="form-grid"><label class="field"><span class="field-label">اسم المشروع <span class="required">*</span></span><input id="new-project-name" class="input" required placeholder="مثال: تطوير بوابة المستفيد" data-od-id="new-project-name"><span class="field-help">اجعل الاسم مرتبطًا بالنتيجة التي يعمل عليها الفريق.</span></label><label class="field"><span class="field-label">رمز المشروع <span class="required">*</span></span><input id="new-project-code" class="input" required placeholder="مثال: NASQ-246" dir="ltr" data-od-id="new-project-code"><span class="field-help">يُستخدم للبحث السريع، مثل NASQ-246.</span></label><label class="field full"><span class="field-label">وصف مختصر</span><textarea id="new-project-description" class="textarea" rows="4" placeholder="ما النتيجة التي يسعى المشروع إلى تحقيقها؟" data-od-id="new-project-description"></textarea></label></div></section><section class="form-section"><h2 class="form-section-title">المسؤول والمتابعة</h2><p class="form-section-description">تحديد مالك المشروع والموعد المبدئي يساعد على وضوح الخطوة التالية.</p><div class="form-grid"><label class="field"><span class="field-label">مالك المشروع <span class="required">*</span></span><select id="new-project-owner" class="select"         else if (/^\/projects\/\d+$/.test(path)) content.innerHTML = renderProjectDetail(Number(path.split('/')[2]),query);
        else if (path === '/hr') content.innerHTML = renderPeople(query);
        else if (/^\/hr\/employee\/\d+\/edit$/.test(path)) content.innerHTML = renderEmployeeEdit(Number(path.split('/')[3]));
        else if (/^\/hr\/employee\/\d+$/.test(path)) content.innerHTML = renderEmployee(Number(path.split('/')[3]),query);

      function setQuery(values) {
        const {path,query} = routeData(); Object.entries(values).forEach(([key,value]) => value ? query.set(key,value) : query.delete(key));

      function updateQueryInPlace(values) {

        history.replaceState(null,'',`#${path}${query.toString() ? `?${query.toString()}` : ''}`);
        clearTimeout(filterTimer); filterTimer = setTimeout(render,180);

      function refineRenderedView() {
        const content = document.getElementById('content');
        const page = content.firstElementChild;

        if (page.dataset.odId === 'projects-page') {
          const head = page.querySelector('.page-head');
          const stats = page.querySelector('[data-od-id="projects-summary"]');
          const toolbar = page.querySelector('[data-od-id="projects-toolbar"]');
          const listSection = page.querySelector('[data-od-id="projects-list-section"]');
          if (head && toolbar) {
            const actions = head.querySelector('.page-actions');
            if (actions) Array.from(actions.children).forEach(child => toolbar.appendChild(child));
            head.remove();
          }
          if (stats && listSection) {
            const values = Array.from(stats.querySelectorAll('.stat-value')).map(node => node.textContent.trim());
            const summary = document.createElement('div');
            summary.className = 'inline-summary';
            summary.dataset.odId = 'projects-inline-summary';
            summary.innerHTML = `<span><strong>${esc(values[0] || '0')}</strong> معروض</span><span class="summary-separator">·</span><span><strong>${esc(values[1] || '0')}</strong> تحتاج متابعة</span><span class="summary-separator">·</span><span><strong>${esc(values[2] || '0')}</strong> مكتملة</span>`;
            stats.replaceWith(summary);
          }
          return;
        }

        if (page.dataset.odId === 'project-detail-page') {
          const head = page.querySelector('.page-head');
          const context = page.querySelector('[data-od-id="project-context"]');
          if (head && context) {
            const compact = document.createElement('div');
            compact.className = 'compact-detail-row';
            compact.dataset.odId = 'project-detail-context';
            const copy = document.createElement('div');
            copy.className = 'compact-detail-copy';
            const code = context.querySelector('.project-code');
            const status = head.querySelector('.project-title-row .chip');
            const description = head.querySelector('.page-description');
            if (code) copy.appendChild(code);
            if (status) copy.appendChild(status);
            if (description) copy.appendChild(description);
            const actions = head.querySelector('.page-actions') || document.createElement('div');
            actions.classList.add('page-actions');
            const back = head.querySelector('[data-back]');
            if (back) actions.prepend(back);
            compact.append(copy, actions);

            const tabsRow = document.createElement('div');
            tabsRow.className = 'detail-tabs-row';

            if (progress) {
              const progressValue = progress.querySelector('strong')?.textContent.trim() || '0%';
              const progressWidth = progress.querySelector('span[style*="width"]')?.style.width || '0%';
              progress.className = 'progress-inline';
              progress.innerHTML = `<span>التقدم</span><strong>${esc(progressValue)}</strong><span class="progress-track"><span class="progress-fill" style="width:${esc(progressWidth)}"></span></span>`;
              tabsRow.appendChild(progress);
            }
            context.replaceWith(tabsRow);
          }
          page.querySelectorAll('.detail-main .card-header .page-description').forEach(node => node.remove());
          page.querySelector('[data-od-id="project-overview"] .stats-strip')?.remove();
          return;
        }

        const head = page.querySelector('.page-head');
        if (head) {
          const row = document.createElement('div');
          row.className = 'compact-page-row';
          row.dataset.odId = 'compact-page-actions';
          const back = head.querySelector('[data-back]');

          if (back) row.appendChild(back);
          if (usefulDescription) row.appendChild(usefulDescription);
          if (actions) row.appendChild(actions);
          head.replaceWith(row.childNodes.length ? row : document.createComment('page header removed'));
        }
      }

        return `<div class="card" data-od-id="project-overview"><div class="card-header"><div><h2>نظرة عامة</h2></div></div><div class="card-body"><div class="detail-overview-grid"><section class="overview-block" data-od-id="project-description-block"><h3>وصف المشروع</h3><p class="overview-copy">${esc(project.description_html)}</p><div class="overview-summary"><span><strong>${closed} من ${data.tasks.length}</strong> مهام مكتملة</span></div></section><section class="overview-block" data-od-id="project-next-milestone"><h3>أقرب معلم</h3>${nextMilestone ? `<div class="milestone-preview"><div class="preview-row"><div class="preview-copy"><p class="preview-title">${esc(nextMilestone.name)}</p><p class="preview-meta">${nextMilestone.deadline ? `الموعد ${esc(nasqDateLabel(nextMilestone.deadline))}` : 'دون موعد'} · ${nextMilestone.done_task_count} من ${nextMilestone.task_count} مهام مرتبطة</p></div>${statusChip(nasqMilestoneStatusLabel(nextMilestone),nasqMilestoneStatusClass(nextMilestone))}</div></div>` : `<p class="overview-copy">لا توجد معالم قادمة بعد.</p>`}</section><section class="overview-block" data-od-id="project-latest-update"><h3>آخر تحديث</h3>${latest ? `<div class="update-preview"><div class="preview-row"><div class="preview-copy"><p class="preview-title">${esc(latest.name)}</p><p class="preview-meta">${esc(latest.author)} · ${esc(nasqDateLabel(latest.date))}</p></div>${statusChip(nasqHealthLabel(latest.status),nasqHealthClass(latest.status))}</div><p class="overview-copy">${esc(latest.description_html)}</p></div>` : `<p class="overview-copy">لم يُضف تحديث لهذا المشروع.</p>`}</section></div></div></div>`;
      }
      const nasqMilestoneStatus = milestone => milestone.is_reached ? 'reached' : milestone.deadline && milestone.deadline < nasqToday ? 'overdue' : 'pending';
      const nasqMilestoneStatusLabel = milestone => ({reached:'تم الوصول',pending:'قادم',overdue:'متأخر'})[nasqMilestoneStatus(milestone)];
      const nasqMilestoneStatusClass = milestone => ({reached:'success',pending:'info',overdue:'warning'})[nasqMilestoneStatus(milestone)];
      const nasqStageOptions = (project,current) => project.stages.map(stage => `<option value="${esc(stage.id)}"${nasqSelected(stage.id,current)}>${esc(stage.name)}</option>`).join('');
      const nasqAssignees = () => [...new Set([...employees.map(employee => employee.name),...Object.values(nasqSeedData).flatMap(data => data.tasks.map(task => task.assignee)),...Object.values(nasqProjectData).flatMap(data => nasqSafeList(data.tasks).map(task => task.assignee))].filter(Boolean))].map(name => `<option value="${esc(name)}">${esc(name)}</option>`).join('');

      function renderTaskFilters(project,query,tasks) { const stage = query.get('stage') || 'all'; const assignee = query.get('assignee') || 'all'; const status = query.get('status') || 'all'; const q = query.get('q') || ''; return `<div class="task-toolbar" data-od-id="project-task-toolbar"><label class="input-wrap"><span class="sr-only">بحث في المهام</span><span class="field-icon">${icon('search')}</span><input id="task-search" class="input with-icon" type="search" placeholder="ابحث في عنوان المهمة" value="${esc(q)}" data-od-id="task-search-input"></label><label class="select-wrap"><span class="sr-only">مرحلة سير العمل</span><select id="task-stage-filter" class="select" data-task-filter="stage"><option value="all">كل مراحل سير العمل</option>${project.stages.map(item => `<option value="${esc(item.id)}"${nasqSelected(item.id,stage)}>${esc(item.name)}</option>`).join('')}</select></label><label class="select-wrap"><span class="sr-only">المسند إليه</span><select id="task-assignee-filter" class="select" data-task-filter="assignee"><option value="all">كل المسند إليهم</option>${[...new Set(nasqDataFor(project.id).tasks.map(task => task.assignee).filter(Boolean))].map(name => `<option value="${esc(name)}"${nasqSelected(name,assignee)}>${esc(name)}</option>`).join('')}</select></label><label class="select-wrap"><span class="sr-only">حالة الإنجاز</span><select id="task-status-filter" class="select" data-task-filter="status"><option value="all">كل حالات الإنجاز</option><option value="todo"${nasqSelected('todo',status)}>مفتوحة</option><option value="in_progress"${nasqSelected('in_progress',status)}>قيد التنفيذ</option><option value="done"${nasqSelected('done',status)}>مكتملة</option></select></label><div class="view-switch" aria-label="طريقة عرض المهام" data-od-id="task-view-switch"><button type="button" class="${query.get('view') !== 'board' ? 'active':''}" data-task-view="table" aria-label="عرض جدول المهام">${icon('list')}</button><button type="button" class="${query.get('view') === 'board' ? 'active':''}" data-task-view="board" aria-label="عرض لوحة المهام">${icon('grid')}</button></div></div>`; }
      const nasqFilteredTasks = (tasks,query) => { const q = (query.get('q') || '').trim().toLocaleLowerCase(); const stage = query.get('stage') || 'all'; const assignee = query.get('assignee') || 'all'; const status = query.get('status') || 'all'; return tasks.filter(task => (!q || task.title.toLocaleLowerCase().includes(q)) && (stage === 'all' || task.stage_id === stage) && (assignee === 'all' || task.assignee === assignee) && (status === 'all' || task.state === status)); };
      function renderTaskTable(project,tasks) { return tasks.length ? `<div class="table-scroll"><table class="task-table" data-od-id="project-task-table"><thead><tr><th>المهمة</th><th>المسند إليه</th><th>مرحلة سير العمل</th><th>الموعد</th><th>الأولوية</th><th>حالة الإنجاز</th></tr></thead><tbody>${tasks.map(task => `<tr data-od-id="task-row-${esc(task.id)}"><td><div class="task-title-cell"><button class="task-status-toggle ${task.state === 'done' ? 'done':''}" type="button" data-task-toggle="${esc(task.id)}" aria-label="${task.state === 'done' ? 'إعادة فتح المهمة':'تعليم المهمة كمكتملة'}" aria-pressed="${task.state === 'done'}">${task.state === 'done' ? icon('check') : ''}</button><span><span class="task-cell-title">${esc(task.title)}</span><span class="task-cell-meta">${esc(task.project_id ? project.code : '')}</span></span></div></td><td>${esc(task.assignee || 'غير مسندة')}</td><td><select class="select task-select" data-task-stage="${esc(task.id)}" aria-label="مرحلة ${esc(task.title)}">${nasqStageOptions(project,task.stage_id)}</select></td><td>${esc(nasqShortDate(task.deadline))}</td><td><span class="task-priority">${esc(nasqPriorityLabels[task.priority] || nasqPriorityLabels.normal)}</span></td><td>${statusChip(nasqTaskLabel(task.state),task.state === 'done' ? 'success' : task.state === 'in_progress' ? 'warning' : 'info')}</td></tr>`).join('')}</tbody></table></div>` : `<div class="empty-state" data-od-id="project-tasks-empty"><div class="empty-icon">${icon('search')}</div><p>لا توجد مهام تطابق البحث والفلاتر الحالية.</p><button class="button secondary small" type="button" data-clear-task-filters>مسح الفلاتر</button></div>`; }
      function renderTaskBoard(project,tasks) { return `<div class="board-wrap"><div class="board" data-od-id="project-task-board">${project.stages.map(stage => { const stageTasks = tasks.filter(task => task.stage_id === stage.id); return `<section class="board-column" data-od-id="board-stage-${esc(stage.id)}"><div class="board-column-head"><span class="board-column-title">${esc(stage.name)}</span><span class="board-count">${stageTasks.length}</span></div>${stageTasks.map(task => `<article class="board-card" data-od-id="board-task-${esc(task.id)}"><p class="board-card-title">${esc(task.title)}</p><div class="board-card-foot"><span class="board-card-assignee">${esc(task.assignee || 'غير مسندة')}</span>${statusChip(nasqTaskLabel(task.state),task.state === 'done' ? 'success' : task.state === 'in_progress' ? 'warning' : 'info')}</div><select class="select task-select" data-task-stage="${esc(task.id)}" aria-label="مرحلة ${esc(task.title)}">${nasqStageOptions(project,task.stage_id)}</select></article>`).join('') || `<p style="font-size:12px;color:var(--muted);padding-top:8px">لا توجد مهام هنا.</p>`}</section>`; }).join('')}</div></div>`; }
      function renderProjectTasks(project,data,query) { const filtered = nasqFilteredTasks(data.tasks,query); return `<div class="card" data-od-id="project-task-list"><div class="card-header"><div><h2>المهام</h2></div></div>${renderTaskFilters(project,query,filtered)}<div class="task-filter-summary" ${(query.get('q') || query.get('stage') || query.get('assignee') || query.get('status')) ? '' : 'hidden'}><span>${filtered.length} من ${data.tasks.length} مهام</span><button class="button ghost small" type="button" data-clear-task-filters>مسح الفلاتر</button></div>${query.get('view') === 'board' ? renderTaskBoard(project,filtered) : renderTaskTable(project,filtered)}</div>`; }
      function renderProjectMilestones(project,data,query) { const milestones = data.milestones.map(item => nasqMilestoneSnapshot(item,data)); return `<div class="card" data-od-id="project-milestones"><div class="card-header"><div><h2>المعالم</h2><p class="page-description">المعالم نقاط إنجاز مستقلة عن مراحل سير العمل في المهام.</p></div><button class="button secondary small" type="button" data-route="${nasqChildHref(project.id,'milestones/new',query)}" data-od-id="new-milestone-button">${icon('plus')}<span>إضافة معلم</span></button></div><div class="card-body"><div class="milestone-list">${milestones.length ? milestones.map(item => `<article class="milestone-row" data-od-id="milestone-row-${esc(item.id)}"><div><p class="milestone-name">${esc(item.name)}</p><div class="milestone-meta"><span>${item.deadline ? `الموعد ${esc(nasqDateLabel(item.deadline))}` : 'دون موعد'}</span><span>·</span><span>${item.done_task_count} من ${item.task_count} مهام مكتملة</span></div></div>${statusChip(nasqMilestoneStatusLabel(item),nasqMilestoneStatusClass(item))}<div class="milestone-actions"><button class="button ghost small" type="button" data-milestone-toggle="${esc(item.id)}">${item.is_reached ? 'إعادة فتح' : 'تحديد كمتحقق'}</button><button class="button ghost small" type="button" data-route="${nasqChildHref(project.id,`milestones/${encodeURIComponent(item.id)}/edit`,query)}">تعديل</button></div></article>`).join('') : `<div class="empty-state" data-od-id="milestones-empty"><p>لا توجد معالم لهذا المشروع بعد.</p></div>`}</div></div></div>`; }
      function renderProjectUpdates(project,data,query) { const updates = data.updates.slice().sort((a,b) => String(b.date).localeCompare(String(a.date))); return `<div class="card" data-od-id="project-updates"><div class="card-header"><div><h2>التحديثات</h2><p class="page-description">سجل زمني مختصر لحالة المشروع وما تغيّر فيه.</p></div><button class="button secondary small" type="button" data-route="${nasqChildHref(project.id,'updates/new',query)}" data-od-id="new-update-button">${icon('plus')}<span>إضافة تحديث</span></button></div><div class="card-body"><div class="timeline">${updates.length ? updates.map(update => `<article class="timeline-item" data-od-id="update-${esc(update.id)}"><span class="timeline-marker" aria-hidden="true">${icon('check')}</span><div><div class="timeline-head"><div><p class="timeline-title">${esc(update.name)}</p><p class="timeline-meta">${esc(update.author)} · ${esc(nasqDateLabel(update.date))}</p></div>${statusChip(nasqHealthLabel(update.status),nasqHealthClass(update.status))}</div><p class="timeline-body">${esc(update.description_html || 'دون وصف إضافي.')}</p></div></article>`).join('') : `<div class="empty-state" data-od-id="updates-empty"><p>لم يُضف تحديث لهذا المشروع بعد.</p><button class="button secondary small" type="button" data-route="${nasqChildHref(project.id,'updates/new',query)}">إضافة تحديث</button></div>`}</div></div></div>`; }
      function renderProjectDetail(id,query) { const found = nasqFindProject(id); if (!found) return `<div class="empty-state card"><p>لم يُعثر على المشروع.</p></div>`; const data = nasqDataFor(found.id); const project = nasqProjectSnapshot(found,data); const tab = ['overview','tasks','milestones','updates'].includes(query.get('tab')) ? query.get('tab') : query.get('tab') === 'board' ? 'tasks' : 'overview'; if (query.get('tab') === 'board' && query.get('view') !== 'board') query.set('view','board'); updateHeader(project.name,'المشاريع'); setActiveNav('projects'); const tabs = [['overview','نظرة عامة'],['tasks','المهام'],['milestones','المعالم'],['updates','التحديثات']].map(([value,label]) => `<a class="tab ${tab === value ? 'active':''}" role="tab" aria-selected="${tab === value}" aria-controls="project-panel-${value}" href="${nasqDetailTabHref(project.id,query,value)}" data-route="${nasqDetailTabHref(project.id,query,value)}" data-od-id="project-tab-${value}">${label}</a>`).join(''); const panel = tab === 'tasks' ? renderProjectTasks(project,data,query) : tab === 'milestones' ? renderProjectMilestones(project,data,query) : tab === 'updates' ? renderProjectUpdates(project,data,query) : renderProjectOverview(project,data); return `<div class="page-stack" data-od-id="project-detail-page"><div class="compact-detail-row" data-od-id="project-detail-context"><button class="button ghost small" type="button" data-back="${esc(query.get('from') || '/projects')}">${icon('back')}<span>العودة إلى المشاريع</span></button><div class="page-actions"><button class="button primary icon-only" type="button" data-route="${nasqChildHref(project.id,'tasks/new',query)}" data-od-id="new-task-cta" aria-label="مهمة جديدة" title="مهمة جديدة">${icon('plus')}</button><button class="button secondary icon-only" type="button" data-route="${nasqChildHref(project.id,'settings',query)}" data-od-id="project-settings-link" aria-label="إعدادات المشروع" title="إعدادات المشروع">${icon('settings')}</button><button class="button secondary icon-only" type="button" data-project-archive="${project.id}" data-od-id="archive-project-button" aria-label="أرشفة" title="أرشفة">${icon('archive')}</button></div></div><section class="card" data-od-id="project-context"><div class="card-body"><div class="project-context-top"><div class="project-context-copy"><span class="project-code">${esc(project.code)}</span>${statusChip(nasqHealthLabel(project.health_status),nasqHealthClass(project.health_status))}<span class="project-date-context">من ${esc(nasqDateLabel(project.date_start))} إلى ${esc(nasqDateLabel(project.date_end))}</span></div><div class="progress-inline"><span>الإنجاز</span><strong>${project.progress}%</strong><span class="progress-track"><span class="progress-fill" style="width:${project.progress}%"></span></span></div></div><nav class="tabs" role="tablist" aria-label="تفاصيل المشروع" data-od-id="project-tabs">${tabs}</nav></div></section><div class="project-grid ${tab === 'tasks' ? 'project-grid-tasks' : ''}"><div class="detail-main" id="project-panel-${tab}" role="tabpanel">${panel}</div><aside class="detail-support"><div class="card" data-od-id="project-metadata"><div class="card-header"><h2>بيانات المشروع</h2></div><div class="card-body"><div class="metadata-list"><div class="metadata-row"><span class="metadata-label">مدير المشروع</span><span class="metadata-value">${esc(project.manager)}</span></div><div class="metadata-row"><span class="metadata-label">تاريخ البداية</span><span class="metadata-value">${esc(nasqDateLabel(project.date_start))}</span></div><div class="metadata-row"><span class="metadata-label">تاريخ النهاية</span><span class="metadata-value">${esc(nasqDateLabel(project.date_end))}</span></div><div class="metadata-row"><span class="metadata-label">الظهور</span><span class="metadata-value">${project.privacy_visibility === 'followers' ? 'المتابعون' : 'الموظفون'}</span></div><div class="metadata-row"><span class="metadata-label">المتابعون</span><span class="metadata-value">${project.followers_count}</span></div><div class="metadata-row"><span class="metadata-label">الوسوم</span><span class="metadata-value"><span class="project-tags">${project.tags.map(tag => `<span class="chip neutral">${esc(tag)}</span>`).join('')}</span></span></div></div></div></div><div class="card" data-od-id="project-snapshot"><div class="card-header"><h2>ملخص العمل</h2></div><div class="card-body"><div class="metadata-list"><div class="metadata-row"><span class="metadata-label">المهام</span><span class="metadata-value">${project.closed_task_count} من ${project.task_count} مكتملة</span></div><div class="metadata-row"><span class="metadata-label">المعالم</span><span class="metadata-value">${project.milestone_count}</span></div><div class="metadata-row"><span class="metadata-label">مراحل سير العمل</span><span class="metadata-value">${project.stages.length}</span></div></div></div></div></aside></div></div>`; }

      function renderCreateProject() { updateHeader('مشروع جديد','المشاريع'); setActiveNav('projects'); return `<div class="page-stack" data-od-id="create-project-page"><div class="page-head"><div>${backButton('/projects')}<div style="margin-top:12px"><p class="eyebrow">المشاريع / إضافة</p><h1 data-od-id="create-project-title">إنشاء مشروع</h1><p class="page-description">أدخل الحد الأدنى من بيانات المشروع، ثم أضف المهام والمعالم من داخله.</p></div></div></div><form id="project-form" class="card form-card" novalidate data-od-id="create-project-form"><div class="card-body"><div class="inline-alert" data-form-error hidden>${icon('warning')}<span></span></div><div class="form-grid"><label class="field"><span class="field-label">اسم المشروع <span class="required">*</span></span><input id="new-project-name" class="input" required data-od-id="new-project-name"></label><label class="field"><span class="field-label">رمز المشروع <span class="required">*</span></span><input id="new-project-code" class="input" required dir="ltr" data-od-id="new-project-code"></label><label class="field full"><span class="field-label">الوصف</span><textarea id="new-project-description" class="textarea" rows="4" data-od-id="new-project-description"></textarea></label><label class="field"><span class="field-label">مدير المشروع <span class="required">*</span></span><select id="new-project-manager" class="select" required><option value="">اختر المدير</option>${nasqAssignees()}</select></label><label class="field"><span class="field-label">الحالة</span><select id="new-project-health" class="select">${nasqHealthOptions}</select></label><label class="field"><span class="field-label">تاريخ البداية</span><input id="new-project-start" class="input" type="date"></label><label class="field"><span class="field-label">تاريخ النهاية</span><input id="new-project-end" class="input" type="date"></label></div><div class="form-footer"><span class="field-help">سيُحفظ هذا السجل داخل النموذج التجريبي فقط.</span><div class="form-footer-actions"><button class="button secondary" type="button" data-back="/projects">إلغاء</button><button class="button primary" type="submit" data-od-id="save-project-button">حفظ المشروع</button></div></div></div></form></div>`; }
      function renderTaskCreate(id,query) { const project = nasqProjectSnapshot(nasqFindProject(id),nasqDataFor(id)); updateHeader('مهمة جديدة',project.name); setActiveNav('projects'); return `<div class="page-stack" data-od-id="create-task-page"><div class="page-head"><div>${backButton(nasqDetailReturn(id,query))}<div style="margin-top:12px"><p class="eyebrow">${esc(project.name)} / المهام</p><h1>مهمة جديدة</h1><p class="page-description">إضافة مهمة بسيطة للمشروع مع تحديد المسند إليه ومرحلة سير العمل.</p></div></div></div><form id="task-form" class="card form-card" novalidate data-project-id="${id}" data-return-to="${esc(nasqDetailReturn(id,query))}" data-od-id="create-task-form"><div class="card-body"><div class="inline-alert" data-form-error hidden>${icon('warning')}<span></span></div><div class="form-grid"><label class="field full"><span class="field-label">عنوان المهمة <span class="required">*</span></span><input class="input" name="title" required data-od-id="new-task-title"></label><label class="field"><span class="field-label">المسند إليه</span><select class="select" name="assignee"><option value="">غير مسندة</option>${nasqAssignees()}</select></label><label class="field"><span class="field-label">مرحلة سير العمل</span><select class="select" name="stage_id">${nasqStageOptions(project,project.stages[0]?.id)}</select></label><label class="field"><span class="field-label">الموعد</span><input class="input" type="date" name="deadline"></label><label class="field"><span class="field-label">الأولوية</span><select class="select" name="priority"><option value="normal">متوسطة</option><option value="high">عالية</option><option value="low">منخفضة</option></select></label></div><div class="form-footer"><span class="field-help">ستضاف المهمة إلى هذا المشروع في المعاينة.</span><div class="form-footer-actions"><button class="button secondary" type="button" data-back="${esc(nasqDetailReturn(id,query))}">إلغاء</button><button class="button primary" type="submit">حفظ المهمة</bu e">لا توجد تبعيات مرتبطة بهذه المهمة.</p>`}</div><div class="task-dependency-controls"><select class="select" data-dependency-select aria-label="اختر مهمة سابقة للتبعية"><option value="">اختر مهمة لإضافتها كتَبعية</option>${nasqTaskDependencyOptions(data,task)}</select><button class="button secondary small" type="button" data-dependency-add data-task-project="${project.id}" data-task-id="${esc(task.id)}">إضافة</button></div><p class="field-help">لا يمكن ربط المهمة بنفسها أو إنشاء حلقة تبعية.</p></section><section class="task-section" data-od-id="task-attachments"><div class="task-section-head"><h2>المرفقات</h2></div><div class="task-list">${attachments.length ? attachments.map(file => `<div class="task-attachment-row"><div class="task-attachment-copy">${icon('folder')}<a class="table-link" href="data:text/plain;charset=utf-8,${encodeURIComponent(file.content)}" download="${esc(file.name)}">${esc(file.name)}</a></div><span class="task-attachment-meta">${nasqFormatBytes(file.size)}</span></div>`).join('') : `<p class="task-empty-inline">لا توجد مرفقات لهذه المهمة.</p>`}</div></section><details class="task-section" data-od-id="task-additional-details"><summary class="task-details-summary">تفاصيل إضافية</summary><div class="task-additional-grid"><div class="task-additional-item"><span>تاريخ الإنشاء</span><strong>${esc(nasqDateLabel(detail.created_at))}</strong></div><div class="task-additional-item"><span>آخر تحديث</span><strong>${esc(nasqDateLabel(detail.updated_at))}</strong></div><div class="task-additional-item"><span>عمر المهمة</span><strong>${days} يومًا</strong></div>${detail.planning_hours !== null ? `<div class="task-additional-item"><span>الجهد المخطط</span><strong>${detail.planning_hours} ساعة تقديرية</strong></div>` : ''}</div></details></div></section></div><aside class="task-detail-activity"><section class="card task-activity-card" data-od-id="task-activity"><div class="card-header"><div><h2>النشاط</h2><p class="page-description">تغييرات وتعليقات هذه المهمة فقط.</p></div></div><div class="card-body"><div class="task-activity-list">${nasqTaskActivityRows(detail) || `<p class="task-empty-inline">لا يوجد نشاط بعد.</p>`}</div><form class="task-comment-form" id="task-comment-form" data-task-project="${project.id}" data-task-id="${esc(task.id)}" novalidate><label class="field"><span class="field-label">إضافة تعليق</span><textarea class="textarea" name="body" rows="3" placeholder="اكتب ملاحظة داخلية قصيرة" required></textarea></label><div class="inline-alert" data-form-error hidden>${icon('warning')}<span></span></div><button class="button primary small" type="submit">إضافة</button></form></div></section></aside></div></div>`; }
      function renderTaskMissing(projectId,taskId) { updateHeader('المهمة غير متاحة','المشاريع'); setActiveNav('projects'); return `<div class="page-stack" data-od-id="task-missing-page"><div class="empty-state card"><div class="empty-icon">${icon('search')}</div><h2>لم يُعثر على المهمة</h2><p>تحقق من رابط المهمة أو عد إلى قائمة المهام في المشروع.</p><a class="button secondary small" href="${projectId ? `#/projects/${projectId}?tab=tasks` : '#/projects'}" data-route="${projectId ? `#/projects/${projectId}?tab=tasks` : '#/projects'}">العودة إلى المهام</a></div></div>`; }
      function renderTaskEdit(record,query) { const {project,data,task,detail} = record; updateHeader(task.title,project.name); setActiveNav('projects'); const returnTo = nasqTaskReturn(project.id,query); return `<div class="page-stack" data-od-id="task-edit-page"><div class="task-context-row"><a class="button ghost small" href="${esc(returnTo)}" data-route="${esc(returnTo)}">${icon('back')}<span>العودة إلى المهمة</span></a></div><form id="task-edit-form" class="card form-card task-edit-form" data-project-id="${project.id}" data-task-id="${esc(task.id)}" data-return-to="${esc(returnTo)}" novalidate data-od-id="task-edit-form"><div class="card-body"><div class="inline-alert" data-form-error hidden>${icon('warning')}<span></span></div><section class="form-section"><p class="eyebrow">تعديل المهمة</p><h2 class="form-section-title">البيانات الأساسية</h2><div class="form-grid"><label class="field full"><span class="field-label">العنوان <span class="required">*</span></span><input class="input" name="title" value="${esc(task.title)}" required></label><label class="field full"><span class="field-label">الوصف</span><textarea class="textarea" name="description" rows="5">${esc(detail.description)}</textarea></label><label class="field"><span class="field-label">حالة المهمة</span><select class="select" name="state">${nasqTaskStateOptions(task.state)}</select></label><label class="field"><span class="field-label">الأولوية</span><select class="select" name="priority"><option value="normal"${nasqSelected('normal',task.priority)}>متوسطة</option><option value="high"${nasqSelected('high',task.priority)}>عالية</option><option value="low"${nasqSelected('low',task.priority)}>منخفضة</option></select></label><label class="field"><span class="field-label">المسند إليه</span><select class="select" name="assignee"><option value="">غير مسندة</option>${nasqAssignees().replace(`value="${esc(task.assignee)}"`,`value="${esc(task.assignee)}" selected`)}</select></label><label class="field"><span class="field-label">مرحلة سير العمل</span><select class="select" name="stage_id">${nasqStageOptions(project,task.stage_id)}</select></label><label class="field"><span class="field-label">الموعد</span><input class="input" type="date" name="deadline" value="${esc(task.deadline || '')}"></label><label class="field"><span class="field-label">المعلم</span><select class="select" name="milestone_id">${nasqTaskMilestoneOptions(data,task.milestone_id)}</select></label><label class="field full"><span class="field-label">الوسوم</span><input class="input" name="tags" value="${esc(detail.tags.join('، '))}" placeholder="افصل بين الوسوم بفاصلة"></label></div></section><div class="form-footer"><span class="field-help">يحفظ التعديل داخل هذا النموذج التجريبي محليًا.</span><div class="form-footer-actions"><button class="button secondary" type="button" data-back="${esc(returnTo)}">إلغاء</button><button class="button primary" type="submit">حفظ</button></div></div></div></form></div>`; }
      const nasqOriginalRender = nasqLegacyRender;
      function render() { const {path,query} = routeData(); const taskRoute = path.endsWith('/tasks/new') ? null : path.match(/^\/projects\/([^/]+)\/tasks\/([^/]+)(?:\/(edit))?$/); const aliasRoute = path.match(/^\/tasks\/([^/]+)$/); if (taskRoute || aliasRoute) { const projectId = taskRoute ? decodeURIComponent(taskRoute[1]) : null; const taskId = taskRoute ? decodeURIComponent(taskRoute[2]) : decodeURIComponent(aliasRoute[1]); const record = nasqFindTask(projectId,taskId); const content = document.getElementById('content'); if (!record) content.innerHTML = renderTaskMissing(projectId,taskId); else content.innerHTML = taskRoute && taskRoute[3] ? renderTaskEdit(record,query) : renderTaskDetail(record,query); refineRenderedView(); bindPageEvents(); window.scrollTo({top:0,behavior:'instant'}); return; } nasqOriginalRender(); }
      const nasqOriginalBindPageEvents = nasqLegacyBindPageEvents;
      function bindPageEvents() { nasqOriginalBindPageEvents(); document.querySelectorAll('[data-subtask-toggle]').forEach(node => node.addEventListener('click', () => { const record = nasqFindTask(node.dataset.taskProject || routeData().path.split('/')[2],node.dataset.taskId); if (!record) return; const item = record.detail.subtasks.find(subtask => String(subtask.id) === String(node.dataset.subtaskToggle)); if (item) { item.done = !item.done; record.detail.updated_at = nasqToday; nasqPersistData(); render(); } })); document.querySelectorAll('[data-dependency-add]').forEach(node => node.addEventListener('click', () => { const record = nasqFindTask(node.dataset.taskProject,node.dataset.taskId); const select = node.parentElement.querySelector('[data-dependency-select]'); const value = select?.value; if (!record || !value) return; if (nasqWouldCycle(record.data,record.task.id,value)) { toast('لا يمكن إضافة تبعية تُنشئ حلقة.'); return; } record.detail.dependencies = [...new Set([...record.detail.dependencies,String(value)])]; record.detail.updated_at = nasqToday; nasqPersistData(); render(); })); document.querySelectorAll('[data-task-archive]').forEach(node => node.addEventListener('click', () => { const existing = document.querySelector('[data-task-archive-confirm]'); if (existing) { existing.remove(); return; } const host = node.closest('[data-od-id="task-detail-page"]'); if (!host) return; const alert = document.createElement('div'); alert.className = 'inline-alert task-archive-alert'; alert.dataset.taskArchiveConfirm = 'true'; alert.innerHTML = `${icon('warning')}<span>ستختفي المهمة من قوائم المشروع بعد الأرشفة. <button class="button danger small" type="button" data-confirm-task-archive="${esc(node.dataset.taskArchive)}">تأكيد الأرشفة</button> <button class="button ghost small" type="button" data-cancel-task-archive>إلغاء</button></span>`; host.prepend(alert); alert.querySelector('[data-confirm-task-archive]').addEventListener('click', () => { const record = nasqFindTask(node.dataset.taskProject,node.dataset.taskArchive); if (record) { const stored = nasqProjectData[String(record.project.id)]; const raw = nasqSafeList(stored.tasks).find(item => String(item.id) === String(record.task.id)); if (raw) raw.archived = true; nasqPersistData(); go(nasqTaskReturn(record.project.id,routeData().query)); } }); alert.querySelector('[data-cancel-task-archive]').addEventListener('click', () => alert.remove()); })); const subtaskForm = document.getElementById('task-subtask-form'); if (subtaskForm) subtaskForm.addEventListener('submit', event => { event.preventDefault(); const form = event.currentTarget; const title = form.elements.title.value.trim(); if (!title) return; const record = nasqFindTask(form.dataset.taskProject,form.dataset.taskId); if (!record) return; record.detail.subtasks.push({id:`${record.task.id}-s-${Date.now()}`,title,done:false}); record.detail.updated_at = nasqToday; nasqPersistData(); render(); }); const commentForm = document.getElementById('task-comment-form'); if (commentForm) commentForm.addEventListener('submit', event => { event.preventDefault(); const form = event.currentTarget; const body = form.elements.body.value.trim(); if (!body) { nasqFormError(form,'اكتب التعليق قبل الإضافة.'); return; } const record = nasqFindTask(form.dataset.taskProject,form.dataset.taskId); if (!record) return; record.detail.activity.push({id:`${record.task.id}-a-${Date.now()}`,type:'comment',title:'تعليق',author:'طارق محمد',date:nasqToday,body}); record.detail.updated_at = nasqToday; nasqPersistData(); render(); }); const editForm = document.getElementById('task-edit-form'); if (editForm) editForm.addEventListener('submit', event => { event.preventDefault(); const form = event.currentTarget; const title = form.elements.title.value.trim(); if (!title) { nasqFormError(form,'أدخل عنوان المهمة قبل الحفظ.'); return; } const record = nasqFindTask(form.dataset.projectId,form.dataset.taskId); if (!record) return; record.task.title = title; record.task.state = Object.prototype.hasOwnProperty.call(nasqTaskLabels,form.elements.state.value) ? form.elements.state.value : 'todo'; record.task.priority = ['low','normal','high'].includes(form.elements.priority.value) ? form.elements.priority.value : 'normal'; record.task.assignee = form.elements.assignee.value.trim ? form.elements.assignee.value : ''; record.task.stage_id = form.elements.stage_id.value; record.task.deadline = form.elements.deadline.value || null; record.task.milestone_id = form.elements.milestone_id.value || null; record.detail.description = form.elements.description.value.trim(); record.detail.tags = form.elements.tags.value.split(/[،,]/).map(value => value.trim()).filter(Boolean).slice(0,8); record.detail.updated_at = nasqToday; record.detail.activity.push({id:`${record.task.id}-a-${Date.now()}`,type:'change',title:'تعديل بيانات المهمة',author:'طارق محمد',date:nasqToday,body:'تم حفظ التعديل داخل العرض التجريبي.'}); nasqPersistData(); toast('تم حفظ تعديل المهمة.'); go(editForm.dataset.returnTo); }); }
      const sidebar = document.getElementById('sidebar');
      const collapseToggle = document.getElementById('collapse-sidebar');
      const mobileToggle = document.getElementById('mobile-menu');
      collapseToggle.innerHTML = icon('panelClose');
      mobileToggle.innerHTML = icon('menu');
      const syncSidebarControls = () => {
        const collapsed = sidebar.classList.contains('collapsed');
        const mobileOpen = sidebar.classList.contains('mobile-open');
        collapseToggle.innerHTML = icon(collapsed ? 'panelOpen' : 'panelClose');
        mobileToggle.innerHTML = icon(mobileOpen ? 'close' : 'menu');
        collapseToggle.setAttribute('aria-expanded', String(!collapsed));
        collapseToggle.setAttribute('aria-label', collapsed ? 'توسيع القائمة' : 'طي القائمة');
        collapseToggle.title = collapsed ? 'توسيع القائمة' : 'طي القائمة';
        mobileToggle.setAttribute('aria-expanded', String(mobileOpen));
        mobileToggle.setAttribute('aria-label', mobileOpen ? 'إغلاق قائمة التنقل' : 'فتح قائمة التنقل');
      };
      collapseToggle.addEventListener('click', () => { sidebar.classList.toggle('collapsed'); localStorage.setItem('nasq-sidebar-collapsed',sidebar.classList.contains('collapsed') ? '1':'0'); syncSidebarControls(); });
      mobileToggle.addEventListener('click', () => { sidebar.classList.toggle('mobile-open'); syncSidebarControls(); });
      new MutationObserver(syncSidebarControls).observe(sidebar, {attributes:true,attributeFilter:['class']});
      document.querySelectorAll('[data-group-toggle]').forEach(node => { node.addEventListener('click', () => node.closest('.nav-group').classList.toggle('collapsed')); node.addEventListener('keydown', event => { if (event.key === 'Enter' || event.key === ' ') { event.preventDefault(); node.closest('.nav-group').classList.toggle('collapsed'); } }); });
      if (localStorage.getItem('nasq-sidebar-collapsed') === '1') document.getElementById('sidebar').classList.add('collapsed');
      document.addEventListener('click', event => { const route = event.target.closest('[data-route]'); if (route && route.tagName === 'A' && window.innerWidth <= 820) document.getElementById('sidebar').classList.remove('mobile-open'); });
      window.addEventListener('hashchange', render);
      window.addEventListener('keydown', event => { if ((event.metaKey || event.ctrlKey) && event.key.toLowerCase() === 'k') { event.preventDefault(); go('/search'); } if (event.key === 'Escape') document.getElementById('sidebar').classList.remove('mobile-open'); });
      syncSidebarControls();
      render();
    })();
  </script>
</body>
</html>
