[project]
name = "nasq-ai-service"
version = "0.1.0"
description = "Nasq AI: the isolated agent service (LangGraph). It holds no Nasq credential; it decides and waits."
requires-python = ">=3.12"
license = { text = "LGPL-3.0-or-later" }
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "pydantic>=2.7",
  "langgraph>=1.0",
  "langgraph-checkpoint-postgres>=2.0",
  "langchain-core>=1.0",
  "langchain-anthropic>=1.0",
  "langchain-openai>=1.0",
  "langchain-ollama>=1.0",
  "psycopg[binary,pool]>=3.2",
  "jsonschema>=4.21",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.24", "httpx>=0.27", "ruff>=0.6"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"
line-length = 150

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["E501"]  # one-line request/response fixtures read better unwrapped
