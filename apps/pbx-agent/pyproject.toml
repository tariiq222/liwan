[project]
name = "liwan-pbx-agent"
version = "0.1.0"
description = "LiwanOS telephony: the per-company Asterisk agent (ARI events, Odoo delivery, recordings)."
requires-python = ">=3.9"
license = { text = "LGPL-3.0-or-later" }
dependencies = [
  "fastapi>=0.115",
  "psycopg[binary]>=3.2",
  "uvicorn>=0.30",
  "websockets>=15",
]

[project.optional-dependencies]
dev = ["httpx>=0.27", "ruff>=0.6"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
target-version = "py39"
line-length = 150

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]
