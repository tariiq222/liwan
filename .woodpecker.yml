# Woodpecker CI — the project's only CI system (GitHub Actions was removed).
# Runs against the local instance; the pipeline is also valid on any
# Woodpecker deployment with a Docker backend.
#
# Steps, in order (Woodpecker runs steps sequentially unless depends_on says
# otherwise; the heavy jobs would exhaust a single small agent in parallel):
#   prepare       normalise workspace ownership/permissions after clone
#   static        lint, python tools, contracts, web unit tests, type check
#   control-plane control service/worker contracts against PostgreSQL
#   odoo          full Odoo test suite on a fresh scratch database
#   upgrade       install the previous release tag, then upgrade to this commit
#   restore-drill backup, restore, and prove the negative restore case
#   image         build the Odoo image and install every pillar inside it
#   e2e-mock      built Nuxt against the mock API, then Playwright
#
# The control-plane live-PG suites share one scratch database and must run with
# --no-file-parallelism (parallel runs conflict, verified locally).
when:
  event: [push, manual, pull_request]
  branch: main

clone:
  git:
    image: woodpeckerci/plugin-git
    settings:
      # upgrade diffs against a release tag and ui_policy diffs against a
      # recorded baseline 183 commits back; a shallow/partial clone cannot
      # resolve either.
      depth: 0
      partial: false

steps:
  - name: prepare
    image: node:22-bookworm
    commands:
      # The clone step writes the workspace with a permissive umask (files
      # 0666, dirs 0777) and uid 1000, while step containers run as root with
      # umask 0022. The managed CLI's operator-file safety checks reject
      # group/other-writable files (st_mode & 0o022) and foreign owners
      # (st_uid == getuid), so normalise both after clone.
      - chown -R root:root /woodpecker/src
      - find /woodpecker/src -type d -exec chmod go-w {} +
      - find /woodpecker/src -type f -exec chmod go-w {} +

  - name: static
    image: node:22-bookworm
    commands:
      - apt-get update -qq && apt-get install -y -qq python3 python3-pip >/dev/null
      - pip3 install --break-system-packages --quiet --retries 5 --timeout 60 ruff==0.16.3
      - ruff check odoo-addons
      - python3 -B -m unittest discover -s deploy -p 'test_*.py'
      - python3 -B tools/catalog_check.py
      - python3 -B tools/migration_guard.py --base origin/main
      - npm ci --ignore-scripts
      - npm -w apps/web run postinstall
      # governanceDesign.test.ts launches a real headless Chromium.
      - npx playwright install --with-deps chromium
      - npm test
      - npm -w apps/web run lint

  - name: control-plane
    image: node:22-bookworm
    commands:
      - apt-get update -qq && apt-get install -y -qq postgresql >/dev/null
      - pg_ctlcluster 15 main start
      - su postgres -c "psql -qc \"CREATE USER nasq_test WITH SUPERUSER PASSWORD 'odoo'\""
      - su postgres -c "createdb -O nasq_test nasq_control_scratch_ci"
      - export CONTROL_TEST_DATABASE_URL="postgres://nasq_test:odoo@127.0.0.1:5432/nasq_control_scratch_ci"
      - npm -w packages/commercial-contracts run test
      - npm -w apps/control-plane test -- --no-file-parallelism
      - npm -w packages/commercial-contracts run build
      - npm -w apps/control-plane run build

  - name: odoo
    image: python:3.12-bookworm
    commands:
      - apt-get update -qq && apt-get install -y -qq --no-install-recommends libpq-dev libldap2-dev libsasl2-dev postgresql git >/dev/null
      - pg_ctlcluster 15 main start
      - su postgres -c "psql -qc \"CREATE USER odoo WITH SUPERUSER PASSWORD 'odoo'\""
      - git clone --depth=1 --branch "$(cat deploy/odoo/ODOO_COMMIT)" https://github.com/odoo/odoo.git _odoo || (git clone https://github.com/odoo/odoo.git _odoo && git -C _odoo checkout "$(cat deploy/odoo/ODOO_COMMIT)")
      - pip install --quiet --retries 5 --timeout 60 -r deploy/odoo/requirements-python312-linux.txt
      - export NASQ_COMMERCIAL_CONFIG=/tmp/odoo-classification.json
      - python3 deploy/classification.py fixture --database "nasq_ci_scratch_${CI_PIPELINE_NUMBER}" --mode saas --output "$NASQ_COMMERCIAL_CONFIG"
      - |
        python _odoo/odoo-bin \
          --db_host=127.0.0.1 --db_port=5432 --db_user=odoo --db_password=odoo \
          --addons-path="$PWD/_odoo/addons,$PWD/odoo-addons" \
          -d "nasq_ci_scratch_${CI_PIPELINE_NUMBER}" \
          -i nasq_core,nasq_platform,nasq_api,nasq_pmo,nasq_hr,nasq_chat \
          --test-tags /nasq_core,/nasq_platform,/nasq_api,/nasq_pmo,/nasq_hr,/nasq_chat \
          --http-port=8169 --stop-after-init --log-level=test 2>&1 | tee odoo-test.log
      - |
        grep -Eq 'odoo.tests.result: 0 failed, 0 error\(s\) of [1-9][0-9]* tests when loading database' odoo-test.log

  - name: upgrade
    image: python:3.12-bookworm
    commands:
      - apt-get update -qq && apt-get install -y -qq --no-install-recommends libpq-dev libldap2-dev libsasl2-dev postgresql git >/dev/null
      - pg_ctlcluster 15 main start
      - su postgres -c "psql -qc \"CREATE USER odoo WITH SUPERUSER PASSWORD 'odoo'\""
      - git clone --depth=1 --branch "$(cat deploy/odoo/ODOO_COMMIT)" https://github.com/odoo/odoo.git _odoo || (git clone https://github.com/odoo/odoo.git _odoo && git -C _odoo checkout "$(cat deploy/odoo/ODOO_COMMIT)")
      - pip install --quiet --retries 5 --timeout 60 -r deploy/odoo/requirements-python312-linux.txt
      - export ODOO_DB_ARGS="--db_host=127.0.0.1 --db_port=5432 --db_user=odoo --db_password=odoo"
      - export MODULES="nasq_core,nasq_platform,nasq_api,nasq_pmo,nasq_hr,nasq_chat"
      - export BASE_TAG="$(git tag --list 'release/*' --sort=-v:refname | head -n1)"
      - test -n "$BASE_TAG" || { echo "no release/* tag; upgrade job skipped"; exit 0; }
      - git worktree add _baseline "$BASE_TAG"
      # Install the previous release
      - |
        if [ -n "${NASQ_COMMERCIAL_CONFIG:-}" ]; then
          echo "previous release must not inherit a commercial classification" >&2
          exit 1
        fi
        python _odoo/odoo-bin $ODOO_DB_ARGS --addons-path="$PWD/_odoo/addons,$PWD/_baseline/odoo-addons" \
          -d nasq_ci_upgrade_scratch -i "$MODULES" --without-demo=all --http-port=8169 --stop-after-init
      # Upgrade to this commit
      - python3 deploy/classification.py fixture --database nasq_ci_upgrade_scratch --mode saas --output /tmp/upgrade-classification.json
      - export NASQ_COMMERCIAL_CONFIG=/tmp/upgrade-classification.json
      - |
        python _odoo/odoo-bin $ODOO_DB_ARGS --addons-path="$PWD/_odoo/addons,$PWD/odoo-addons" \
          -d nasq_ci_upgrade_scratch -u "$MODULES" --http-port=8169 --stop-after-init 2>&1 | tee upgrade.log
      - python3 -B tools/upgrade_log_guard.py upgrade.log
      # Post-upgrade smoke
      - |
        python _odoo/odoo-bin shell $ODOO_DB_ARGS --addons-path="$PWD/_odoo/addons,$PWD/odoo-addons" \
          -d nasq_ci_upgrade_scratch --http-port=8169 --no-http < deploy/odoo/upgrade_smoke.py | tee smoke.log
      - grep -q UPGRADE_SMOKE_OK smoke.log

  - name: restore-drill
    image: python:3.12-bookworm
    commands:
      - apt-get update -qq && apt-get install -y -qq --no-install-recommends libpq-dev libldap2-dev libsasl2-dev postgresql git curl >/dev/null
      - pg_ctlcluster 15 main start
      - su postgres -c "psql -qc \"CREATE USER odoo WITH SUPERUSER PASSWORD 'odoo'\""
      - git clone --depth=1 --branch "$(cat deploy/odoo/ODOO_COMMIT)" https://github.com/odoo/odoo.git _odoo || (git clone https://github.com/odoo/odoo.git _odoo && git -C _odoo checkout "$(cat deploy/odoo/ODOO_COMMIT)")
      - pip install --quiet --retries 5 --timeout 60 -r deploy/odoo/requirements-python312-linux.txt
      - |
        set -euo pipefail
        export PGPASSWORD=odoo
        B=$(dirname "$(readlink -f "$(command -v pg_dump)")"); W=$(mktemp -d)
        cleanup() {
          if [ -n "${SERVER_PID:-}" ]; then kill "$SERVER_PID" 2>/dev/null || true; wait "$SERVER_PID" 2>/dev/null || true; fi
          for db in nasq_drill_src_scratch nasq_drill_restored_scratch nasq_drill_restored2_scratch; do
            "$B/dropdb" -h 127.0.0.1 -U odoo --if-exists "$db"
          done
          rm -rf "$W"
        }
        trap cleanup EXIT
        export NASQ_COMMERCIAL_CONFIG="$W/restore-classification.json"
        python3 deploy/classification.py fixture --database nasq_drill_src_scratch --mode non_saas --output "$NASQ_COMMERCIAL_CONFIG"
        python _odoo/odoo-bin --db_host=127.0.0.1 --db_user=odoo --db_password=odoo \
          --addons-path="$PWD/_odoo/addons,$PWD/odoo-addons" --data-dir="$W/data" \
          -d nasq_drill_src_scratch -i nasq_core,nasq_platform,nasq_api,nasq_pmo,nasq_hr,nasq_chat \
          --without-demo=all --http-port=8169 --stop-after-init
        python3 deploy/backup.py --opt-in MANUAL_BACKUP_OPT_IN --acknowledge-unverified CANDIDATE_BACKUP_UNVERIFIED \
          --db-name nasq_drill_src_scratch --filestore "$W/data/filestore/nasq_drill_src_scratch" \
          --output-dir "$W/backup" --pg-dump "$B/pg_dump" --pg-host 127.0.0.1 --pg-user odoo
        cp "$W/backup/manifest.json" "$W/original-manifest.json"
        verify() { python3 deploy/restore_verify.py --backup-dir "$W/backup" --target-db "$1" \
          --target-filestore "$W/restored/filestore/$1" --pg-restore "$B/pg_restore" --createdb "$B/createdb" \
          --psql "$B/psql" --pg-host 127.0.0.1 --pg-user odoo; }
        verify nasq_drill_restored_scratch
        # Classified restored databases must start without a mapping or billing service.
        unset NASQ_COMMERCIAL_CONFIG
        python _odoo/odoo-bin --db_host=127.0.0.1 --db_user=odoo --db_password=odoo \
          --addons-path="$PWD/_odoo/addons,$PWD/odoo-addons" --data-dir="$W/restored" \
          -d nasq_drill_restored_scratch --http-port=8169 --max-cron-threads=0 > restored-odoo.log 2>&1 &
        SERVER_PID=$!
        for i in $(seq 1 60); do
          kill -0 "$SERVER_PID"
          if curl -fsS http://127.0.0.1:8169/web/health >/dev/null; then break; fi
          sleep 1
        done
        curl -fsS -o /dev/null -w '%{http_code}\n' http://127.0.0.1:8169/web/health
        kill "$SERVER_PID"; wait "$SERVER_PID" || true; SERVER_PID=
        missing=$("$B/psql" -h 127.0.0.1 -U odoo -d nasq_drill_restored_scratch -At -v ON_ERROR_STOP=1 \
          -c 'SELECT store_fname FROM ir_attachment WHERE store_fname IS NOT NULL ORDER BY store_fname LIMIT 1')
        test -n "$missing"
        rm "$W/backup/filestore/$missing"
        if verify nasq_drill_restored2_scratch; then echo "negative case passed unexpectedly"; exit 1; fi
        python3 -c 'import json,sys; r=json.load(open(sys.argv[1])); assert r["restore_verified"] is False; assert sys.argv[2] in r["checks"]["missing_attachment_files"]' "$W/backup/restore-verification.json" "$missing"
        cmp "$W/original-manifest.json" "$W/backup/manifest.json"

  - name: e2e-mock
    image: node:22-bookworm
    commands:
      - apt-get update -qq && apt-get install -y -qq curl >/dev/null
      - npm -w apps/web run postinstall
      - cd apps/web
      - npx playwright install --with-deps chromium
      - |
        set -euo pipefail
        test -s e2e/ci-mock-specs.txt
        export PROJECTS_UI_PREVIEW=1 MODULE_UI_PREVIEW=1 MOCK_PORT=4498
        export NUXT_ODOO_URL=http://127.0.0.1:4498 NUXT_ODOO_DB=nasq_ui_mock_only
        export NUXT_PUBLIC_WS_URL=ws://127.0.0.1:4498/websocket
        export E2E_BASE_URL=http://localhost:4097 E2E_PROJECT_POPUPS=1
        node e2e/internal-ui-audit-mock.mjs > mock.log 2>&1 &
        MOCK_PID=$!
        cleanup() {
          if [ -n "${SERVER_PID:-}" ]; then kill "$SERVER_PID" 2>/dev/null || true; wait "$SERVER_PID" 2>/dev/null || true; fi
          kill "$MOCK_PID" 2>/dev/null || true; wait "$MOCK_PID" 2>/dev/null || true
        }
        trap cleanup EXIT
        npx nuxt build
        PORT=4097 node .output/server/index.mjs > nuxt.log 2>&1 &
        SERVER_PID=$!
        for i in $(seq 1 60); do
          kill -0 "$MOCK_PID" "$SERVER_PID"
          if curl -fs http://localhost:4097/login >/dev/null; then break; fi
          sleep 2
        done
        curl -fs http://localhost:4097/login >/dev/null
        npx playwright test $(sed 's#^#e2e/#' e2e/ci-mock-specs.txt | tr '\n' ' ')
