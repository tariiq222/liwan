# Woodpecker CI — local backend pipeline for macOS.
# GitHub Actions was removed; this is the project's only CI system.
#
# Designed for WOODPECKER_BACKEND=local on macOS arm64.
# The `image` field specifies the shell, not a container image.
# All tools (node, python3, ruff, psql, docker, git) must exist on the host.
#
# Steps: static, control-plane, odoo, upgrade, restore-drill, image, e2e-mock.
#
# The control-plane live-PG suites share one scratch database. They run serially
# by design (apps/control-plane `test` sets --no-file-parallelism and a 60s hook
# timeout); parallel runs conflict because the suites TRUNCATE the same tables.
when:
  event: [push, manual, pull_request]
  branch: main

steps:
  - name: static
    image: bash
    commands:
      - set -euo pipefail
      - export PATH="/opt/homebrew/bin:/usr/local/bin:$PATH"
      # plugin-git may produce a shallow clone on the local backend; ui_policy needs full history.
      - if git rev-parse --is-shallow-repository | grep -q true; then git fetch --unshallow origin; fi
      - ruff check odoo-addons
      - python3 -B -m unittest discover -s deploy -p 'test_*.py'
      - python3 -B tools/catalog_check.py
      - python3 -B tools/migration_guard.py --base origin/main
      - npm ci --ignore-scripts
      - npm -w apps/web run postinstall
      - npx playwright install chromium
      - npm test
      - npm -w apps/web run lint

  - name: control-plane
    image: bash
    commands:
      - set -euo pipefail
      - export PATH="/opt/homebrew/bin:/usr/local/bin:$PATH"
      # plugin-git may produce a shallow clone on the local backend; ui_policy needs full history.
      - if git rev-parse --is-shallow-repository | grep -q true; then git fetch --unshallow origin; fi
      - export CONTROL_TEST_DATABASE_URL="postgres://nasq_test:odoo@127.0.0.1:5432/nasq_control_scratch_ci"
      - PGPASSWORD=odoo dropdb -h 127.0.0.1 -U nasq_test --if-exists nasq_control_scratch_ci || true
      - PGPASSWORD=odoo createdb -h 127.0.0.1 -U nasq_test nasq_control_scratch_ci
      - npm -w packages/commercial-contracts run test
      - npm -w apps/control-plane test
      - npm -w packages/commercial-contracts run build
      - npm -w apps/control-plane run build

  - name: odoo
    image: bash
    commands:
      - |
        set -euo pipefail
        export PATH="/opt/homebrew/bin:/usr/local/bin:$PATH"
        ODOO_ROOT="/Users/tariq/code/odoo"
        ODOO_PYTHON="$ODOO_ROOT/.venv/bin/python"
        ODOO_COMMIT="$(cat deploy/odoo/ODOO_COMMIT)"
        SCRATCH_DB="nasq_ci_scratch_${CI_PIPELINE_NUMBER}"
        SCRATCH_ROOT="$(mktemp -d)"
        mkdir -p "$SCRATCH_ROOT/data" "$SCRATCH_ROOT/logs"
        cleanup() { PGPASSWORD=odoo dropdb -h 127.0.0.1 -U odoo --if-exists "$SCRATCH_DB" 2>/dev/null || true; rm -rf "$SCRATCH_ROOT"; }
        trap cleanup EXIT
        PGPASSWORD=odoo dropdb -h 127.0.0.1 -U odoo --if-exists "$SCRATCH_DB" || true
        if [ ! -d "$SCRATCH_ROOT/_odoo/.git" ]; then git clone https://github.com/odoo/odoo.git "$SCRATCH_ROOT/_odoo" && git -C "$SCRATCH_ROOT/_odoo" checkout "$ODOO_COMMIT"; fi
        export NASQ_COMMERCIAL_CONFIG="$SCRATCH_ROOT/odoo-classification.json"
        python3 deploy/classification.py fixture --database "$SCRATCH_DB" --mode saas --output "$NASQ_COMMERCIAL_CONFIG"
        "$ODOO_PYTHON" "$ODOO_ROOT/odoo-bin" \
          --addons-path="$ODOO_ROOT/odoo/addons,$ODOO_ROOT/addons,$PWD/odoo-addons" \
          --db_host=127.0.0.1 --db_port=5432 --db_user=odoo --db_password=odoo \
          -d "$SCRATCH_DB" --db-filter="^${SCRATCH_DB}$" \
          --data-dir="$SCRATCH_ROOT/data" --logfile="$SCRATCH_ROOT/logs/odoo.log" \
          -i nasq_core,nasq_platform,nasq_api,nasq_pmo,nasq_hr,nasq_chat \
          --test-tags /nasq_core,/nasq_platform,/nasq_api,/nasq_pmo,/nasq_hr,/nasq_chat \
          --http-port=8169 --workers=0 --max-cron-threads=0 --stop-after-init --log-level=test 2>&1 | tee "$SCRATCH_ROOT/odoo-test.log"
        grep -Eq 'odoo.tests.result: 0 failed, 0 error\(s\) of [1-9][0-9]* tests when loading database' "$SCRATCH_ROOT/odoo-test.log"

  - name: upgrade
    image: bash
    commands:
      - |
        set -euo pipefail
        export PATH="/opt/homebrew/bin:/usr/local/bin:$PATH"
        ODOO_ROOT="/Users/tariq/code/odoo"
        ODOO_PYTHON="$ODOO_ROOT/.venv/bin/python"
        ODOO_COMMIT="$(cat deploy/odoo/ODOO_COMMIT)"
        MODULES="nasq_core,nasq_platform,nasq_api,nasq_pmo,nasq_hr,nasq_chat"
        BASE_TAG="$(git tag --list 'release/*' --sort=-v:refname | head -n1)"
        test -n "$BASE_TAG" || { echo "no release/* tag; upgrade job skipped"; exit 0; }
        SCRATCH_DB="nasq_ci_upgrade_scratch"
        SCRATCH_ROOT="$(mktemp -d)"
        mkdir -p "$SCRATCH_ROOT/data" "$SCRATCH_ROOT/logs"
        cleanup() { PGPASSWORD=odoo dropdb -h 127.0.0.1 -U odoo --if-exists "$SCRATCH_DB" 2>/dev/null || true; rm -rf "$SCRATCH_ROOT"; git worktree remove _baseline --force 2>/dev/null || true; }
        trap cleanup EXIT
        PGPASSWORD=odoo dropdb -h 127.0.0.1 -U odoo --if-exists "$SCRATCH_DB" || true
        if [ ! -d "$SCRATCH_ROOT/_odoo/.git" ]; then git clone https://github.com/odoo/odoo.git "$SCRATCH_ROOT/_odoo" && git -C "$SCRATCH_ROOT/_odoo" checkout "$ODOO_COMMIT"; fi
        ODOO_DB_ARGS="--db_host=127.0.0.1 --db_port=5432 --db_user=odoo --db_password=odoo"
        git worktree add _baseline "$BASE_TAG"
        # Install the previous release
        if [ -n "${NASQ_COMMERCIAL_CONFIG:-}" ]; then
          echo "previous release must not inherit a commercial classification" >&2
          exit 1
        fi
        "$ODOO_PYTHON" "$SCRATCH_ROOT/_odoo/odoo-bin" $ODOO_DB_ARGS \
          --addons-path="$SCRATCH_ROOT/_odoo/addons,$PWD/_baseline/odoo-addons" \
          --data-dir="$SCRATCH_ROOT/data" --logfile="$SCRATCH_ROOT/logs/odoo.log" \
          -d "$SCRATCH_DB" -i "$MODULES" --without-demo=all --http-port=8169 --workers=0 --max-cron-threads=0 --stop-after-init
        # Upgrade to this commit
        python3 deploy/classification.py fixture --database "$SCRATCH_DB" --mode saas --output "$SCRATCH_ROOT/upgrade-classification.json"
        export NASQ_COMMERCIAL_CONFIG="$SCRATCH_ROOT/upgrade-classification.json"
        "$ODOO_PYTHON" "$SCRATCH_ROOT/_odoo/odoo-bin" $ODOO_DB_ARGS \
          --addons-path="$SCRATCH_ROOT/_odoo/addons,$PWD/odoo-addons" \
          --data-dir="$SCRATCH_ROOT/data" --logfile="$SCRATCH_ROOT/logs/upgrade.log" \
          -d "$SCRATCH_DB" -u "$MODULES" --http-port=8169 --workers=0 --max-cron-threads=0 --stop-after-init 2>&1 | tee "$SCRATCH_ROOT/upgrade-output.log"
        python3 -B tools/upgrade_log_guard.py "$SCRATCH_ROOT/upgrade-output.log"
        # Post-upgrade smoke
        "$ODOO_PYTHON" "$SCRATCH_ROOT/_odoo/odoo-bin" shell $ODOO_DB_ARGS \
          --addons-path="$SCRATCH_ROOT/_odoo/addons,$PWD/odoo-addons" \
          -d "$SCRATCH_DB" --http-port=8169 --no-http < deploy/odoo/upgrade_smoke.py | tee "$SCRATCH_ROOT/smoke.log"
        grep -q UPGRADE_SMOKE_OK "$SCRATCH_ROOT/smoke.log"

  - name: restore-drill
    image: bash
    commands:
      - |
        set -euo pipefail
        export PATH="/opt/homebrew/bin:/usr/local/bin:$PATH"
        ODOO_ROOT="/Users/tariq/code/odoo"
        ODOO_PYTHON="$ODOO_ROOT/.venv/bin/python"
        ODOO_COMMIT="$(cat deploy/odoo/ODOO_COMMIT)"
        W="$(mktemp -d)"
        mkdir -p "$W/data" "$W/restored" "$W/logs"
        SRC_DB="nasq_drill_src_scratch"
        RST_DB="nasq_drill_restored_scratch"
        RST2_DB="nasq_drill_restored2_scratch"
        cleanup() {
          if [ -n "${SERVER_PID:-}" ]; then kill "$SERVER_PID" 2>/dev/null || true; wait "$SERVER_PID" 2>/dev/null || true; fi
          for db in "$SRC_DB" "$RST_DB" "$RST2_DB"; do PGPASSWORD=odoo dropdb -h 127.0.0.1 -U odoo --if-exists "$db" 2>/dev/null || true; done
          rm -rf "$W"
        }
        trap cleanup EXIT
        for db in "$SRC_DB" "$RST_DB" "$RST2_DB"; do PGPASSWORD=odoo dropdb -h 127.0.0.1 -U odoo --if-exists "$db" || true; done
        if [ ! -d "$W/_odoo/.git" ]; then git clone https://github.com/odoo/odoo.git "$W/_odoo" && git -C "$W/_odoo" checkout "$ODOO_COMMIT"; fi
        export PGPASSWORD=odoo
        B="$(dirname "$(readlink -f "$(command -v pg_dump)")")"
        export NASQ_COMMERCIAL_CONFIG="$W/restore-classification.json"
        python3 deploy/classification.py fixture --database "$SRC_DB" --mode non_saas --output "$NASQ_COMMERCIAL_CONFIG"
        "$ODOO_PYTHON" "$W/_odoo/odoo-bin" --db_host=127.0.0.1 --db_user=odoo --db_password=odoo \
          --addons-path="$W/_odoo/addons,$PWD/odoo-addons" --data-dir="$W/data" \
          -d "$SRC_DB" -i nasq_core,nasq_platform,nasq_api,nasq_pmo,nasq_hr,nasq_chat \
          --without-demo=all --http-port=8169 --workers=0 --max-cron-threads=0 --stop-after-init
        python3 deploy/backup.py --opt-in MANUAL_BACKUP_OPT_IN --acknowledge-unverified CANDIDATE_BACKUP_UNVERIFIED \
          --db-name "$SRC_DB" --filestore "$W/data/filestore/$SRC_DB" \
          --output-dir "$W/backup" --pg-dump "$B/pg_dump" --pg-host 127.0.0.1 --pg-user odoo
        cp "$W/backup/manifest.json" "$W/original-manifest.json"
        verify() { python3 deploy/restore_verify.py --backup-dir "$W/backup" --target-db "$1" \
          --target-filestore "$W/restored/filestore/$1" --pg-restore "$B/pg_restore" --createdb "$B/createdb" \
          --psql "$B/psql" --pg-host 127.0.0.1 --pg-user odoo; }
        verify "$RST_DB"
        # Classified restored databases must start without a mapping or billing service.
        unset NASQ_COMMERCIAL_CONFIG
        "$ODOO_PYTHON" "$W/_odoo/odoo-bin" --db_host=127.0.0.1 --db_user=odoo --db_password=odoo \
          --addons-path="$W/_odoo/addons,$PWD/odoo-addons" --data-dir="$W/restored" \
          -d "$RST_DB" --http-port=8169 --workers=0 --max-cron-threads=0 > "$W/restored-odoo.log" 2>&1 &
        SERVER_PID=$!
        for i in $(seq 1 60); do
          kill -0 "$SERVER_PID"
          if curl -fsS http://127.0.0.1:8169/web/health >/dev/null; then break; fi
          sleep 1
        done
        curl -fsS -o /dev/null -w '%{http_code}\n' http://127.0.0.1:8169/web/health
        kill "$SERVER_PID"; wait "$SERVER_PID" || true; SERVER_PID=
        missing="$(psql -h 127.0.0.1 -U odoo -d "$RST_DB" -At -v ON_ERROR_STOP=1 -c 'SELECT store_fname FROM ir_attachment WHERE store_fname IS NOT NULL ORDER BY store_fname LIMIT 1')"
        test -n "$missing"
        rm "$W/backup/filestore/$missing"
        if verify "$RST2_DB"; then echo "negative case passed unexpectedly"; exit 1; fi
        python3 -c 'import json,sys; r=json.load(open(sys.argv[1])); assert r["restore_verified"] is False; assert sys.argv[2] in r["checks"]["missing_attachment_files"]' "$W/backup/restore-verification.json" "$missing"
        cmp "$W/original-manifest.json" "$W/backup/manifest.json"

  - name: image
    image: bash
    commands:
      - |
        set -euo pipefail
        export PATH="/opt/homebrew/bin:/usr/local/bin:$PATH"
        docker info
        docker build -f deploy/odoo/Dockerfile --build-arg ODOO_COMMIT="$(cat deploy/odoo/ODOO_COMMIT)" --build-arg NASQ_REVISION="${CI_COMMIT_SHA:0:12}" -t nasq-odoo:ci .
        SCRATCH_DB="nasq_image_scratch"
        cleanup() { docker rm -fv db 2>/dev/null || true; docker network rm t 2>/dev/null || true; PGPASSWORD=odoo dropdb -h 127.0.0.1 -U odoo --if-exists "$SCRATCH_DB" 2>/dev/null || true; }
        trap cleanup EXIT
        PGPASSWORD=odoo dropdb -h 127.0.0.1 -U odoo --if-exists "$SCRATCH_DB" || true
        python3 deploy/classification.py fixture --database "$SCRATCH_DB" --mode non_saas --output /tmp/image-classification.json
        docker network create t
        docker run -d --name db --network t -e POSTGRES_USER=odoo -e POSTGRES_PASSWORD=odoo -e POSTGRES_DB=postgres postgres:16
        printf '%s\n' '[options]' 'db_host = db' 'db_user = odoo' 'db_password = odoo' 'list_db = False' > /tmp/odoo.conf
        for i in $(seq 1 30); do docker exec db pg_isready -U odoo && break; sleep 2; done
        docker run --rm --network t -v /tmp/odoo.conf:/etc/odoo/odoo.conf:ro \
          -v /tmp/image-classification.json:/run/nasq/classification.json:ro \
          -e NASQ_COMMERCIAL_CONFIG=/run/nasq/classification.json nasq-odoo:ci \
          -d "$SCRATCH_DB" -i nasq_core,nasq_platform,nasq_api,nasq_pmo,nasq_hr,nasq_chat --without-demo=all --http-port=8169 --stop-after-init
        docker run --rm --entrypoint sh nasq-odoo:ci -c 'test ! -w /opt/nasq/addons && test "$(id -u)" = 10001 && ! command -v git'

  - name: e2e-mock
    image: bash
    commands:
      - |
        set -euo pipefail
        export PATH="/opt/homebrew/bin:/usr/local/bin:$PATH"
        npm -w apps/web run postinstall
        cd apps/web
        npx playwright install chromium
        test -s e2e/ci-mock-specs.txt
        export PROJECTS_UI_PREVIEW=1 MODULE_UI_PREVIEW=1 MOCK_PORT=4498
        export NUXT_ODOO_URL=http://127.0.0.1:4498 NUXT_ODOO_DB=nasq_ui_mock_only
        export NUXT_PUBLIC_WS_URL=ws://127.0.0.1:4498/websocket
        export E2E_BASE_URL=http://localhost:4097 E2E_PROJECT_POPUPS=1
        node e2e/internal-ui-audit-mock.mjs > mock.log 2>&1 &
        MOCK_PID=$!
        cleanup() {
          if [ -n "${SERVER_PID:-}" ]; then kill "$SERVER_PID" 2>/dev/null || true; wait "$SERVER_PID" 2>/dev/null || true; fi
          kill "$MOCK_PID" 2>/dev/null || true; wait "$MOCK_PID" 2>/dev/null || true
        }
        trap cleanup EXIT
        npx nuxt build
        PORT=4097 node .output/server/index.mjs > nuxt.log 2>&1 &
        SERVER_PID=$!
        for i in $(seq 1 60); do
          kill -0 "$MOCK_PID" "$SERVER_PID"
          if curl -fs http://localhost:4097/login >/dev/null; then break; fi
          sleep 2
        done
        curl -fs http://localhost:4097/login >/dev/null
        npx playwright test $(sed 's#^#e2e/#' e2e/ci-mock-specs.txt | tr '\n' ' ')
