# Woodpecker CI — local backend pipeline for macOS.
# GitHub Actions was removed; this is the project's only CI system.
#
# Designed for WOODPECKER_BACKEND=local on macOS arm64.
# The `image` field specifies the shell, not a container image.
# All tools (node, python3, ruff, psql, docker, git) must exist on the host.
#
# Woodpecker substitutes every braced variable reference in this file before the shell runs it (an
# undefined name becomes empty), so a shell brace expansion is written with a doubled dollar sign;
# braced CI_-prefixed names are Woodpecker's own.
#
# Steps: static, ai-service, control-plane, vendor-admin, odoo, odoo-tasks-standalone, odoo-tasks-bridge, upgrade, restore-drill, image, e2e-mock, rtl-stories.
#
# The control-plane live-PG suites run serially by design (apps/control-plane `test`
# sets --no-file-parallelism and a 60s hook timeout); parallel runs conflict because
# the suites TRUNCATE the same tables. Some suites pin their own database name, so
# deploy/control-plane/ci-test.sh provisions webvue_control_scratch_{ci,payfinal,restorec,analytics}.
when:
  event: [push, manual, pull_request]
  branch: main

steps:
  - name: static
    image: bash
    environment: &ci_environment
      WEBVUE_CI_RUN_DIR: ${WEBVUE_CI_RUN_DIR}
    commands:
      - set -euo pipefail
      - export PATH="/opt/homebrew/bin:/usr/local/bin:$PATH"
      - source deploy/woodpecker/stage.sh static
      # plugin-git may produce a shallow clone on the local backend; ui_policy needs full history.
      - if git rev-parse --is-shallow-repository | grep -q true; then git fetch --unshallow origin; fi
      - ruff check odoo-addons
      - python3 -B -m unittest discover -s deploy -p 'test_*.py'
      - python3 -B -m unittest deploy/woodpecker/test_stage.py
      - python3 -B -m unittest tools/shared_saas_lifecycle/test_*.py
      - python3 -B tools/catalog_check.py
      - python3 -B tools/migration_guard.py --base "${CI_PREV_COMMIT_SHA:-origin/main}"
      - python3 -B tools/git_policy.py --base "${CI_PREV_COMMIT_SHA:-origin/main}"
      - python3 -B tools/arch_policy.py --base "${CI_PREV_COMMIT_SHA:-origin/main}"
      - python3 -B tools/semgrep_gate.py --base "${CI_PREV_COMMIT_SHA:-origin/main}"
      - npm ci --ignore-scripts
      - npm -w apps/web run postinstall
      - npm -w apps/vendor-admin run postinstall
      - npx playwright install chromium
      - npm test
      - npm -w apps/web run lint

  - name: ai-service
    image: bash
    environment: *ci_environment
    commands:
      - set -euo pipefail
      - export PATH="/opt/homebrew/bin:/usr/local/bin:$PATH"
      - source deploy/woodpecker/stage.sh ai-service
      - cd apps/ai-service
      - python3 -m venv .venv
      - .venv/bin/pip install --quiet -e '.[dev]'
      - .venv/bin/ruff check src tests
      # The Postgres state tests need a throwaway database, dropped on exit (the control-plane step's conventions).
      - |
        AI_DB="webvue_ai_ci_${CI_PIPELINE_NUMBER}"
        trap 'status=$?; dropdb -h "$PGHOST" -p "$PGPORT" -U "$PGUSER" --if-exists "$AI_DB"; ci_finish "$status"' EXIT
        dropdb -h "$PGHOST" -p "$PGPORT" -U "$PGUSER" --if-exists "$AI_DB"
        createdb -h "$PGHOST" -p "$PGPORT" -U "$PGUSER" "$AI_DB"
        AI_TEST_DATABASE_URL="postgresql://$PGUSER:$PGPASSWORD@$PGHOST:$PGPORT/$AI_DB" .venv/bin/pytest -q

  - name: control-plane
    image: bash
    environment: *ci_environment
    commands:
      - set -euo pipefail
      - export PATH="/opt/homebrew/bin:/usr/local/bin:$PATH"
      - source deploy/woodpecker/stage.sh control-plane
      # plugin-git may produce a shallow clone on the local backend; ui_policy needs full history.
      - if git rev-parse --is-shallow-repository | grep -q true; then git fetch --unshallow origin; fi
      # Creates the three scratch databases the live suites pin by name, runs them in
      # two groups, builds, and drops the databases (see the script header).
      - deploy/control-plane/ci-test.sh

  # The vendor admin app (apps/vendor-admin, port 3100): type check, unit tests and a production build. It is a separate
  # Nuxt application with its own layers (packages/ui, packages/commercial-ui), so the web steps do not cover it.
  - name: vendor-admin
    image: bash
    environment: *ci_environment
    commands:
      - set -euo pipefail
      - export PATH="/opt/homebrew/bin:/usr/local/bin:$PATH"
      - source deploy/woodpecker/stage.sh vendor-admin
      - npm ci --ignore-scripts
      - cd apps/vendor-admin
      - npx nuxt prepare
      - npm run lint
      - npm run test
      - npm run build

  - name: odoo
    image: bash
    environment: *ci_environment
    commands:
      - |
        set -euo pipefail
        export PATH="/opt/homebrew/bin:/usr/local/bin:$PATH"
        source deploy/woodpecker/stage.sh odoo
        SCRATCH_DB="webvue_ci_scratch_${CI_PIPELINE_NUMBER}"
        MODULES="$(python3 -B tools/catalog_check.py --release-modules)"
        TAGS="/$${MODULES//,/,/}"
        SCRATCH_ROOT="$(mktemp -d)"
        mkdir -p "$SCRATCH_ROOT/data" "$SCRATCH_ROOT/logs"
        cleanup() { dropdb -h "$PGHOST" -p "$PGPORT" -U "$PGUSER" --if-exists "$SCRATCH_DB" 2>/dev/null || true; rm -rf "$SCRATCH_ROOT"; }
        trap 'status=$?; cleanup; ci_finish "$status"' EXIT
        dropdb -h "$PGHOST" -p "$PGPORT" -U "$PGUSER" --if-exists "$SCRATCH_DB" || true
        export WEBVUE_COMMERCIAL_CONFIG="$SCRATCH_ROOT/odoo-classification.json"
        python3 deploy/classification.py fixture --database "$SCRATCH_DB" --mode saas --output "$WEBVUE_COMMERCIAL_CONFIG"
        "$ODOO_PYTHON" "$ODOO_ROOT/odoo-bin" \
          --addons-path="$ODOO_ROOT/odoo/addons,$ODOO_ROOT/addons,$PWD/odoo-addons" \
          --db_host="$PGHOST" --db_port="$PGPORT" --db_user="$PGUSER" \
          -d "$SCRATCH_DB" --db-filter="^$${SCRATCH_DB}$" \
          --data-dir="$SCRATCH_ROOT/data" --logfile="$SCRATCH_ROOT/logs/odoo.log" \
          -i "$MODULES" \
          --test-tags "$TAGS" \
          --http-port="$ODOO_PORT" --workers=0 --max-cron-threads=0 --stop-after-init --log-level=test 2>&1 | tee "$SCRATCH_ROOT/odoo-test.log"
        # --logfile keeps Odoo's log out of stdout, so the verdict is read from the logfile itself.
        grep -Eq 'odoo.tests.result: 0 failed, 0 error\(s\) of [1-9][0-9]* tests when loading database' "$SCRATCH_ROOT/logs/odoo.log" \
          || { echo "odoo tests did not report 0 failures; last log lines:" >&2; tail -n 80 "$SCRATCH_ROOT/logs/odoo.log" >&2; exit 1; }

  # The two steps below prove the non-release configurations of the tasks application. Their module
  # lists are hard-coded on purpose: the `odoo` step installs the whole release (where PMO's own record
  # rule hides the webvue_tasks company clause), these install only part of it. Distinct database names
  # and HTTP ports keep every Odoo step from colliding on one agent.
  # webvue_tasks ALONE: no webvue_pmo, hook defaults, no projects.
  - name: odoo-tasks-standalone
    image: bash
    environment: *ci_environment
    commands:
      - |
        set -euo pipefail
        export PATH="/opt/homebrew/bin:/usr/local/bin:$PATH"
        source deploy/woodpecker/stage.sh odoo-tasks-standalone
        SCRATCH_DB="webvue_scratch_ci_tasks_alone_${CI_PIPELINE_NUMBER}"
        MODULES="webvue_tasks"
        SCRATCH_ROOT="$(mktemp -d)"
        mkdir -p "$SCRATCH_ROOT/data" "$SCRATCH_ROOT/logs"
        cleanup() { dropdb -h "$PGHOST" -p "$PGPORT" -U "$PGUSER" --if-exists "$SCRATCH_DB" 2>/dev/null || true; rm -rf "$SCRATCH_ROOT"; }
        trap 'status=$?; cleanup; ci_finish "$status"' EXIT
        dropdb -h "$PGHOST" -p "$PGPORT" -U "$PGUSER" --if-exists "$SCRATCH_DB" || true
        export WEBVUE_COMMERCIAL_CONFIG="$SCRATCH_ROOT/odoo-classification.json"
        python3 deploy/classification.py fixture --database "$SCRATCH_DB" --mode saas --output "$WEBVUE_COMMERCIAL_CONFIG"
        "$ODOO_PYTHON" "$ODOO_ROOT/odoo-bin" \
          --addons-path="$ODOO_ROOT/odoo/addons,$ODOO_ROOT/addons,$PWD/odoo-addons" \
          --db_host="$PGHOST" --db_port="$PGPORT" --db_user="$PGUSER" \
          -d "$SCRATCH_DB" --db-filter="^$${SCRATCH_DB}$" \
          --data-dir="$SCRATCH_ROOT/data" --logfile="$SCRATCH_ROOT/logs/odoo.log" \
          -i "$MODULES" \
          --test-tags "/webvue_tasks" \
          --http-port="$TASKS_PORT" --workers=0 --max-cron-threads=0 --stop-after-init --log-level=test 2>&1 | tee "$SCRATCH_ROOT/odoo-test.log"
        # --logfile keeps Odoo's log out of stdout, so the verdict is read from the logfile itself.
        grep -Eq 'odoo.tests.result: 0 failed, 0 error\(s\) of [1-9][0-9]* tests when loading database' "$SCRATCH_ROOT/logs/odoo.log" \
          || { echo "odoo tests did not report 0 failures; last log lines:" >&2; tail -n 80 "$SCRATCH_ROOT/logs/odoo.log" >&2; exit 1; }
        grep -E 'odoo.tests.result:' "$SCRATCH_ROOT/logs/odoo.log" | tail -n 1
        # The standalone proof is void if the PMO addons came along: webvue_tasks must not pull them in.
        pmo_installed="$(psql -h "$PGHOST" -p "$PGPORT" -U "$PGUSER" -d "$SCRATCH_DB" -At -v ON_ERROR_STOP=1 -c "SELECT name FROM ir_module_module WHERE name IN ('webvue_pmo', 'webvue_tasks_pmo') AND state = 'installed' ORDER BY name")"
        echo "PMO addons installed (expected empty): '$pmo_installed'"
        test -z "$pmo_installed" || { echo "webvue_tasks alone installed PMO addons: $pmo_installed" >&2; exit 1; }
        tasks_state="$(psql -h "$PGHOST" -p "$PGPORT" -U "$PGUSER" -d "$SCRATCH_DB" -At -v ON_ERROR_STOP=1 -c "SELECT state FROM ir_module_module WHERE name = 'webvue_tasks'")"
        echo "webvue_tasks state: $tasks_state"
        test "$tasks_state" = installed || { echo "webvue_tasks state is '$tasks_state', expected installed" >&2; exit 1; }

  # webvue_tasks with the PMO bridge only (webvue_tasks_pmo auto-installs; its dependencies come along).
  - name: odoo-tasks-bridge
    image: bash
    environment: *ci_environment
    commands:
      - |
        set -euo pipefail
        export PATH="/opt/homebrew/bin:/usr/local/bin:$PATH"
        source deploy/woodpecker/stage.sh odoo-tasks-bridge
        SCRATCH_DB="webvue_scratch_ci_tasks_bridge_${CI_PIPELINE_NUMBER}"
        MODULES="webvue_tasks,webvue_pmo,webvue_tasks_pmo"
        SCRATCH_ROOT="$(mktemp -d)"
        mkdir -p "$SCRATCH_ROOT/data" "$SCRATCH_ROOT/logs"
        cleanup() { dropdb -h "$PGHOST" -p "$PGPORT" -U "$PGUSER" --if-exists "$SCRATCH_DB" 2>/dev/null || true; rm -rf "$SCRATCH_ROOT"; }
        trap 'status=$?; cleanup; ci_finish "$status"' EXIT
        dropdb -h "$PGHOST" -p "$PGPORT" -U "$PGUSER" --if-exists "$SCRATCH_DB" || true
        export WEBVUE_COMMERCIAL_CONFIG="$SCRATCH_ROOT/odoo-classification.json"
        python3 deploy/classification.py fixture --database "$SCRATCH_DB" --mode saas --output "$WEBVUE_COMMERCIAL_CONFIG"
        "$ODOO_PYTHON" "$ODOO_ROOT/odoo-bin" \
          --addons-path="$ODOO_ROOT/odoo/addons,$ODOO_ROOT/addons,$PWD/odoo-addons" \
          --db_host="$PGHOST" --db_port="$PGPORT" --db_user="$PGUSER" \
          -d "$SCRATCH_DB" --db-filter="^$${SCRATCH_DB}$" \
          --data-dir="$SCRATCH_ROOT/data" --logfile="$SCRATCH_ROOT/logs/odoo.log" \
          -i "$MODULES" \
          --test-tags "/webvue_tasks,/webvue_tasks_pmo" \
          --http-port="$BRIDGE_PORT" --workers=0 --max-cron-threads=0 --stop-after-init --log-level=test 2>&1 | tee "$SCRATCH_ROOT/odoo-test.log"
        # --logfile keeps Odoo's log out of stdout, so the verdict is read from the logfile itself.
        grep -Eq 'odoo.tests.result: 0 failed, 0 error\(s\) of [1-9][0-9]* tests when loading database' "$SCRATCH_ROOT/logs/odoo.log" \
          || { echo "odoo tests did not report 0 failures; last log lines:" >&2; tail -n 80 "$SCRATCH_ROOT/logs/odoo.log" >&2; exit 1; }
        grep -E 'odoo.tests.result:' "$SCRATCH_ROOT/logs/odoo.log" | tail -n 1
        # The bridge must have auto-installed with its two parents.
        bridge_state="$(psql -h "$PGHOST" -p "$PGPORT" -U "$PGUSER" -d "$SCRATCH_DB" -At -v ON_ERROR_STOP=1 -c "SELECT state FROM ir_module_module WHERE name = 'webvue_tasks_pmo'")"
        echo "webvue_tasks_pmo state: $bridge_state"
        test "$bridge_state" = installed || { echo "webvue_tasks_pmo state is '$bridge_state', expected installed" >&2; exit 1; }

  - name: upgrade
    image: bash
    environment: *ci_environment
    commands:
      - |
        set -euo pipefail
        export PATH="/opt/homebrew/bin:/usr/local/bin:$PATH"
        source deploy/woodpecker/stage.sh upgrade
        MODULES="$(python3 -B tools/catalog_check.py --release-modules)"
        BASE_TAG="$(python3 -B tools/upgrade_baseline.py)"
        test -n "$BASE_TAG" || { CI_STAGE_RESULT=no_baseline; echo "no WebVue-namespace release baseline; fresh-install gate remains binding"; exit 0; }
        SCRATCH_DB="webvue_ci_upgrade_scratch"
        SCRATCH_ROOT="$(mktemp -d)"
        mkdir -p "$SCRATCH_ROOT/data" "$SCRATCH_ROOT/logs"
        cleanup() { dropdb -h "$PGHOST" -p "$PGPORT" -U "$PGUSER" --if-exists "$SCRATCH_DB" 2>/dev/null || true; rm -rf "$SCRATCH_ROOT"; }
        trap 'status=$?; cleanup; ci_finish "$status"' EXIT
        dropdb -h "$PGHOST" -p "$PGPORT" -U "$PGUSER" --if-exists "$SCRATCH_DB" || true
        ODOO_DB_ARGS=(--db_host="$PGHOST" --db_port="$PGPORT" --db_user="$PGUSER")
        mkdir "$SCRATCH_ROOT/baseline"
        git archive "$BASE_TAG" | tar -x -C "$SCRATCH_ROOT/baseline"
        BASE_ODOO_ROOT="$ODOO_ROOT"
        BASE_ODOO_COMMIT="$(cat "$SCRATCH_ROOT/baseline/deploy/odoo/ODOO_COMMIT")"
        if [ "$BASE_ODOO_COMMIT" != "$(cat deploy/odoo/ODOO_COMMIT)" ]; then
          mkdir "$SCRATCH_ROOT/old-odoo"
          git -C "$ODOO_ROOT" archive "$BASE_ODOO_COMMIT" | tar -x -C "$SCRATCH_ROOT/old-odoo"
          BASE_ODOO_ROOT="$SCRATCH_ROOT/old-odoo"
        fi
        # Install the previous release
        if [ -n "$${WEBVUE_COMMERCIAL_CONFIG:-}" ]; then
          echo "previous release must not inherit a commercial classification" >&2
          exit 1
        fi
        "$ODOO_PYTHON" "$BASE_ODOO_ROOT/odoo-bin" "$${ODOO_DB_ARGS[@]}" \
          --addons-path="$BASE_ODOO_ROOT/odoo/addons,$BASE_ODOO_ROOT/addons,$SCRATCH_ROOT/baseline/odoo-addons" \
          --data-dir="$SCRATCH_ROOT/data" --logfile="$SCRATCH_ROOT/logs/odoo.log" \
          -d "$SCRATCH_DB" -i "$MODULES" --without-demo=all --http-port="$ODOO_PORT" --workers=0 --max-cron-threads=0 --stop-after-init
        # Upgrade to this commit. -i installs the addons the previous release did
        # not have (webvue_meetings, webvue_meetings_pmo); Odoo skips the installed ones.
        python3 deploy/classification.py fixture --database "$SCRATCH_DB" --mode saas --output "$SCRATCH_ROOT/upgrade-classification.json"
        export WEBVUE_COMMERCIAL_CONFIG="$SCRATCH_ROOT/upgrade-classification.json"
        "$ODOO_PYTHON" "$ODOO_ROOT/odoo-bin" "$${ODOO_DB_ARGS[@]}" \
          --addons-path="$ODOO_ROOT/odoo/addons,$ODOO_ROOT/addons,$PWD/odoo-addons" \
          --data-dir="$SCRATCH_ROOT/data" --logfile="$SCRATCH_ROOT/logs/upgrade.log" \
          -d "$SCRATCH_DB" -u "$MODULES" -i "$MODULES" --http-port="$ODOO_PORT" --workers=0 --max-cron-threads=0 --stop-after-init 2>&1 | tee "$SCRATCH_ROOT/upgrade-output.log"
        python3 -B tools/upgrade_log_guard.py "$SCRATCH_ROOT/logs/upgrade.log"
        # Post-upgrade smoke
        "$ODOO_PYTHON" "$ODOO_ROOT/odoo-bin" shell "$${ODOO_DB_ARGS[@]}" \
          --addons-path="$ODOO_ROOT/odoo/addons,$ODOO_ROOT/addons,$PWD/odoo-addons" \
          -d "$SCRATCH_DB" --http-port="$ODOO_PORT" --no-http < deploy/odoo/upgrade_smoke.py | tee "$SCRATCH_ROOT/smoke.log"
        grep -q UPGRADE_SMOKE_OK "$SCRATCH_ROOT/smoke.log"

  - name: restore-drill
    image: bash
    environment: *ci_environment
    commands:
      - |
        set -euo pipefail
        export PATH="/opt/homebrew/bin:/usr/local/bin:$PATH"
        source deploy/woodpecker/stage.sh restore-drill
        W="$(mktemp -d)"
        mkdir -p "$W/data" "$W/restored" "$W/logs"
        SRC_DB="webvue_drill_src_scratch"
        RST_DB="webvue_drill_restored_scratch"
        RST2_DB="webvue_drill_restored2_scratch"
        MODULES="$(python3 -B tools/catalog_check.py --release-modules)"
        cleanup() {
          if [ -n "$${SERVER_PID:-}" ]; then kill "$SERVER_PID" 2>/dev/null || true; wait "$SERVER_PID" 2>/dev/null || true; fi
          for db in "$SRC_DB" "$RST_DB" "$RST2_DB"; do dropdb -h "$PGHOST" -p "$PGPORT" -U "$PGUSER" --if-exists "$db" 2>/dev/null || true; done
          rm -rf "$W"
        }
        trap 'status=$?; cleanup; ci_finish "$status"' EXIT
        for db in "$SRC_DB" "$RST_DB" "$RST2_DB"; do dropdb -h "$PGHOST" -p "$PGPORT" -U "$PGUSER" --if-exists "$db" || true; done
        B="$(dirname "$(readlink -f "$(command -v pg_dump)")")"
        export WEBVUE_COMMERCIAL_CONFIG="$W/restore-classification.json"
        python3 deploy/classification.py fixture --database "$SRC_DB" --mode non_saas --output "$WEBVUE_COMMERCIAL_CONFIG"
        "$ODOO_PYTHON" "$ODOO_ROOT/odoo-bin" --db_host="$PGHOST" --db_port="$PGPORT" --db_user="$PGUSER" \
          --addons-path="$ODOO_ROOT/odoo/addons,$ODOO_ROOT/addons,$PWD/odoo-addons" --data-dir="$W/data" \
          -d "$SRC_DB" -i "$MODULES" \
          --without-demo=all --http-port="$ODOO_PORT" --workers=0 --max-cron-threads=0 --stop-after-init
        python3 deploy/backup.py --opt-in MANUAL_BACKUP_OPT_IN --acknowledge-unverified CANDIDATE_BACKUP_UNVERIFIED \
          --db-name "$SRC_DB" --filestore "$W/data/filestore/$SRC_DB" \
          --output-dir "$W/backup" --pg-dump "$B/pg_dump" --pg-host "$PGHOST" --pg-port "$PGPORT" --pg-user "$PGUSER"
        cp "$W/backup/manifest.json" "$W/original-manifest.json"
        verify() { python3 deploy/restore_verify.py --backup-dir "$W/backup" --target-db "$1" \
          --target-filestore "$W/restored/filestore/$1" --pg-restore "$B/pg_restore" --createdb "$B/createdb" \
          --psql "$B/psql" --pg-host "$PGHOST" --pg-port "$PGPORT" --pg-user "$PGUSER"; }
        verify "$RST_DB"
        # Classified restored databases must start without a mapping or billing service.
        unset WEBVUE_COMMERCIAL_CONFIG
        "$ODOO_PYTHON" "$ODOO_ROOT/odoo-bin" --db_host="$PGHOST" --db_port="$PGPORT" --db_user="$PGUSER" \
          --addons-path="$ODOO_ROOT/odoo/addons,$ODOO_ROOT/addons,$PWD/odoo-addons" --data-dir="$W/restored" \
          -d "$RST_DB" --http-port="$ODOO_PORT" --workers=0 --max-cron-threads=0 > "$W/restored-odoo.log" 2>&1 &
        SERVER_PID=$!
        for i in $(seq 1 60); do
          kill -0 "$SERVER_PID"
          if curl -fsS "http://127.0.0.1:$ODOO_PORT/web/health" >/dev/null; then break; fi
          sleep 1
        done
        curl -fsS -o /dev/null -w '%{http_code}\n' "http://127.0.0.1:$ODOO_PORT/web/health"
        kill "$SERVER_PID"; wait "$SERVER_PID" || true; SERVER_PID=
        missing="$(psql -h "$PGHOST" -p "$PGPORT" -U "$PGUSER" -d "$RST_DB" -At -v ON_ERROR_STOP=1 -c 'SELECT store_fname FROM ir_attachment WHERE store_fname IS NOT NULL ORDER BY store_fname LIMIT 1')"
        test -n "$missing"
        rm "$W/backup/filestore/$missing"
        if verify "$RST2_DB"; then echo "negative case passed unexpectedly"; exit 1; fi
        python3 -c 'import json,sys; r=json.load(open(sys.argv[1])); assert r["restore_verified"] is False; assert sys.argv[2] in r["checks"]["missing_attachment_files"]' "$W/backup/restore-verification.json" "$missing"
        cmp "$W/original-manifest.json" "$W/backup/manifest.json"

  - name: image
    image: bash
    environment: *ci_environment
    commands:
      - |
        set -euo pipefail
        export PATH="/opt/homebrew/bin:/usr/local/bin:$PATH"
        source deploy/woodpecker/stage.sh image
        docker info
        docker build -f deploy/odoo/Dockerfile --build-arg ODOO_COMMIT="$(cat deploy/odoo/ODOO_COMMIT)" --build-arg WEBVUE_REVISION="${CI_COMMIT_SHA:0:12}" -t "$WEBVUE_CI_IMAGE" .
        SCRATCH_DB="webvue_image_scratch"
        MODULES="$(python3 -B tools/catalog_check.py --release-modules)"
        IMAGE_ROOT="$WEBVUE_CI_RUN_DIR/image"
        mkdir -p "$IMAGE_ROOT"
        python3 deploy/classification.py fixture --database "$SCRATCH_DB" --mode non_saas --output "$IMAGE_ROOT/classification.json"
        printf '%s\n' '[options]' "db_host = $WEBVUE_CI_PG_CONTAINER" "db_user = $PGUSER" "db_password = $PGPASSWORD" 'list_db = False' > "$IMAGE_ROOT/odoo.conf"
        chmod 644 "$IMAGE_ROOT/odoo.conf" "$IMAGE_ROOT/classification.json"
        docker run --rm --name "$WEBVUE_CI_IMAGE_CONTAINER" --network "$WEBVUE_CI_NETWORK" -v "$IMAGE_ROOT/odoo.conf:/etc/odoo/odoo.conf:ro" \
          -v "$IMAGE_ROOT/classification.json:/run/webvue/classification.json:ro" \
          -e WEBVUE_COMMERCIAL_CONFIG=/run/webvue/classification.json "$WEBVUE_CI_IMAGE" \
          -d "$SCRATCH_DB" -i "$MODULES" --without-demo=all --http-port="$ODOO_PORT" --stop-after-init
        docker run --rm --name "$WEBVUE_CI_CHECK_CONTAINER" --entrypoint sh "$WEBVUE_CI_IMAGE" -c 'test ! -w /opt/webvue/addons && test "$(id -u)" = 10001 && ! command -v git'

  - name: e2e-mock
    image: bash
    environment: *ci_environment
    commands:
      - |
        set -euo pipefail
        export PATH="/opt/homebrew/bin:/usr/local/bin:$PATH"
        source deploy/woodpecker/stage.sh e2e-mock
        npm -w apps/web run postinstall
        cd apps/web
        npx playwright install chromium
        test -s e2e/ci-mock-specs.txt
        export PROJECTS_UI_PREVIEW=1 MODULE_UI_PREVIEW=1
        export NUXT_ODOO_URL="http://127.0.0.1:$MOCK_PORT" NUXT_ODOO_DB=webvue_ui_mock_only
        export NUXT_PUBLIC_WS_URL="ws://127.0.0.1:$MOCK_PORT/websocket"
        export E2E_BASE_URL="http://localhost:$WEB_PORT" E2E_PROJECT_POPUPS=1
        node e2e/internal-ui-audit-mock.mjs > mock.log 2>&1 &
        MOCK_PID=$!
        node e2e/ai-service-mock.mjs > ai-mock.log 2>&1 &
        AI_MOCK_PID=$!
        cleanup() {
          if [ -n "$${SERVER_PID:-}" ]; then kill "$SERVER_PID" 2>/dev/null || true; wait "$SERVER_PID" 2>/dev/null || true; fi
          kill "$MOCK_PID" "$AI_MOCK_PID" 2>/dev/null || true; wait "$MOCK_PID" "$AI_MOCK_PID" 2>/dev/null || true
        }
        trap 'status=$?; cleanup; ci_finish "$status"' EXIT
        # Built WITHOUT NUXT_AI_SERVICE_URL on purpose: /ai must follow the runtime value, not the build environment.
        npx nuxt build
        NUXT_AI_SERVICE_URL="http://127.0.0.1:$AI_MOCK_PORT" PORT="$WEB_PORT" node .output/server/index.mjs > nuxt.log 2>&1 &
        SERVER_PID=$!
        for i in $(seq 1 60); do
          kill -0 "$MOCK_PID" "$AI_MOCK_PID" "$SERVER_PID"
          if curl -fs "$E2E_BASE_URL/login" >/dev/null; then break; fi
          sleep 2
        done
        curl -fs "$E2E_BASE_URL/login" >/dev/null
        npx playwright test $(sed 's#^#e2e/#' e2e/ci-mock-specs.txt | tr '\n' ' ')

  # Every Storybook story must render in Arabic (RTL) at desktop and mobile width with no page
  # error and no sideways page scroll (apps/web/e2e-rtl). Builds Storybook; needs no server.
  - name: rtl-stories
    image: bash
    environment: *ci_environment
    commands:
      - |
        set -euo pipefail
        export PATH="/opt/homebrew/bin:/usr/local/bin:$PATH"
        source deploy/woodpecker/stage.sh rtl-stories
        npm -w apps/web run postinstall
        cd apps/web
        npx playwright install chromium
        npm run test:rtl
