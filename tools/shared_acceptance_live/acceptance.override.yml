# Acceptance compose override — layered after docker-compose.yml + docker-compose.shared.yml.
#
# PATH BASE: up.sh/down.sh run `docker compose` with the working directory set to
# `deploy/` and do NOT pass --project-directory. Compose therefore resolves every
# relative bind-mount source against `deploy/`, which is also the directory of the
# first -f file. That keeps the committed shared overlay's own `./shared/*` mounts
# working, and this file refers to tooling as `../tools/shared_acceptance_live/...`.
# Passing --project-directory <repo-root> breaks the committed `./shared/*` mounts
# (and bare relative sources then parse as named volumes), so do not reintroduce it.
#
# Edge binds to 127.0.0.1 on standard ports 443/80 because guard.mjs resolves
# req.headers.host through tenantHostResolver.ts which rejects Host values containing
# a port (hostPattern only matches [a-z0-9.-]). Caddy forwards the incoming Host
# header unchanged, so non-standard ports would cause 403 on every request.
services:
  proxy:
    image: liwan-accept-caddy:${LIWAN_IMAGE_TAG:?set LIWAN_IMAGE_TAG}
    # NOTE: `!reset` REPLACES the inherited value and therefore yields an EMPTY
    # list, not "clear, then apply mine" — writing `ports: !reset` plus a list here
    # silently removes port publishing entirely (the containers showed target=N,
    # published=0 and nothing was listening on the host). `!override` is the tag
    # that discards the inherited value and adopts exactly this list.
    ports: !override
      - "${LIWAN_EDGE_BIND:-127.0.0.1}:${LIWAN_EDGE_HTTPS_PORT:-443}:443"
      - "${LIWAN_EDGE_BIND:-127.0.0.1}:${LIWAN_EDGE_HTTP_PORT:-80}:80"
    environment:
      # Space-separated: Caddy accepts space-separated site addresses, and this
      # matches how the base compose passes "${DOMAIN}" through to {$DOMAIN}.
      DOMAIN: "a.accept.liwan.test b.accept.liwan.test"
    volumes:
      - ../tools/shared_acceptance_live/acceptance.Caddyfile:/etc/caddy/Caddyfile:ro
      - ./shared/Caddyfile:/etc/caddy/production.Caddyfile:ro
      - caddy_data:/data
    # No healthcheck exists for proxy in the base or shared files. A TLS request to
    # the bare loopback IP cannot work: Caddy serves certificates for the registry
    # hostname, connecting to 127.0.0.1 sends SNI "127.0.0.1", and Caddy aborts the
    # handshake with "tlsv1 alert internal error" — that check can never pass.
    #
    # This image is the official caddy:alpine runtime (no node, no python, no curl),
    # so the check is Caddy-native and positive:
    #   1. the admin API answers, and the LIVE config it returns contains the tenant
    #      host — i.e. the acceptance Caddyfile was loaded, not a stale one;
    #   2. the pinned caddy-ratelimit module is actually compiled into the binary.
    # The actual TLS listener is proven from the host by up.sh's readiness probe and
    # by probe.mjs (real chain verification with the exported root CA).
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O - http://127.0.0.1:2019/config/ | grep -q 'a.accept.liwan.test' && caddy list-modules | grep -q '^http.handlers.rate_limit$'"]
      interval: 5s
      timeout: 5s
      retries: 24
      start_period: 10s

  # web: NO healthcheck or depends_on override in r2. The committed shared overlay
  # already replaces the base /login healthcheck with the loopback TCP 3000 liveness
  # check, and the committed ordering (web depends on odoo: service_healthy from the
  # base file; guard on web+odoo healthy; proxy on guard healthy) is exercised
  # unchanged, so r2 proves production ordering rather than a harness-shaped one.
  # Only the image tag is pinned (base compose declares build-only, so the image
  # must be named for the prebuilt local images).
  web:
    image: liwan-web:${LIWAN_IMAGE_TAG:?set LIWAN_IMAGE_TAG}

  # Odoo healthcheck is defined in deploy/docker-compose.shared.yml (TCP listener check).
  # The harness does not override it anymore.
  #
  # liwan_platform refuses to install without LIWAN_COMMERCIAL_CONFIG: the tenant
  # profile post_init_hook calls commercial_config.load_classification(), which
  # requires an absolute path to a local, database-bound classification file
  # (exact key set, database name must match, explicit saas/non_saas). up.sh
  # generates one file per tenant database with the repository's own generator
  # (deploy/classification.py fixture --mode saas) into
  # $LIWAN_COMMERCIAL_CONFIG_DIR, and overrides this variable per database for the
  # init and seeding commands.
  #
  # The steady-state server gets an EMPTY value: load_classification() runs only
  # inside liwan.tenant.profile.create(), the profile is persisted at install, and
  # a classified database must start without the mapping — the same
  # `unset LIWAN_COMMERCIAL_CONFIG` precedent the CI restore step uses before
  # starting the service.
  odoo:
    environment:
      LIWAN_COMMERCIAL_CONFIG: ""
    volumes:
      - ${LIWAN_SHARED_ODOO_CONFIG:?set LIWAN_SHARED_ODOO_CONFIG to validated external secret config}:/etc/odoo/odoo.conf:ro
      - ${LIWAN_COMMERCIAL_CONFIG_DIR:?set LIWAN_COMMERCIAL_CONFIG_DIR}:/etc/liwan-commercial:ro
      - ./shared/launch_odoo.py:/opt/liwan/shared/launch_odoo.py:ro
      - ./shared/validate_odoo_config.py:/opt/liwan/shared/validate_odoo_config.py:ro
      - odoo_data:/var/lib/odoo

  guard:
    image: liwan-guard:${LIWAN_IMAGE_TAG:?set LIWAN_IMAGE_TAG}

# The host daemon's predefined address pools are fully subnetted (every
# 172.17-172.31 /16 and most 192.168.x/20 are taken by unrelated running
# projects), so a project created from the default pool fails with "all
# predefined address pools have been fully subnetted". Explicit subnets are
# accepted regardless of pool exhaustion and do not need pool arbitration.
#
# Ranges are chosen inside 10.240.0.0/16 with the 10.24x third octet held back
# (/20 granularity) so they stay clear of the one unrelated 10.x network on this
# host (10.253.100.0/24) and of every default-pool range.
#
# guard_web / guard_odoo / database stay internal (no route off the host); the
# internal flag is inherited from deploy/docker-compose.shared.yml.
networks:
  edge:
    ipam:
      config:
        - subnet: 10.240.2.0/24
  guard_web:
    ipam:
      config:
        - subnet: 10.240.4.0/24
  guard_odoo:
    ipam:
      config:
        - subnet: 10.240.6.0/24
  database:
    ipam:
      config:
        - subnet: 10.240.8.0/24

