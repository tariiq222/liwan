# Dedicated local acceptance project. Select via lifecycle.py; never shares volumes.
services:
  db:
    image: postgres:16@sha256:e17e86066e5ef83e0952a9347f5c792b7ece00972e2aa787a6986f471b3dd3d5
    environment:
      POSTGRES_USER: odoo
      POSTGRES_PASSWORD: ${DB_PASSWORD:?}
    volumes: [tenant_db:/var/lib/postgresql/data]
    networks: [database]
    healthcheck:
      test: [CMD-SHELL, "pg_isready -U odoo -d postgres"]
      interval: 2s
      timeout: 3s
      retries: 60
  odoo:
    image: ${ODOO_IMAGE:?}
    environment:
      NASQ_TENANCY_MODE: shared
      NASQ_COMMERCIAL_CONFIG: ""
    entrypoint: [/opt/venv/bin/python, /opt/nasq/shared/launch_odoo.py]
    command: []
    volumes:
      - ${NASQ_LIFECYCLE_STATE:?}/odoo.conf:/etc/odoo/odoo.conf:ro
      - ${NASQ_REPO_ROOT:?}/deploy/shared:/opt/nasq/shared:ro
      - ${NASQ_LIFECYCLE_STATE:?}:/run/nasq-runtime:ro
      - tenant_files:/var/lib/odoo
    networks: [database, guard_odoo]
    depends_on:
      db: {condition: service_healthy}
    healthcheck:
      test: [CMD, /opt/venv/bin/python, -c, "import socket; socket.create_connection(('127.0.0.1',8069),2).close()"]
      interval: 3s
      timeout: 3s
      retries: 60
  web:
    image: ${SHARED_WEB_IMAGE:?}
    environment:
      NASQ_TENANCY_MODE: shared
      NASQ_TENANT_REGISTRY_PATH: /etc/nasq/registry.json
      NASQ_SHARED_PROXY_TOKEN: ${PROXY_TOKEN:?}
      NUXT_ODOO_URL: http://guard:8080
      NUXT_ODOO_DB: ""
      NUXT_PUBLIC_WS_URL: ""
    volumes: ["${NASQ_LIFECYCLE_STATE:?}/registry:/etc/nasq:ro"]
    networks: [guard_web]
    healthcheck:
      test: [CMD, node, -e, "const s=require('net').connect(3000,'127.0.0.1',()=>{s.end();process.exit(0)});s.on('error',()=>process.exit(1))"]
      interval: 3s
      timeout: 3s
      retries: 60
  guard:
    # Empty bootstrap registry fails closed until the first disabled binding is published.
    restart: on-failure
    image: ${GUARD_IMAGE:?}
    environment:
      NASQ_TENANCY_MODE: shared
      NASQ_TENANT_REGISTRY_PATH: /etc/nasq/registry.json
      NASQ_SHARED_PROXY_TOKEN: ${PROXY_TOKEN:?}
      NASQ_SESSION_KEYS: ${SESSION_KEYS:?}
      NASQ_SESSION_ACTIVE_KID: k1
      NASQ_GUARD_ODOO_URL: http://odoo:8069
      NASQ_GUARD_WEB_URL: http://web:3000
      NASQ_GUARD_WS_URL: http://odoo:8072
      NASQ_GUARD_PORT: "8080"
    volumes: ["${NASQ_LIFECYCLE_STATE:?}/registry:/etc/nasq:ro"]
    networks: [edge, guard_web, guard_odoo]
    depends_on:
      web: {condition: service_healthy}
      odoo: {condition: service_healthy}
    healthcheck:
      test: [CMD, node, deploy/shared/healthcheck.mjs]
      interval: 3s
      timeout: 3s
      retries: 60
  vendor-db:
    image: postgres:16@sha256:e17e86066e5ef83e0952a9347f5c792b7ece00972e2aa787a6986f471b3dd3d5
    environment:
      POSTGRES_USER: odoo
      POSTGRES_PASSWORD: ${VENDOR_DB_PASSWORD:?}
    volumes: [vendor_db:/var/lib/postgresql/data]
    networks: [vendor_database]
    healthcheck:
      test: [CMD-SHELL, "pg_isready -U odoo -d postgres"]
      interval: 2s
      timeout: 3s
      retries: 60
  vendor-odoo:
    image: ${ODOO_IMAGE:?}
    environment:
      NASQ_COMMERCIAL_CONFIG: ""
    volumes:
      - ${NASQ_LIFECYCLE_STATE:?}/vendor-odoo.conf:/etc/odoo/odoo.conf:ro
      - ${NASQ_LIFECYCLE_STATE:?}:/run/nasq-runtime:ro
      - vendor_files:/var/lib/odoo
    networks: [vendor_database, vendor]
    depends_on:
      vendor-db: {condition: service_healthy}
    healthcheck:
      test: [CMD, /opt/venv/bin/python, -c, "import socket; socket.create_connection(('127.0.0.1',8069),2).close()"]
      interval: 3s
      timeout: 3s
      retries: 60
  vendor-web:
    image: ${VENDOR_WEB_IMAGE:?}
    environment:
      NUXT_ODOO_URL: http://vendor-odoo:8069
      NUXT_ODOO_DB: nasq_vendor_scratch
      NUXT_PUBLIC_WS_URL: ""
      NUXT_VENDOR_WORKSPACE_ENABLED: "true"
      NUXT_PUBLIC_VENDOR_WORKSPACE_ENABLED: "true"
      NUXT_VENDOR_CONTROL_URL: https://control-api:4187
      NUXT_VENDOR_SERVICE_KEY: ${CONTROL_SERVICE_KEY:?}
      NUXT_VENDOR_INSTALLATION_ID: saas-lifecycle-vendor
      NUXT_VENDOR_PUBLIC_ORIGIN: https://vendor.saas.accept.nasq.test
      NODE_EXTRA_CA_CERTS: /run/control-ca.pem
    volumes: ["${NASQ_LIFECYCLE_STATE:?}/control-cert.pem:/run/control-ca.pem:ro"]
    networks: [vendor, control]
    healthcheck:
      test: [CMD, node, -e, "fetch('http://127.0.0.1:3000/login').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 5s
      timeout: 5s
      retries: 60
  control-db:
    image: postgres:16@sha256:e17e86066e5ef83e0952a9347f5c792b7ece00972e2aa787a6986f471b3dd3d5
    environment:
      POSTGRES_USER: nasq_control
      POSTGRES_DB: nasq_control_scratch_lifecycle
      POSTGRES_PASSWORD: ${CONTROL_DB_PASSWORD:?}
    volumes: [control_db:/var/lib/postgresql/data]
    networks: [control]
    ports: ["127.0.0.1:55447:5432"]
    healthcheck:
      test: [CMD-SHELL, "pg_isready -U nasq_control -d nasq_control_scratch_lifecycle"]
      interval: 2s
      timeout: 3s
      retries: 60
  control-api:
    image: ${CONTROL_IMAGE:?}
    working_dir: /repo
    environment: &control-env
      CONTROL_DATABASE_URL: postgresql://nasq_control:${CONTROL_DB_PASSWORD:?}@control-db:5432/nasq_control_scratch_lifecycle
      CONTROL_INSTALLATION_ID: saas-lifecycle-vendor
      CONTROL_SERVICE_KEY: ${CONTROL_SERVICE_KEY:?}
      CONTROL_HOST: 0.0.0.0
      CONTROL_PORT: "4187"
      CONTROL_TLS_KEY: ${NASQ_LIFECYCLE_STATE:?}/control-key.pem
      CONTROL_TLS_CERT: ${NASQ_LIFECYCLE_STATE:?}/control-cert.pem
      NASQ_TENANCY_MODE: shared
      NASQ_TENANT_REGISTRY_PATH: ${NASQ_LIFECYCLE_STATE:?}/registry/registry.json
      NASQ_SHARED_RUNTIME_CONFIG: ${NASQ_LIFECYCLE_STATE:?}/runtime.json
      NASQ_CLI_INVENTORY: ${NASQ_LIFECYCLE_STATE:?}/inventory.json
      NASQ_CLI_STATE_DIR: ${NASQ_LIFECYCLE_STATE:?}/operator
      NASQ_REPOSITORY_ROOT: /repo
      NASQ_CLI_PYTHON: python3
    volumes: &control-volumes
      - ${NASQ_REPO_ROOT:?}:/repo
      - ${NASQ_REPO_ROOT:?}:${NASQ_REPO_ROOT:?}
      - control_modules:/repo/node_modules
    networks: [control]
    depends_on:
      control-db: {condition: service_healthy}
    healthcheck:
      test: [CMD, node, -e, "require('https').get('https://control-api:4187/healthz',{ca:require('fs').readFileSync(process.env.CONTROL_TLS_CERT)},r=>process.exit(r.statusCode===200?0:1)).on('error',()=>process.exit(1))"]
      interval: 3s
      timeout: 3s
      retries: 60
  control-worker:
    image: ${CONTROL_IMAGE:?}
    working_dir: /repo
    command: [npm, -w, apps/control-plane, run, 'worker:shared']
    environment: *control-env
    volumes:
      - ${NASQ_REPO_ROOT:?}:/repo
      - ${NASQ_REPO_ROOT:?}:${NASQ_REPO_ROOT:?}
      - control_modules:/repo/node_modules
      - /var/run/docker.sock:/var/run/docker.sock
    networks: [control]
    depends_on:
      control-api: {condition: service_healthy}
  restore-db:
    profiles: [restore]
    image: postgres:16@sha256:e17e86066e5ef83e0952a9347f5c792b7ece00972e2aa787a6986f471b3dd3d5
    environment:
      POSTGRES_USER: odoo
      POSTGRES_PASSWORD: ${RESTORE_DB_PASSWORD:?}
    volumes: [restore_db:/var/lib/postgresql/data]
    networks: [restore_database]
    healthcheck:
      test: [CMD-SHELL, "pg_isready -U odoo -d postgres"]
      interval: 2s
      timeout: 3s
      retries: 60
  restore-odoo:
    profiles: [restore]
    image: ${ODOO_IMAGE:?}
    environment:
      NASQ_TENANCY_MODE: shared
      NASQ_COMMERCIAL_CONFIG: ""
    entrypoint: [/opt/venv/bin/python, /opt/nasq/shared/launch_odoo.py]
    command: []
    volumes:
      - ${NASQ_LIFECYCLE_STATE:?}/restore-odoo.conf:/etc/odoo/odoo.conf:ro
      - ${NASQ_REPO_ROOT:?}/deploy/shared:/opt/nasq/shared:ro
      - ${NASQ_LIFECYCLE_STATE:?}:/run/nasq-runtime:ro
      - restore_files:/var/lib/odoo
    networks: [restore_database, restore_guard_odoo]
    depends_on:
      restore-db: {condition: service_healthy}
    healthcheck:
      test: [CMD, /opt/venv/bin/python, -c, "import socket; socket.create_connection(('127.0.0.1',8069),2).close()"]
      interval: 3s
      timeout: 3s
      retries: 60
  restore-web:
    profiles: [restore]
    image: ${SHARED_WEB_IMAGE:?}
    environment:
      NASQ_TENANCY_MODE: shared
      NASQ_TENANT_REGISTRY_PATH: /etc/nasq/registry.json
      NASQ_SHARED_PROXY_TOKEN: ${RESTORE_PROXY_TOKEN:?}
      NUXT_ODOO_URL: http://restore-guard:8080
      NUXT_ODOO_DB: ""
      NUXT_PUBLIC_WS_URL: ""
    volumes: ["${NASQ_LIFECYCLE_STATE:?}/restore-registry:/etc/nasq:ro"]
    networks: [restore_guard_web]
    healthcheck:
      test: [CMD, node, -e, "const s=require('net').connect(3000,'127.0.0.1',()=>{s.end();process.exit(0)});s.on('error',()=>process.exit(1))"]
      interval: 3s
      timeout: 3s
      retries: 60
  restore-guard:
    profiles: [restore]
    restart: on-failure
    image: ${GUARD_IMAGE:?}
    environment:
      NASQ_TENANCY_MODE: shared
      NASQ_TENANT_REGISTRY_PATH: /etc/nasq/registry.json
      NASQ_SHARED_PROXY_TOKEN: ${RESTORE_PROXY_TOKEN:?}
      NASQ_SESSION_KEYS: ${RESTORE_SESSION_KEYS:?}
      NASQ_SESSION_ACTIVE_KID: r1
      NASQ_GUARD_ODOO_URL: http://restore-odoo:8069
      NASQ_GUARD_WEB_URL: http://restore-web:3000
      NASQ_GUARD_WS_URL: http://restore-odoo:8072
      NASQ_GUARD_PORT: "8080"
    volumes: ["${NASQ_LIFECYCLE_STATE:?}/restore-registry:/etc/nasq:ro"]
    networks: [restore_edge, restore_guard_web, restore_guard_odoo]
    depends_on:
      restore-web: {condition: service_healthy}
      restore-odoo: {condition: service_healthy}
    healthcheck:
      test: [CMD, node, deploy/shared/healthcheck.mjs]
      interval: 3s
      timeout: 3s
      retries: 60
  proxy:
    image: ${CADDY_IMAGE:?}
    environment:
      DOMAIN: '*.saas.accept.nasq.test'
    volumes:
      - ${NASQ_REPO_ROOT:?}/tools/shared_saas_lifecycle/Caddyfile:/etc/caddy/Caddyfile:ro
      - ${NASQ_REPO_ROOT:?}/deploy/shared/Caddyfile:/etc/caddy/production.Caddyfile:ro
      - ${NASQ_LIFECYCLE_STATE:?}/restore.Caddyfile:/etc/caddy/restore.Caddyfile:ro
      - edge_data:/data
    ports: ["127.0.0.1:443:443", "127.0.0.1:80:80"]
    networks: [edge, vendor, restore_edge]
volumes:
  restore_db: {}
  restore_files: {}
  tenant_db: {}
  tenant_files: {}
  vendor_db: {}
  vendor_files: {}
  control_db: {}
  control_modules: {}
  edge_data: {}
networks:
  edge:
    external: true
    name: ${NASQ_PROJECT:?}_edge
  guard_web:
    external: true
    name: ${NASQ_PROJECT:?}_guard_web
  guard_odoo:
    external: true
    name: ${NASQ_PROJECT:?}_guard_odoo
  database:
    external: true
    name: ${NASQ_PROJECT:?}_database
  vendor:
    external: true
    name: ${NASQ_PROJECT:?}_vendor
  vendor_database:
    external: true
    name: ${NASQ_PROJECT:?}_vendor_database
  control:
    external: true
    name: ${NASQ_PROJECT:?}_control
  restore_edge:
    external: true
    name: ${NASQ_PROJECT:?}_restore_edge
  restore_database:
    external: true
    name: ${NASQ_PROJECT:?}_restore_database
  restore_guard_web:
    external: true
    name: ${NASQ_PROJECT:?}_restore_guard_web
  restore_guard_odoo:
    external: true
    name: ${NASQ_PROJECT:?}_restore_guard_odoo
