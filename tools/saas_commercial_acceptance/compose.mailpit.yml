name: nasq-saas-commercial-mail
services:
  mailpit:
    image: axllent/mailpit:latest
    network_mode: bridge  # docker address pools exhausted on this host; reuse default bridge
    container_name: nasq-saas-commercial-mailpit
    labels:
      com.nasq.owner: saas-commercial
    ports:
      - "127.0.0.1:${NASQ_MAILPIT_SMTP_PORT:-55425}:1025"
      - "127.0.0.1:${NASQ_MAILPIT_API_PORT:-55426}:8025"
