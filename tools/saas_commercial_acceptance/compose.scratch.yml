name: nasq-saas-commercial
services:
  control-pg:
    image: postgres:16
    network_mode: bridge  # docker address pools exhausted on this host; reuse default bridge, no new network
    container_name: nasq-saas-commercial-control-pg
    labels:
      com.nasq.owner: saas-commercial
    environment:
      POSTGRES_USER: nasq_test
      POSTGRES_PASSWORD: ${NASQ_COMMERCIAL_PG_PASSWORD:?source scratch-env.sh first}
      POSTGRES_DB: postgres
    ports:
      - "127.0.0.1:${NASQ_COMMERCIAL_PG_PORT:-55491}:5432"
    volumes:
      - control-pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nasq_test -d postgres"]
      interval: 3s
      timeout: 3s
      retries: 30
volumes:
  control-pg:
    name: nasq-saas-commercial-control-pg
    labels:
      com.nasq.owner: saas-commercial
