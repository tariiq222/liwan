# Render after the committed shared overlay. No pre-seeded tenants or product patches.
services:
  proxy:
    image: liwan-accept-caddy:${LIWAN_IMAGE_TAG:?}
    volumes:
      - ${FOUNDATION_CADDYFILE:?}:/etc/caddy/Caddyfile:ro
      - ./shared/Caddyfile:/etc/caddy/production.Caddyfile:ro
      - caddy_data:/data
    environment:
      DOMAIN: "*.${FOUNDATION_DOMAIN_SUFFIX:?}"
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O - http://127.0.0.1:2019/config/ | grep -q '${FOUNDATION_DOMAIN_SUFFIX}' && caddy list-modules | grep -q '^http.handlers.rate_limit$'"]
      interval: 3s
      timeout: 5s
      retries: 60
  web:
    image: liwan-web:${LIWAN_IMAGE_TAG:?}
  odoo:
    environment:
      LIWAN_COMMERCIAL_CONFIG: ""
    volumes:
      - ${LIWAN_SHARED_ODOO_CONFIG:?}:/etc/odoo/odoo.conf:ro
      - ${FOUNDATION_STATE_DIR:?}:/run/liwan-runtime:ro
      - odoo_data:/var/lib/odoo
  control-db:
    image: postgres:16
    ports: ["127.0.0.1:${FOUNDATION_CONTROL_DB_PORT:?}:5432"]
    environment:
      POSTGRES_USER: foundation
      POSTGRES_DB: liwan_control_scratch_foundation
      POSTGRES_PASSWORD: ${FOUNDATION_CONTROL_DB_PASSWORD:?}
    volumes: [control_data:/var/lib/postgresql/data]
    networks: [control_database]
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "foundation", "-d", "liwan_control_scratch_foundation"]
      interval: 2s
      timeout: 3s
      retries: 60
networks:
  edge:
    ipam: { config: [{ subnet: "${FOUNDATION_NET_EDGE:?}" }] }
  guard_web:
    ipam: { config: [{ subnet: "${FOUNDATION_NET_WEB:?}" }] }
  guard_odoo:
    ipam: { config: [{ subnet: "${FOUNDATION_NET_ODOO:?}" }] }
  database:
    ipam: { config: [{ subnet: "${FOUNDATION_NET_DB:?}" }] }
  control_database:
    ipam: { config: [{ subnet: "${FOUNDATION_NET_CONTROL:?}" }] }
volumes:
  control_data: {}
